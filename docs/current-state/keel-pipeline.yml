groups:
- jobs:
  - set-pipeline
  - build
  - lint
  - test
  - full-suite
  - build-and-attest
  - verify-artifact
  name: commit
- jobs:
  - sast
  - secrets
  - sca
  - iac
  - suppression-audit
  - container-scan
  name: security
- jobs:
  - platform-integrity
  - suppression-audit
  - compliance-daily
  - compliance-weekly
  - compliance-monthly
  - metrics-snapshot
  name: governance
- jobs:
  - ai-evals
  - ai-guardrails
  - agent-assurance
  name: ai
- jobs:
  - mykronos-sast
  - mykronos-secrets
  - mykronos-atlas
  name: mykronos
- jobs:
  - release-preflight
  - authorize-release
  name: release
- jobs:
  - ai-guardrails
  - agent-assurance
  - compliance-daily
  - compliance-weekly
  - compliance-monthly
  - metrics-snapshot
  name: scheduled
- jobs:
  - '*'
  name: all
jobs:
- name: build
  plan:
  - get: repo
    trigger: true
  - get: daily
    trigger: true
  - file: repo/ci/tasks/ci-stage.yml
    params:
      STAGE: build
    task: build
  public: true
- name: lint
  plan:
  - get: repo
    trigger: true
  - get: daily
    trigger: true
  - file: repo/ci/tasks/shellcheck.yml
    task: shellcheck
  - file: repo/ci/tasks/ci-stage.yml
    params:
      STAGE: lint
    task: lint
  public: true
- name: test
  plan:
  - get: repo
    trigger: true
  - get: daily
    trigger: true
  - file: repo/ci/tasks/ci-stage.yml
    params:
      COVERAGE_THRESHOLD: "80"
      STAGE: test
    task: test
  public: true
- name: full-suite
  plan:
  - get: repo
    passed:
    - build
    - lint
    - test
    trigger: true
  - file: repo/ci/tasks/ci-stage.yml
    params:
      STAGE: full-suite
    task: full-suite
  public: true
- name: secrets
  plan:
  - get: repo
    trigger: true
  - get: daily
    trigger: true
  - file: repo/ci/tasks/gitleaks.yml
    task: gitleaks
  - file: repo/ci/tasks/gitleaks-gate.yml
    task: gate
  public: true
- name: sca
  plan:
  - get: repo
    trigger: true
  - get: daily
    trigger: true
  - file: repo/ci/tasks/grype.yml
    params:
      GRYPE_SHA256: 38525dab1e06f162ebaa02f94d82d1f807076b011a44180cf2777edf1a7b9c26
      GRYPE_VERSION: 0.117.0
      SEVERITY_CUTOFF: high
    task: grype
  public: true
- name: iac
  plan:
  - get: repo
    trigger: true
  - get: daily
    trigger: true
  - file: repo/ci/tasks/checkov.yml
    params:
      CHECKOV_VERSION: 3.3.10
    task: checkov
  public: true
- name: container-scan
  plan:
  - get: repo
  - file: repo/ci/tasks/trivy.yml
    params:
      TRIVY_SHA256: 2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b
      TRIVY_VERSION: 0.73.0
    task: trivy
  public: true
- name: suppression-audit
  plan:
  - get: repo
    trigger: true
  - get: daily
    trigger: true
  - file: repo/ci/tasks/suppression-audit.yml
    task: suppression-audit
  public: true
- name: mykronos-sast
  plan:
  - get: repo
    trigger: true
  - get: weekly
    trigger: true
  - do:
    - file: repo/ci/tasks/mykronos-preflight.yml
      params:
        MYKRONOS_INGESTION_TOKEN: ((mykronos_ingestion_token))
        MYKRONOS_INGESTION_URL: https://mykronos.toddbenson.net
      task: mykronos-preflight
    - file: repo/ci/tasks/codeql.yml
      output_mapping:
        mykronos-results: results-python
      params:
        CODEQL_BUNDLE_SHA256: 77e5be1b550d66662e600e795b6cf2ea1729e853e3dc79e02594f767039d2a29
        CODEQL_BUNDLE_VERSION: v2.26.3
        CODEQL_LANGUAGE: python
        CODEQL_QUERIES: security-extended
        UPLOAD_TO_MYKRONOS: "true"
      task: codeql-python
    - file: repo/ci/tasks/codeql.yml
      output_mapping:
        mykronos-results: results-javascript
      params:
        CODEQL_BUNDLE_SHA256: 77e5be1b550d66662e600e795b6cf2ea1729e853e3dc79e02594f767039d2a29
        CODEQL_BUNDLE_VERSION: v2.26.3
        CODEQL_LANGUAGE: javascript-typescript
        CODEQL_QUERIES: security-extended
        UPLOAD_TO_MYKRONOS: "true"
      task: codeql-javascript
    ensure:
      do:
      - ensure:
          file: repo/ci/tasks/mykronos-upload.yml
          input_mapping:
            mykronos-results: results-javascript
          params:
            BLOCKING: "false"
            CAPABILITY: sast
            MYKRONOS_INGESTION_TOKEN: ((mykronos_ingestion_token))
            MYKRONOS_INGESTION_URL: https://mykronos.toddbenson.net
            MYKRONOS_REF: 8b329fc5c1f739eab8ad40b8a7628da7cd1ee935
            REPO_SLUG: ToddGBenson/keel
            SEVERITY_THRESHOLD: low
            TOOL: codeql
            TRIGGERED_BY: schedule
          task: upload-javascript
        file: repo/ci/tasks/mykronos-upload.yml
        input_mapping:
          mykronos-results: results-python
        params:
          BLOCKING: "false"
          CAPABILITY: sast
          MYKRONOS_INGESTION_TOKEN: ((mykronos_ingestion_token))
          MYKRONOS_INGESTION_URL: https://mykronos.toddbenson.net
          MYKRONOS_REF: 8b329fc5c1f739eab8ad40b8a7628da7cd1ee935
          REPO_SLUG: ToddGBenson/keel
          SEVERITY_THRESHOLD: low
          TOOL: codeql
          TRIGGERED_BY: schedule
        task: upload-python
  public: true
  serial: true
- name: mykronos-secrets
  plan:
  - get: repo
    trigger: true
  - get: weekly
    trigger: true
  - do:
    - file: repo/ci/tasks/mykronos-preflight.yml
      params:
        MYKRONOS_INGESTION_TOKEN: ((mykronos_ingestion_token))
        MYKRONOS_INGESTION_URL: https://mykronos.toddbenson.net
      task: mykronos-preflight
    - file: repo/ci/tasks/gitleaks.yml
      task: gitleaks
    ensure:
      file: repo/ci/tasks/mykronos-upload.yml
      params:
        BLOCKING: "false"
        CAPABILITY: secrets
        MYKRONOS_INGESTION_TOKEN: ((mykronos_ingestion_token))
        MYKRONOS_INGESTION_URL: https://mykronos.toddbenson.net
        MYKRONOS_REF: 8b329fc5c1f739eab8ad40b8a7628da7cd1ee935
        REPO_SLUG: ToddGBenson/keel
        SEVERITY_THRESHOLD: low
        TOOL: gitleaks
        TRIGGERED_BY: schedule
      task: upload
  public: true
- name: mykronos-atlas
  plan:
  - get: repo
    trigger: true
  - get: weekly
    trigger: true
  - do:
    - file: repo/ci/tasks/mykronos-preflight.yml
      params:
        MYKRONOS_INGESTION_TOKEN: ((mykronos_ingestion_token))
        MYKRONOS_INGESTION_URL: https://mykronos.toddbenson.net
      task: mykronos-preflight
    - file: repo/ci/tasks/osv-scan.yml
      task: osv-scan
    - file: repo/ci/tasks/sbom.yml
      task: sbom
    - file: repo/ci/tasks/sbom-check.yml
      task: sbom-check
    ensure:
      do:
      - ensure:
          file: repo/ci/tasks/atlas-evidence.yml
          params:
            MYKRONOS_INGESTION_TOKEN: ((mykronos_ingestion_token))
            MYKRONOS_INGESTION_URL: https://mykronos.toddbenson.net
            MYKRONOS_REF: 8b329fc5c1f739eab8ad40b8a7628da7cd1ee935
            REPO_SLUG: ToddGBenson/keel
          task: atlas-evidence
        file: repo/ci/tasks/mykronos-upload.yml
        params:
          BLOCKING: "false"
          CAPABILITY: atlas
          MYKRONOS_INGESTION_TOKEN: ((mykronos_ingestion_token))
          MYKRONOS_INGESTION_URL: https://mykronos.toddbenson.net
          MYKRONOS_REF: 8b329fc5c1f739eab8ad40b8a7628da7cd1ee935
          REPO_SLUG: ToddGBenson/keel
          SEVERITY_THRESHOLD: low
          TOOL: osv-scanner
          TRIGGERED_BY: schedule
        task: upload
  public: true
  serial: true
- name: platform-integrity
  plan:
  - get: repo
    trigger: true
  - get: daily
    trigger: true
  - file: repo/ci/tasks/platform-integrity.yml
    task: platform-integrity
  public: true
- name: ai-evals
  plan:
  - get: repo
    trigger: true
  - get: weekly
    trigger: true
  - file: repo/ci/tasks/ai.yml
    params:
      ANTHROPIC_API_KEY: ((anthropic_api_key))
      STAGE: evals
    task: evals
  public: true
- name: ai-guardrails
  plan:
  - get: repo
  - get: weekly
    trigger: true
  - file: repo/ci/tasks/ai.yml
    params:
      STAGE: guardrails
    task: guardrails
  public: true
- name: agent-assurance
  plan:
  - get: repo
  - get: weekly
    trigger: true
  - file: repo/ci/tasks/ai.yml
    params:
      STAGE: agent-assurance
    task: agent-assurance
  public: true
- name: compliance-daily
  plan:
  - get: repo
  - get: daily
    trigger: true
  - file: repo/ci/tasks/compliance.yml
    params:
      PERIOD: daily
      REPO_SLUG: ToddGBenson/keel
    task: compliance
  public: true
- name: compliance-weekly
  plan:
  - get: repo
  - get: weekly
    trigger: true
  - file: repo/ci/tasks/compliance.yml
    params:
      PERIOD: weekly
      REPO_SLUG: ToddGBenson/keel
    task: compliance
  public: true
- name: compliance-monthly
  plan:
  - get: repo
  - get: weekly
    trigger: true
  - file: repo/ci/tasks/compliance.yml
    params:
      PERIOD: monthly
      REPO_SLUG: ToddGBenson/keel
    task: compliance
  public: true
- name: metrics-snapshot
  plan:
  - get: repo
  - get: weekly
    trigger: true
  - file: repo/ci/tasks/compliance.yml
    params:
      PERIOD: metrics
      REPO_SLUG: ToddGBenson/keel
    task: metrics
  public: true
- name: build-and-attest
  plan:
  - get: repo
    passed:
    - full-suite
    trigger: true
  - file: repo/ci/tasks/sbom.yml
    task: sbom
  - file: repo/ci/tasks/sbom-check.yml
    task: sbom-check
  - file: repo/ci/tasks/supply-chain.yml
    params:
      COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
      COSIGN_VERSION: 3.1.3
      REGISTRY: ""
      STAGE: build-and-attest
    task: build-and-attest
  public: true
  serial: true
- name: verify-artifact
  plan:
  - get: repo
    passed:
    - build-and-attest
    trigger: true
  - file: repo/ci/tasks/supply-chain.yml
    params:
      COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
      COSIGN_VERSION: 3.1.3
      REGISTRY: ""
      STAGE: verify
    task: verify
  public: true
- name: set-pipeline
  plan:
  - get: repo
    trigger: true
  - file: repo/ci/pipeline.yml
    set_pipeline: self
    var_files:
    - repo/ci/vars.example.yml
  public: true
- name: sast
  plan:
  - get: repo
    trigger: true
  - get: daily
    trigger: true
  - in_parallel:
      steps:
      - file: repo/ci/tasks/codeql.yml
        output_mapping:
          mykronos-results: results-python
        params:
          CODEQL_BUNDLE_SHA256: 77e5be1b550d66662e600e795b6cf2ea1729e853e3dc79e02594f767039d2a29
          CODEQL_BUNDLE_VERSION: v2.26.3
          CODEQL_LANGUAGE: python
          CODEQL_QUERIES: security-extended,security-and-quality
          FAIL_ON_SECURITY_FINDING: "true"
        task: codeql-python
      - file: repo/ci/tasks/codeql.yml
        output_mapping:
          mykronos-results: results-javascript
        params:
          CODEQL_BUNDLE_SHA256: 77e5be1b550d66662e600e795b6cf2ea1729e853e3dc79e02594f767039d2a29
          CODEQL_BUNDLE_VERSION: v2.26.3
          CODEQL_LANGUAGE: javascript-typescript
          CODEQL_QUERIES: security-extended,security-and-quality
          FAIL_ON_SECURITY_FINDING: "true"
        task: codeql-javascript
  public: true
  serial: true
- name: release-preflight
  plan:
  - get: repo
  - file: repo/ci/tasks/release.yml
    params:
      COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
      COSIGN_VERSION: 3.1.3
      STAGE: preflight
    task: preflight
  public: true
- name: authorize-release
  plan:
  - get: repo
    passed:
    - release-preflight
  - file: repo/ci/tasks/release.yml
    params:
      CONCOURSE_URL: http://localhost:8080
      STAGE: release
    task: authorize
  public: true
  serial: true
resources:
- icon: clock-outline
  name: daily
  source:
    interval: 24h
  type: time
- check_every: 1m0s
  icon: git
  name: repo
  source:
    branch: main
    fetch_tags: true
    private_key: ((git_private_key))
    uri: git@github.com:ToddGBenson/keel.git
  type: git
  webhook_token: ((webhook_token))
- icon: clock-outline
  name: weekly
  source:
    interval: 168h
  type: time
