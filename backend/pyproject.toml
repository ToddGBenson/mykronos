[project]
name = "mykronos"
version = "0.1.0"
description = "Mykronos platform backend — data lake and ingestion API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "duckdb>=1.1",
    # Operational state (RepoOnboarding, tokens, audit log). Separate from the
    # data lake by design -- see docs/DECISIONS.md D-010.
    "sqlalchemy>=2.0",
    # GitHub App auth: RS256 JWT -> installation access token.
    # >=2.13.0, not >=2.9: the 2.9 floor carries 13 advisories, two of them
    # HIGH (GHSA-752w-5fwx-jx9f, GHSA-xgmm-8j9v-c9wx). 2.13.0 is what is
    # installed and what clears them -- the floor was describing a version
    # this project has not run in some time. See B-063 for why a floor is
    # worth getting right even when the deployment is fine: osv-scanner runs
    # `--no-resolve` and assesses exactly this number.
    "pyjwt[crypto]>=2.13.0",
    # libsodium sealed box, required by GitHub's Secrets API (spec 03 §4a).
    "pynacl>=1.6.2",
    # Workflow template rendering (spec 03 §2).
    "jinja2>=3.1.6",
    # The Oracle scoring policy is YAML so a human reviews it (spec 09 §5).
    # Declared explicitly rather than relied on transitively: it arrived
    # via another package, which is exactly how a working build breaks on
    # an unrelated dependency bump.
    "pyyaml>=6.0",
    "httpx2>=2.9",
    # XML that arrives from a runner is parsed again server-side by
    # `mykronos reprocess`, and the stdlib parser expands internal entities:
    # 320 bytes of declarations reach a million characters. A runtime
    # dependency rather than a dev one because the adapters that use it ship
    # in the backend image.
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    # starlette's TestClient requires httpx2; plain httpx is deprecated there.
    "httpx2>=2.9",
    "pytest-asyncio>=0.24",
    # The suite is dominated by per-test fixture setup - a fresh DuckDB
    # catalog per test - not by the tests. That work is already isolated per
    # test, so it parallelises without touching a line of it.
    "pytest-xdist>=3.8",
    "types-PyYAML>=6.0",
    "types-defusedxml>=0.7",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
mykronos = "mykronos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mykronos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put `backend/` on sys.path so `from tests.conftest import ...` resolves.
# It worked locally only as a side effect of the editable install exposing
# the project root; modern setuptools editable finders expose just the
# configured packages, so CI could not import `tests` at all.
pythonpath = ["."]
filterwarnings = [
  "error",
  # anyio 4.15.0 (released 2026-09-02) deprecated the `anyio.abc.BlockingPortal`
  # alias. Starlette's `testclient` module still uses it, at import time — so
  # with warnings-as-errors, `from fastapi.testclient import TestClient` raises
  # and every test in the suite fails to collect. The unit lane went from green
  # to a 38-second collection error on an unrelated pull request.
  #
  # Scoped to that one message rather than relaxing the rule: `error` is doing
  # real work here and a blanket DeprecationWarning ignore would hide our own.
  # The call site belongs to starlette, so there is nothing to fix in this
  # repository — delete this line once starlette moves to
  # `anyio.from_thread.BlockingPortal`, which is the only thing that will make
  # it dead rather than merely quiet.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = ["slow: performance checks against spec 05 §9 acceptance criteria"]
# The GitHub client is async; every async test is a coroutine test.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
