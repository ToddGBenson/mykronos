[project]
name = "mykronos"
version = "0.1.0"
description = "Mykronos platform backend — data lake and ingestion API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "duckdb>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # starlette's TestClient requires httpx2; plain httpx is deprecated there.
    "httpx2>=2.9",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
mykronos = "mykronos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mykronos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = ["slow: performance checks against spec 05 §9 acceptance criteria"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
