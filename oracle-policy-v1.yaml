# Oracle scoring policy (spec 09 §5).
#
# Versioned configuration, not code, and deliberately readable: an admin
# should be able to reproduce any score by hand from this file and the
# decision's inputs_snapshot. spec 09 calls that "explainability over
# sophistication", and it is the reason there is no model here.
#
# Changing this file changes what Oracle decides. Two rules:
#
#   1. Bump `version`. Historical decisions keep the version they were scored
#      with, so a past decision stays reproducible after a policy change
#      (spec 09 §10).
#   2. Re-baseline the golden values. `tests/test_oracle.py` pins exact scores
#      for fixed inputs; a policy edit that does not update them fails the
#      build, which is the point — nobody should change how risk is scored by
#      accident. (This line named `tests/test_oracle_golden.py` until 1.8, a
#      file that has never existed. A pointer to nothing is worse than none:
#      somebody following it concludes there is no such guard.)

# 1.1 — adds the risk_profile modifier (spec 21). Every existing weight is
# unchanged, so a repo with no recorded profile scores exactly as it did
# under 1.0; only a repo whose admin has recorded asset context can differ.
#
# 1.2 — adds the blast_radius modifier (spec 19 §2.4). Same shape of change:
# every existing weight untouched, and a repository whose packages nobody
# else in the portfolio carries a finding on scores exactly as it did under
# 1.1. It can only differ where the concentration is real.
#
# 1.3 — adds the reachability modifier (spec 19 §2.1), the first negative
# weight in this file. A repository with no import analysis, or with nothing
# orphaned, scores exactly as it did under 1.2.
#
# 1.4 — adds unfixable_dampening (D-077). Unlike every bump before it, this
# one *does* change existing scores: the data it reads (`fixed_version`) has
# been on every dependency and container finding all along, and nothing was
# reading it. A repository whose findings all have fixes available scores
# exactly as it did; one carrying unpatched CVEs scores lower, on purpose.
#
# The three entries below were reconstructed after the fact: 1.5, 1.6 and 1.7
# were bumped correctly in the file and never written down here, which made
# this log the one place a reader could not see what had changed. Recorded
# now from the commits, and the omission named rather than quietly patched.
#
# 1.5 — adds remediation_targets (spec 24 §2), the per-severity windows a
# finding's due_at is derived from. Scores nothing on its own: it supplies a
# date, and nothing read that date until 1.6.
#
# 1.6 — adds the overdue_findings modifier (spec 24 §2.4). Changes existing
# scores wherever a deadline has already passed, which is the intent: a
# missed commitment should be visible in the number the gate reads. Distinct
# from finding_age, which escalates on how old a finding is rather than on
# whether anybody promised to fix it by a date.
#
# 1.7 — adds triage_rank (spec 27 §1). Contributes nothing to any risk score;
# it orders a queue. It lives in this file because an ordering that decides
# what a team looks at first is policy, and belongs where policy is argued
# with. Every score under 1.7 is identical to the same score under 1.6.
#
# 1.8 — adds posture_credits (spec 26 §2), the first terms here that lower a
# score for something a team *did*. Changes existing scores only where the
# evidence exists: a repository with no regression links, fewer than ten
# merged fixes and nothing closed inside a window scores exactly as it did
# under 1.7. The cap and the open-critical floor are what keep it from
# buying a verdict.
#
# 1.9 — adds the governance modifier (spec 30 §4), shipped dark at zero
# points. Nothing scores differently until an operator sets a weight, which is
# deliberate: the term rests on a reading of GitHub settings, and moving every
# score in the portfolio on deploy day for a reading nobody had reviewed is
# exactly the kind of change this file's two rules exist to prevent.
version: "1.9"

# ---------------------------------------------------------------------------
# Findings
# ---------------------------------------------------------------------------
#
# The original draft of spec 09 §5 weighted each finding linearly — 40 points
# per critical, clamped to 100. Three open criticals therefore pinned a repo
# at 100 forever, and so did three hundred. Every vulnerable repo scored
# identically, the portfolio view could not rank anything, the trend line
# flatlined, and `no_go` stopped carrying information. See docs/DECISIONS.md
# D-018.
#
# Each severity band now contributes `weight × log2(1 + count)`, so:
#
#     criticals:  1 → 40    2 → 63    4 → 93    8 → 127    32 → 200
#
# More findings always score higher — ranking is preserved — but the curve
# flattens, so the difference between "a few" and "some" matters more than
# the difference between "many" and "very many". Which is how a human triages.
findings:
  curve: log2          # weight × log2(1 + count). The only curve v1 implements.
  weights:
    critical: 40
    high: 20
    medium: 5
    low: 1
    info: 0            # Ingested for trend data; never contributes to risk.

# ---------------------------------------------------------------------------
# Modifiers
# ---------------------------------------------------------------------------
#
# Inputs that adjust the finding-derived score rather than replacing it.
# Every one of these must appear in inputs_snapshot even when its source does
# not exist yet, carrying an explicit null (spec 09 §9) — "not available" and
# "zero" are different facts, and a snapshot that omits the category cannot
# tell you which one you are looking at.
modifiers:
  # Aegis (spec 06). Arrives in Phase 4; null until then.
  insider_risk:
    multiplier: 0.3          # insider_risk_score (0-100) × 0.3

  # Atlas (spec 07). Arrives in Phase 4; null until then.
  sscs_trust:
    penalty_cap: 20          # min(100 - trust_score, cap)

  # Patchwork (spec 08). Arrives in Phase 6; null until then.
  #
  # Lowers urgency, not the underlying risk: a fix already in flight means
  # someone is on it, but the vulnerability is still there.
  remediation_in_flight:
    discount: 0.5            # multiplies the contribution of covered findings

  # An unresolved critical is worse at 90 days than at 9. Aging is what stops
  # "accepted for now" quietly becoming "accepted forever".
  finding_age:
    over_30_days_critical: 15
    over_90_days_high: 10

  # Accepted risk (B-040). Accepted findings are excluded from the open counts,
  # which is right: a risk somebody consciously took is not a risk nobody has
  # looked at. That exclusion is earned by acceptances that are *decisions*.
  #
  # This platform defines one as "a decision with a premise, and the premise is
  # the part that expires". An acceptance with no grounds and no review date
  # has neither — it is indistinguishable in effect from ignoring the finding,
  # and invisible to the score because of a status somebody set once. On this
  # estate that is 294 of 294.
  #
  # `expired` is heavier than `unqualified` deliberately: a review date that
  # has passed is worse than never having set one, because somebody committed
  # to revisiting and did not.
  #
  # Capped, because a large historic backlog must not swamp the score the way
  # the composite gate D-083 retired did — that gate refused every commit once
  # a backlog existed, and got switched off.
  accepted_risk:
    unqualified: 0.15
    expired: 0.5
    cap: 12

  # Knowledge Store (spec 11). Arrives in Phase 5; null until then.
  #
  # A rule that humans keep dismissing on this repo should stop shouting.
  # A rule humans keep dismissing on this repo should stop shouting -- but
  # only once "keep" means something. With no minimum, one dismissal of a
  # rule seen once is a 100% false-positive rate, and a single click would
  # quieten that rule for the whole repository (spec 11 §6.1).
  false_positive_dampening:
    threshold: 0.5           # historical FP rate at or above which dampening applies
    dampening_factor: 0.5    # severity weight × (1 - factor)
    min_observations: 3      # reasoned dismissals required before any dampening

  # Risk profile (spec 21). Asset context, and the only input here that is
  # not derived from something a scanner found — no scan can tell you whether
  # an application is internet-facing or handles regulated data. An admin
  # records it; null until they do, exactly like every modifier above before
  # its source exists.
  #
  # Per-field rather than one combined number, so `render_reasoning` can name
  # which fact moved the score: "internet-facing: +10" is checkable, a single
  # "asset context: +25" is not. Points are flat, like finding_age's, not
  # curved — there is no count here to curve, each fact is true once.
  risk_profile:
    internet_facing_points: 10
    data_classification_points:
      public: 0
      internal: 3
      confidential: 10
      regulated: 15
    business_criticality_points:
      low: 0
      medium: 3
      high: 8
      critical: 15
    # Unbounded on purpose: an asset in four regimes carries four kinds of
    # exposure, and a cap would silently hide the fourth.
    compliance_scope_points_per_entry: 3

  # Portfolio-wide package concentration (spec 19 §2.4). The one input here
  # that is not a fact about this repository: a vulnerable package five other
  # teams also carry is a different problem from the same package in one leaf
  # service, and until now nothing read across repositories to notice.
  #
  # Small on purpose. SSCS trust already scores a repository's own dependency
  # health at length; this is only the concentration on top of it, and the
  # map it reads is deliberately approximate (package name, not version).
  # A weight that could move a verdict on its own would be claiming more
  # precision than the underlying map has.
  blast_radius:
    # Where "several teams use it" becomes "concentrated". A judgement about
    # this portfolio's size, not a universal constant.
    min_dependents: 5
    points_per_package: 4
    # Flat, unlike compliance_scope above: ten concentrated packages in one
    # repository is a supply-chain problem the trust score already covers, and
    # letting this run away would let one dependency-heavy repo dominate the
    # ranking on the most approximate signal in the set.
    cap: 20

  # Findings in code nothing imports (spec 19 §2.1). The only negative weight
  # in this file, and the only one where being wrong lowers a score.
  #
  # The analysis behind it is deliberately narrow: Python only, and "does
  # anything in this repository import this file" — never "does this code
  # run". A discount big enough to move a verdict would be trusting it much
  # further than it can see, so it is small and capped well below the
  # difference between two thresholds.
  #
  # Set both to 0 to turn the discount off while keeping the category
  # reported: the snapshot still says what was analysed, it just stops
  # affecting the score.
  reachability:
    orphaned_discount_per_finding: 3
    discount_cap: 15

  # Findings the maintainer has shipped no fix for (D-077).
  #
  # Dampens, never excludes. An unpatched CVE in production is real risk and
  # has to keep scoring. What this stops is the score measuring somebody
  # else's release schedule: sixteen unfixable critical Perl CVEs pinned
  # TheHub at 100/100, so the gate read the same whether the team had fixed
  # everything they could or nothing at all -- the state in which a gate has
  # stopped carrying information.
  #
  # 0.5, matching false_positive_dampening, and chosen for consistency rather
  # than to produce any particular verdict. It does not on its own clear a
  # repository whose backlog is genuinely large, and it should not: accepting
  # an unfixable risk is still a decision a person has to make and record.
  #
  # Only applies to findings that name a package. A SAST finding has no
  # `fixed_version` and never will -- absence there means the field does not
  # apply, not that upstream has shipped nothing, and reading it the other way
  # would quieten every injection finding in the fleet.
  # Spec 24 §2.4. A deadline this organisation set for itself, or one CISA
  # set in KEV, that has passed. Deliberately *not* a second age term:
  # `finding_age` escalates continuously and describes drift, while this fires
  # once, on a date. A repository whose findings are all inside their windows
  # pays nothing here however old they are — which is the behaviour the age
  # curve alone cannot express, and the reason targets are policy.
  #
  # Small and capped: the intent is to make a missed commitment visible in the
  # number the gate reads, not to punish the same backlog twice.
  overdue_findings:
    per_finding: 1.5
    cap: 12

  # Spec 26 §2. The first terms in this policy that *reward* rather than
  # punish. Until they existed the model could only ever raise a score, so a
  # team that spent a quarter adding regression tests, verifying its fixes and
  # clearing its backlog inside target saw the number not move — and a model
  # that can only punish is one people argue with rather than act on.
  #
  # Every credit requires something to have *happened*: a test pinned to a
  # fixed finding (spec 31), a fix verified by a re-scan of its merge commit
  # (spec 25 §2), a finding closed inside its window (spec 24 §2). None can be
  # earned by changing a setting, which is the rule maturity-model-v1.yaml
  # states for its own criteria and for the same reason.
  #
  # `total_cap` bounds the sum. `floor_with_open_critical` is the harder rule
  # and the important one: credits may not take a repository below the review
  # threshold while a critical is open. Without it the arithmetic lets a team
  # test its way out of an exploited critical, which is the single outcome
  # this idea must not produce.
  posture_credits:
    total_cap: 12
    floor_with_open_critical: true
    regression_coverage:
      points_per_covered_finding: 0.5
      cap: 8
    verified_fix_rate:
      points_at_full_rate: 6
      # Below this the rate is noise, and the category reports unavailable
      # rather than scoring a team that has fixed three things well as though
      # it had failed seven.
      minimum_sample: 10
    within_target:
      points_at_full_compliance: 6

  # Spec 30 §4. How hard it is to get a bad change into this repository, as a
  # fact about what the repository *is* — which is where the risk profile's
  # terms live and why this sits with them rather than with the finding
  # counts. Weak review controls do not make a SQL injection worse; they make
  # this a worse repository for one to be in.
  #
  # **Only ever a penalty, never a credit.** Spec 30 §4 expected strong
  # governance to earn the reward side of spec 26 §2 for free. It cannot:
  # branch protection is a *switch*, and spec 26 §2.3 refuses credit for
  # switch-flipping in as many words, because the fastest route to a good
  # score must never be a setting. The asymmetry is deliberate and is recorded
  # in D-091.
  #
  # `points_at_zero: 0` ships it dark. Every repository's score is unchanged
  # until an operator has seen the panel, agreed the weights in
  # `governance-policy-v1.yaml` describe their estate, and set a number here.
  # A term that started scoring on the day it deployed would move every score
  # in the portfolio for a reading nobody had reviewed.
  governance:
    points_at_zero: 0
    good_enough: 80
    minimum_controls: 5

  unfixable_dampening:
    factor: 0.5

# ---------------------------------------------------------------------------
# Thresholds
# ---------------------------------------------------------------------------
#
# Applied to the clamped 0-100 score.
# ---------------------------------------------------------------------------
# Remediation targets (spec 24 §2)
# ---------------------------------------------------------------------------
#
# Days from `first_seen_at` that a finding of each severity may stay open.
# Deliberately separate from `modifiers.finding_age`: age escalates
# continuously and describes drift, while a target is a date this organisation
# set for itself. A finding inside its window is not late however old it is,
# and the age term alone could never say so.
#
# Computed from first_seen_at rather than from the latest scan, so re-running
# a scanner does not hand a sixty-day-old finding a fresh thirty days.
#
# A CISA KEV due date always wins over these (spec 24 §2.2). That date is
# authored outside this organisation, and a locally-computed one that
# disagreed with it would be the platform quietly negotiating with CISA.
#
# `info: null` means "not work", not "due immediately" — zero days would make
# every repository permanently overdue on findings nobody intends to fix.
remediation_targets:
  critical: 7
  high: 30
  medium: 90
  low: 180
  info: null

# ---------------------------------------------------------------------------
# Triage ranking (spec 27 §1)
# ---------------------------------------------------------------------------
#
# What to look at first. This contributes nothing to any risk score — it
# orders a queue — and it lives here because an ordering that decides what a
# team opens on Monday is policy, reviewed in a pull request, not a constant
# in a module.
#
# A documented weighted sum a person can recompute on paper, deliberately.
# Severity describes the vulnerability class; everything below it describes
# this instance of it, and those are the terms that make the order differ from
# a severity sort.
triage_rank:
  severity:
    critical: 40
    high: 25
    medium: 12
    low: 4
    info: 0
  in_kev: 25                # actively exploited, right now, in the world
  epss_at_1_0: 20           # scaled by the score itself
  overdue: 15               # past due_at (spec 24 §2)
  due_soon: 5
  blast_radius_at_max: 10   # scaled by dependent-repo count
  repo_is_no_go: 8          # the same finding matters more in a failing repo
  # Negative, and the same discount the risk model applies for the same reason
  # (D-072): never a promotion, only ever a reduction. The analysis can be
  # wrong about dead code and must not be able to bury live work.
  orphaned_discount: -10
  # Not a claim that a fixable finding is more dangerous — a claim that it is
  # cheaper. A worklist's job is risk removed per unit of work.
  fixable_bonus: 6

thresholds:
  no_go: 70                  # >= 70
  review_recommended: 30     # >= 30 and < 70
                             # < 30 => go

# ---------------------------------------------------------------------------
# Scope
# ---------------------------------------------------------------------------
scope:
  # Findings below this never contribute, whatever their weight. Ingested for
  # trend data regardless (spec 04 §5).
  minimum_severity: low

  # Human dispositions are decisions already taken. Re-scoring a finding
  # somebody accepted would mean Oracle overruling them every night.
  statuses_considered: [open]

  # Network findings are excluded from PR and release gates by spec 14 §7:
  # blocking a pull request because an unrelated host has an open port is
  # incoherent, since the PR neither caused it nor fixes it. They still count
  # toward the portfolio decision.
  capabilities_excluded_from_gates: [network]
