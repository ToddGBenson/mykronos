# CI for the Mykronos platform itself.
#
# Not to be confused with `workflow-templates/`, which are the workflows
# Mykronos installs into *onboarded* repos. This one guards our own code.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned deliberately: an unpinned security scanner means the build can
  # start failing on a ruleset change nobody chose.
  GITLEAKS_VERSION: "8.18.4"

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy mykronos

      # Includes the spec 05 §9 performance criteria (marked `slow`):
      # 10,000 findings ingested and compacted inside 30 seconds.
      - name: Tests
        run: pytest -q --durations=10

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # The generated client is derived from the backend's OpenAPI, so the
      # contract has to be regenerated here rather than trusted from the
      # committed copy. A backend change that breaks the frontend should fail
      # this job, not surface as a runtime error in a browser.
      - name: Set up Python for the schema dump
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Regenerate the API contract
        run: |
          cd ../backend
          pip install --quiet -e .
          cd ../frontend
          python ../scripts/dump_openapi.py openapi.json
          npx openapi-typescript openapi.json -o lib/api-types.d.ts

      - name: Fail if the generated client is stale
        run: |
          if ! git diff --quiet -- lib/api-types.d.ts; then
            echo "::error::The committed API types are out of date."
            echo "The backend's OpenAPI schema has changed. Regenerate with:"
            echo "  python scripts/dump_openapi.py frontend/openapi.json"
            echo "  cd frontend && npx openapi-typescript openapi.json -o lib/api-types.d.ts"
            git diff --stat -- lib/api-types.d.ts
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the point is that no secret was *ever* committed,
          # not merely that none is present at HEAD.
          fetch-depth: 0

      # spec 12 §8 asks a human review to confirm no PAT-shaped credential
      # exists anywhere in the codebase. That is a machine's job.
      #
      # Run the binary directly rather than gitleaks-action, which derives a
      # commit range from the push event and asks git for `<root-commit>^`.
      # The initial commit has no parent, so that range is invalid and the
      # scan silently degrades to zero bytes scanned while still failing.
      - name: Install gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full history
        run: gitleaks detect --source . --redact --verbose

  specs:
    name: Spec links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # A script rather than inline shell, so this and a developer's local run
      # are byte-identical.
      - name: Check relative markdown links
        run: python scripts/check_links.py .
