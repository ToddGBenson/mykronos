# Functional tests and DAST against an ephemeral demo stack — spec 32 §4.2.
#
# Replaces `demo-and-dast` in `deploy/concourse/pipelines/mykronos.yml`.
#
# **Why this is hand-written rather than rendered from a template.** `dast`
# and `functional` are real capabilities with real templates, and other
# repositories should keep using them: `dast.yml.j2` probes a `target_url`
# that somebody else deployed, which is the right model for a repository with
# a lower environment. This repository has no such environment — it has a
# compose file — and the orchestration around the scan is repository-specific
# infrastructure rather than a capability. Same reasoning as `delivery.yml`
# and spec 32 §5.
#
# **Why the two are one job.** The functional suite runs *through* ZAP's
# proxy, so ZAP's site tree is built from real authenticated use rather than
# from spidering a login page. Splitting them into two workflows would mean
# two environments and a ZAP that never saw the traffic — spec 16 §8's point
# that the functional suite is what gives ZAP depth. One build, two uploads,
# each answering for itself (spec 15 §4a.1).
#
# **What the ephemeral stack fixes.** Three failure modes in the Concourse
# lane are consequences of one shared, host-resident environment, and all
# three disappear here: `serial: true` (builds 8 and 9 wiped build 7's ZAP
# session), the "rebuild it on the host" preflight, and the seeded-repository
# check guarding against a stale environment. A stack that did not exist
# ninety seconds ago cannot be stale, cannot be shared, and cannot be missing.
#
# Measured at 72s from `down -v` to all four preflight assertions passing
# (spec 32 §4.2), against images already local. A runner pulls from GHCR,
# which is the one number that spike could not produce.

name: Demo and DAST

on:
  # After delivery, not on push: the stack runs the images `delivery.yml`
  # published for this commit, so it has to wait for them to exist. A `push`
  # trigger would race the publish and scan whatever `:latest` happened to be.
  workflow_run:
    workflows: ["Delivery"]
    types: [completed]
    branches: ["main"]
  # Weekly, with the active scan on. D-053 paused active scanning because it
  # took the shared host down; this runs on a GitHub runner against a stack
  # that exists only for the run, so nothing it consumes is production's.
  # Sunday 11:00 UTC, clear of the Concourse `weekly` coverage window.
  schedule:
    - cron: "0 11 * * 0"
  workflow_dispatch:
    inputs:
      active_scan:
        description: >-
          Run ZAP's active scan as well as passive. Off by default: D-053
          paused active scanning after it measured 548% CPU and 7 GiB, and
          spec 32 §11 keeps that posture until somebody replaces it with a
          measurement taken on a runner rather than an assumption about one.
        type: boolean
        default: false

concurrency:
  # An active scan takes ~40 minutes; a Delivery landing meanwhile must not
  # cancel it, so active runs -- weekly or dispatched with active_scan --
  # queue apart from the passive post-Delivery runs. Splitting on `schedule`
  # alone let the next Delivery cancel the first manual active scan
  # (run 38675775486, 2026-10-15).
  group: demo-and-dast-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.active_scan) && 'active' || 'delivery' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  demo-and-dast:
    name: functional + ZAP
    runs-on: ubuntu-latest
    # Spider (10) + the frontend's active scan (40) + the API's active scan
    # (capped at 20 below) + stand-up and upload no longer fit in 60.
    timeout-minutes: 90
    # A delivery that failed published nothing to scan. `workflow_run` fires
    # on completion regardless of outcome, so the check is explicit.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      # The commit under test. For a `workflow_run` that is the commit the
      # triggering Delivery ran on, NOT `github.sha` — which points at the
      # default branch's tip and would tag the results with the wrong commit
      # the moment two pushes land close together.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      COMPOSE: deploy/demo/docker-compose.yml
      # The runner dials ZAP directly, on the port compose publishes.
      ZAP_PROXY: http://localhost:8290
      # These are addresses ZAP resolves *on our behalf* — the proxied
      # functional suite and the spider target — and confusing them with the
      # published ones is what made 26 of 26 tests fail with `502 Bad Gateway`
      # on the first real run.
      #
      # ZAP runs in a container on the compose network, so `localhost` there
      # is ZAP itself: asking it to fetch `localhost:8201` makes it try to
      # proxy to its own port, and it answers 502 for anything whose Host it
      # does not recognise. The service names resolve on the network it shares
      # with them, which is why the compose file puts ZAP there — and why
      # `functional/conftest.py` already defaults to exactly these two.
      PROXIED_BACKEND: http://backend:8100
      PROXIED_FRONTEND: http://frontend:3100
      # The demo stack's perimeter-gate token: the value `MYKRONOS_GATE_TOKEN`
      # has in `deploy/demo/docker-compose.yml`, which is public by design (the
      # demo holds nothing but seeded data, and every demo token is a literal
      # there). One place in this file, read through the environment and never
      # interpolated into a logged command; `test_demo_healthcheck.py` holds it
      # equal to the compose value. Since #753 every frontend path but
      # `/api/healthz` answers 401 without it (TheHub #60735).
      DEMO_GATE_TOKEN: demo-gate-token-not-a-secret
      # The demo backend's admin token, for the API scan: the value
      # `MYKRONOS_ADMIN_TOKEN` has in the same compose file, public for the
      # same reason. It is valid only on the stack this job stands up and
      # tears down, whose database is tmpfs. `test_demo_and_dast_api_scan.py`
      # holds it equal to the compose value.
      DEMO_ADMIN_TOKEN: demo-admin-token-not-a-secret

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The functional adapter reads surrounding source to fingerprint a
          # finding's location (spec 05 §5).
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # For the browser suite (`frontend/e2e/`). The same pin and major as
      # `frontend-pr.yml`, which matches the frontend image's `node:22-slim`.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lowercase the owner
        # `github.repository_owner` is `ToddGBenson`; a Docker repository name
        # must be lowercase or the pull is refused outright. Same fix as
        # `delivery.yml`, which is where a live run found it.
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stand up the demo stack
        env:
          MYKRONOS_IMAGE_BACKEND: ghcr.io/${{ env.OWNER }}/mykronos-backend:${{ github.event.workflow_run.head_sha || github.sha }}
          MYKRONOS_IMAGE_FRONTEND: ghcr.io/${{ env.OWNER }}/mykronos-frontend:${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          # `--ignore-buildable`: ZAP is built from deploy/zap/Dockerfile (its
          # FROM is the pin), and its local tag is in no registry. `up` builds
          # it, pulling the pinned base as part of the build.
          docker compose -f "$COMPOSE" pull --quiet --ignore-buildable
          docker compose -f "$COMPOSE" up -d

      - name: Start the resource sampler
        # D-114: a version bump on the tool that once took production down
        # (D-053: 548% CPU and 7 GiB, on the shared host) carries a CPU and
        # memory reading taken on the runner, not an assumption about one.
        # Started here rather than after `Wait for health` so ZAP's start-up
        # burst is in the sample. Every demo container is sampled, ZAP among
        # them, because the question spec 32 §11.4 asks is what the *stack*
        # costs on a runner; `Resource read` reduces this to peaks.
        #
        # `docker stats --no-stream` blocks for about a second collecting two
        # cgroup readings, so the effective cadence is ~3s. The loop survives
        # the end of this step because the runner does not reap detached
        # processes between steps; `Resource read` kills it explicitly.
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/stats"
          nohup bash -c '
            while true; do
              ids=$(docker ps -q --filter name=mykronos-demo-)
              if [ -n "$ids" ]; then
                docker stats --no-stream --format "{{.Name}} {{.CPUPerc}} {{.MemUsage}}" $ids 2>/dev/null                   | sed "s/^/$(date +%s) /"
              fi
              sleep 2
            done' >> "$RUNNER_TEMP/stats/samples.log" 2>/dev/null &
          echo $! > "$RUNNER_TEMP/stats/sampler.pid"
          echo "Sampling every ~3s into $RUNNER_TEMP/stats/samples.log (pid $(cat "$RUNNER_TEMP/stats/sampler.pid"))."

      - name: Wait for health
        run: |
          set -uo pipefail
          # Healthy, not merely started. A functional suite that races the
          # application reports the race rather than the application.
          deadline=$(( $(date +%s) + 300 ))
          healthy=0
          while [ "$(date +%s)" -lt "$deadline" ] && [ "$healthy" -lt 3 ]; do
            sleep 5
            healthy=0; states=""
            for svc in backend frontend zap; do
              state=$(docker inspect -f '{{.State.Health.Status}}' "mykronos-demo-${svc}-1" 2>/dev/null || echo absent)
              states="${states}${state} "
              [ "$state" = "healthy" ] && healthy=$((healthy + 1))
            done
            echo "  $states"
          done
          if [ "$healthy" -lt 3 ]; then
            docker compose -f "$COMPOSE" logs --tail 40
            echo "::error::The demo environment never became healthy."
            exit 1
          fi

      - name: Seed
        id: seed
        run: |
          set -euo pipefail
          # Through the container rather than the published port: minting an
          # ingestion token has no HTTP route — a token is shown once and only
          # its hash is stored (spec 12 §2) — so the seeder has to run where
          # the database is.
          BACKEND=$(docker compose -f "$COMPOSE" ps -q backend)
          docker cp deploy/demo/seed.py "${BACKEND}:/tmp/seed.py"
          docker exec "$BACKEND" python /tmp/seed.py --url http://localhost:8100

      - name: Narrow the suspicious-comments word list
        # Before the functional suite, not with the spider exclusions further
        # down. Rule 10027 is *passive*: it runs on traffic as it crosses the
        # proxy, so by the time the spider starts, the suite's page loads have
        # already been scanned with whatever list was in force.
        #
        # **Why this rule needed tuning.** 10027 looks for developer notes left
        # in shipped code, and its default list is TODO, FIXME, BUG, BUGS, XXX,
        # QUERY, DB, ADMIN, ADMINISTRATOR, USER, USERNAME, SELECT, WHERE, FROM,
        # LATER, DEBUG. Most of those are ordinary vocabulary for a security
        # console: this application's own text says "from", "user", "admin" and
        # "bug" constantly, and the CVE descriptions it renders say them again.
        #
        # It matched them because ZAP's JavaScriptLexer loses its place inside
        # a Next.js RSC payload — a JSON document, full of \" escapes, sitting
        # inside a JS string — and then reads the `//` of an ordinary
        # `https://github.com/...` link as the start of a line comment. The
        # "comment" runs to the end of a minified line, so every word on it
        # becomes a candidate. The evidence on all 24 findings was the English
        # word "from", matched case-insensitively, in prose.
        #
        # So the alerts were not about comments and could not be fixed in the
        # comments. Measured against the running application: the default list
        # alerted on essentially every page; TODO/FIXME/XXX alone alerted zero
        # times across ten, while still catching a real
        # `// TODO: remove the hardcoded admin credential` on a page whose
        # prose also said from, user, admin, bug and query.
        #
        # Kept deliberately: those three do not appear in ordinary writing, so
        # they still mean what the rule intends. Everything dropped here is a
        # word this application legitimately displays.
        run: |
          set -uo pipefail
          zap_api() { curl -fsS --max-time 60 -x "$ZAP_PROXY" "http://zap$1"; }

          # Not in the base image — the payload list is only editable through
          # this add-on, and the install is a marketplace fetch.
          zap_api "/JSON/autoupdate/action/installAddon/?id=custompayloads" >/dev/null

          ready=0
          for _ in $(seq 1 24); do
            if zap_api "/JSON/custompayloads/view/customPayloadsCategories/" >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            # Loud, and not fatal. A noisier DAST run is worth having; a lane
            # that reports nothing is not (see the report-writing note below).
            echo "::warning::custompayloads never came up — 10027 will run with its default word list."
            exit 0
          fi

          for word in QUERY DB ADMIN ADMINISTRATOR USER USERNAME SELECT WHERE FROM LATER BUG BUGS DEBUG; do
            zap_api "/JSON/custompayloads/action/disableCustomPayload/?category=Suspicious-Comments&payload=${word}" >/dev/null \
              || echo "::warning::could not disable suspicious-comment word ${word}"
          done

          echo -n "Suspicious-Comments now matches: "
          zap_api "/JSON/custompayloads/view/customPayloads/?category=Suspicious-Comments" \
            | python -c 'import json,sys; print(", ".join(p["payload"] for p in json.load(sys.stdin)["customPayloads"] if p["enabled"]))'

      - name: Functional suite, proxied through ZAP
        id: functional
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/functional"
          zap_api() { curl -fsS --max-time 60 -x "$ZAP_PROXY" "http://zap$1"; }

          # A session per run, so the site tree belongs to this commit. On a
          # shared ZAP this was load-bearing; here it is belt and braces, and
          # cheap.
          zap_api "/JSON/core/action/newSession/?name=run-${SHA}&overwrite=true" >/dev/null

          python -m pip install --quiet pytest httpx2
          HTTP_PROXY="$ZAP_PROXY" HTTPS_PROXY="$ZAP_PROXY" \
          DEMO_FRONTEND_URL="$PROXIED_FRONTEND" DEMO_BACKEND_URL="$PROXIED_BACKEND" \
            python -m pytest functional -q -p no:cacheprovider \
              --junitxml="$RUNNER_TEMP/functional/functional.xml"

      - name: Browser suite (Playwright)
        id: e2e
        # The functional suite speaks HTTP and ZAP reads responses; neither
        # runs the page's JavaScript. The static CSP that blocked hydration
        # (`frontend/proxy.ts`) left every control on the site inert while
        # every page answered 200 with the right HTML, so both stayed green.
        # This opens a real Chromium against the stack and fails on a CSP
        # violation, an uncaught error or a console error, as well as on what
        # each spec asserts.
        #
        # Here, before the spider: a broken UI is reported even when ZAP is
        # slow or runs out the job's clock. Gated like the functional suite and
        # `continue-on-error` like it, so the scans below run whatever this did
        # and the job goes red at the end (`Fail if the browser suite failed`).
        #
        # **Direct, not through ZAP.** The published port, from the runner.
        # Shaping the site tree is the functional suite's job, and nothing
        # here changes what the spider or the API scan does.
        #
        # **One functional ScanRun.** The JUnit goes beside `functional.xml`,
        # into the directory `Upload the functional result` reads, and the
        # junit adapter merges every *.xml there into one run. A second
        # `functional`/`junit` upload would be a second run for the same lane.
        # Traces go to their own directory, outside both uploads.
        continue-on-error: true
        env:
          E2E_BASE_URL: http://127.0.0.1:3200
          E2E_JUNIT: ${{ runner.temp }}/functional/e2e.xml
          E2E_OUTPUT_DIR: ${{ runner.temp }}/e2e
        run: |
          set -uo pipefail
          mkdir -p "$(dirname "$E2E_JUNIT")" "$E2E_OUTPUT_DIR"

          # Written first, replaced only by Playwright's own report, so a
          # suite that never ran -- a failed install, a timeout, a cancel --
          # fails the functional run rather than leaving `functional.xml` to
          # read as the whole of it. Same idea as the API scan's marker.
          cat > "$E2E_JUNIT" <<'XML'
          <testsuites><testsuite name="e2e" tests="1" failures="0" errors="1"><testcase name="the browser suite did not complete" classname="e2e"><error message="The Playwright suite wrote no report: it did not run, or did not finish."/></testcase></testsuite></testsuites>
          XML

          broken() {
            echo "::error::$1"
            exit 1
          }

          # The seed's findings sit in the write-ahead buffer until the
          # backend's compaction loop runs, every five minutes; the pages read
          # the compacted lake. Without this the findings views are empty or
          # full depending on how long the steps above took. Retried because
          # it shares partitions with that loop, and a collision is a retry,
          # not a lost write (the buffer keeps everything until it lands).
          BACKEND=$(docker compose -f "$COMPOSE" ps -q backend)
          compacted=0
          for attempt in 1 2 3; do
            if docker exec "$BACKEND" python -m mykronos.cli compact; then
              compacted=1
              break
            fi
            echo "::warning::Compaction attempt ${attempt} failed; retrying."
            sleep 10
          done
          [ "$compacted" -eq 1 ] || broken "Could not compact the seeded findings: the browser suite would be testing an empty estate."

          cd frontend
          npm ci --no-audit --no-fund || broken "npm ci failed in frontend/."
          npx playwright install --with-deps chromium || broken "Could not install Playwright's Chromium."

          # `|| RC=$?`: GitHub runs this under `bash -e`, which would end the
          # step on a failing test before the exit code is kept.
          RC=0
          npx playwright test || RC=$?
          exit "$RC"

      - name: Spider, and scan
        id: zap
        # `always()`: a failed functional suite still leaves a site tree worth
        # scanning, and a failed *upload* must not skip this at all.
        # Not `always()`, which also runs on cancellation: a newer Delivery
        # cancelled run 38676875040 mid-Seed and this scanned a half-seeded
        # stack that then uploaded as a successful scan. Unseeded or
        # cancelled, it is skipped, the report directory stays empty, and
        # the upload records a failed run that closes nothing.
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        continue-on-error: true
        env:
          ACTIVE: ${{ github.event_name == 'schedule' || inputs.active_scan }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/dast"
          zap_api() { curl -fsS --max-time 60 -x "$ZAP_PROXY" "http://zap$1"; }

          SEEDED=$(zap_api "/JSON/core/view/urls/" | python -c 'import json,sys; print(len(json.load(sys.stdin)["urls"]))')
          echo "Site tree: ${SEEDED} URL(s) seeded by the tests."

          # Next.js build assets are static, numerous, and identical every
          # run. Excluding them keeps the scan about the application. Written
          # out rather than looped: three URLs that differ in the middle are
          # clearer as three lines than as one line of parameter expansion.
          # Tolerated failures — an exclusion ZAP declines is a noisier scan,
          # not a broken one.
          zap_api "/JSON/core/action/excludeFromProxy/?regex=.*/_next/static/.*" >/dev/null || true
          zap_api "/JSON/spider/action/excludeFromScan/?regex=.*/_next/static/.*" >/dev/null || true
          zap_api "/JSON/ascan/action/excludeFromScan/?regex=.*/_next/static/.*" >/dev/null || true

          # Bounded, so a scan that never reports 100 fails with a message
          # rather than running out the job's 60-minute clock with no clue why.
          poll() {
            local endpoint="$1" limit="$2" waited=0
            until [ "$(zap_api "$endpoint" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')" = "100" ]; do
              sleep 5
              waited=$((waited + 5))
              if [ "$waited" -ge "$limit" ]; then
                echo "::error::$endpoint did not reach 100% within ${limit}s."
                return 1
              fi
            done
          }

          # `|| true` on every poll, and the report written whatever they
          # returned. GitHub runs `run:` steps under `bash -e`, so a poll that
          # timed out killed the step before the report was written -- and ZAP
          # had already collected passive findings for the 29 seeded URLs by
          # then. Seventeen consecutive runs failed this way from 2026-08-30,
          # each uploading nothing.
          #
          # Losing the report is far worse than an incomplete scan. A finding
          # closes only after two consecutive *successful* scans observe its
          # absence (`reconcile.REQUIRED_ABSENCES`), so a lane that reports
          # nothing cannot close anything: 115 DAST findings stayed open here
          # against an application that had already been fixed, because the
          # evidence of the fix was thrown away every run.
          # Through the gate, or the scan is of the gate (TheHub #60735). The
          # functional suite carries its own `hub_token` cookie, but the
          # spider's requests are ZAP's and carried nothing: measured against
          # the demo stack, every one of the spider's 15 requests answered 401,
          # and the site tree stopped at 31 URLs. With this rule the same
          # spider reached 143 URLs, 335 responses 200 and none 401.
          #
          # Here, after the functional suite, deliberately: the suite's
          # anonymous tests go through this proxy too, and a header added to
          # every request would sign them in.
          curl -fsS --max-time 60 -x "$ZAP_PROXY" -G "http://zap/JSON/replacer/action/addRule/" \
            --data-urlencode "description=perimeter-gate" \
            --data-urlencode "enabled=true" \
            --data-urlencode "matchType=REQ_HEADER" \
            --data-urlencode "matchRegex=false" \
            --data-urlencode "matchString=X-Hub-Token" \
            --data-urlencode "replacement=${DEMO_GATE_TOKEN}" >/dev/null

          SPIDER_ID=$(zap_api "/JSON/spider/action/scan/?url=${PROXIED_FRONTEND}&recurse=true" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["scan"])')
          SPIDER_OK=1
          poll "/JSON/spider/view/status/" 600 || SPIDER_OK=0

          # A spider that only ever saw the gate's 401 is an empty scan that
          # looks like a clean one, and uploading it would let absence
          # reconciliation close every real DAST finding. So no report: the
          # upload then records a failed scan, which closes nothing, and the
          # last step turns the job red.
          SPIDER_STATUS=$(zap_api "/JSON/spider/view/fullResults/?scanId=${SPIDER_ID}" | python -c '
          import json, sys, collections
          seen = collections.Counter(
              str(u.get("statusCode"))
              for block in json.load(sys.stdin)["fullResults"]
              for u in block.get("urlsInScope", [])
          )
          ok = sum(n for code, n in seen.items() if code.startswith("2"))
          print(ok, seen.get("401", 0))' || echo "unknown unknown")
          read -r SPIDER_2XX SPIDER_401 <<< "$SPIDER_STATUS"
          echo "Spider responses: ${SPIDER_2XX} 2xx, ${SPIDER_401} 401."
          if [ "$SPIDER_2XX" = "0" ]; then
            echo "::error::The spider got no 2xx response from the dashboard (${SPIDER_401} x 401): it scanned the perimeter gate, not the application. Not writing a report."
            exit 1
          fi

          # Non-fatal, and this is the same lesson as the report itself: this
          # is a progress line, and under `bash -e` a progress line that fails
          # kills the step before the report is written. A count nobody could
          # read is not worth the artefact.
          AFTER=$(zap_api "/JSON/core/view/urls/" \
            | python -c 'import json,sys; print(len(json.load(sys.stdin)["urls"]))' \
            || echo "unknown")
          echo "Site tree: ${AFTER} URL(s) after spidering, from ${SEEDED} seeded by the tests."

          ACTIVE_OK=1
          if [ "$ACTIVE" = "true" ]; then
            zap_api "/JSON/ascan/action/scan/?url=${PROXIED_FRONTEND}&recurse=true" >/dev/null
            poll "/JSON/ascan/view/status/" 2400 || ACTIVE_OK=0
          else
            echo "::notice::Passive scan only (D-053). Re-run with active_scan to include it."
          fi

          # Always. This is the line the whole step exists to produce.
          zap_api "/OTHER/core/other/jsonreport/" > "$RUNNER_TEMP/dast/zap.json"

          # Said out loud, and not as an error: an incomplete crawl is a
          # narrower scan, not a broken one, and the findings it did produce
          # are real. Reporting it as a failure is what made the platform
          # discard them.
          if [ "$SPIDER_OK" -eq 0 ] || [ "$ACTIVE_OK" -eq 0 ]; then
            echo "::warning::The crawl did not finish inside its budget. The report covers the ${AFTER} URL(s) reached, which is a narrower scan rather than a failed one."
          fi

      - name: Scan the backend API from its OpenAPI document
        id: zap_api
        # The step above scans the dashboard; the backend it talks to was only
        # ever reached through whatever the functional suite happened to call,
        # so most API routes were never requested by ZAP at all. This imports
        # the backend's own OpenAPI document and scans every operation in it,
        # authenticated as admin and through the perimeter gate.
        #
        # **What it can reach.** `backend` resolves on this run's compose
        # network to this run's container: synthetic data, a tmpfs database,
        # no GitHub App, no production credential, destroyed by `Tear down`.
        # An active scan here submits writes with an admin token, and that is
        # only acceptable because nothing it writes outlives the job.
        #
        # **The same report, not a second one.** It writes beside the
        # dashboard's report, into the directory `Upload the DAST result`
        # reads, so both become one ScanRun under `zap`. Absence
        # reconciliation partitions on the tool: two `zap` uploads, one per
        # target, would each close the other's findings after two runs.
        #
        # `always()` and `continue-on-error`, like the scan above: a failure
        # here must not cost the dashboard's report, and the job still goes
        # red at the end (`Fail if the API scan did not complete`).
        # Not `always()`, which also runs on cancellation: a newer Delivery
        # cancelled run 38676875040 mid-Seed and this scanned a half-seeded
        # stack that then uploaded as a successful scan. Unseeded or
        # cancelled, it is skipped, the report directory stays empty, and
        # the upload records a failed run that closes nothing.
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        continue-on-error: true
        env:
          ACTIVE: ${{ github.event_name == 'schedule' || inputs.active_scan }}
          # The backend as the runner sees it (the compose file publishes
          # 8201), used only to fetch the document. ZAP itself is on the
          # compose network and scans `$PROXIED_BACKEND`.
          PUBLISHED_BACKEND: http://127.0.0.1:8201
        run: |
          set -uo pipefail
          WRK="$RUNNER_TEMP/zap-api"
          mkdir -p "$WRK" "$RUNNER_TEMP/dast"
          # ZAP runs as uid 1000 in its image; the runner owns this as 1001.
          chmod 777 "$WRK"

          # The converse of the marker below. `Spider, and scan` deliberately
          # writes no report when it only reached the gate, so that the upload
          # records a failed run. With this step's report beside it, the
          # directory would no longer be empty and the API findings alone
          # would read as the whole `zap` run, closing every dashboard finding
          # by absence. The marker keeps that run partial.
          if [ ! -s "$RUNNER_TEMP/dast/zap.json" ]; then
            echo "::warning::'Spider, and scan' wrote no dashboard report; marking the DAST run partial."
            echo "The dashboard scan wrote no report." > "$RUNNER_TEMP/dast/zap.json"
          fi

          # Written first, replaced only by a finished report at the end, so
          # a timeout or a cancel-in-progress -- which run none of this
          # script's logic -- still leaves the run partial.
          echo "The API scan did not complete: interrupted before its report was written." > "$RUNNER_TEMP/dast/zap-api.json"

          # A failed API scan must not read as a clean API. The frontend's
          # report alone, uploaded as the whole `zap` run, would let absence
          # reconciliation close every API finding after two runs. So the
          # failure leaves a marker the zap adapter cannot parse, which records
          # the run as PARTIAL_FAILURE -- confirming no absence, closing
          # nothing -- while the dashboard's findings still ingest.
          broken() {
            echo "::error::$1"
            echo "The API scan did not complete: $1" > "$RUNNER_TEMP/dast/zap-api.json"
            exit 1
          }

          # One ZAP pin (D-128): the image compose's `zap` service names,
          # read from the compose file rather than repeated here. Compose
          # builds it from deploy/zap/Dockerfile, so what must be digest-pinned
          # is every FROM in that build; a service that pulled instead would
          # need its own `image:` pinned. Prints "OK <image>", or the
          # references that are not pinned.
          ZAP_CHECK=$(docker compose -f "$COMPOSE" config --format json \
            | python -c '
          import json, os, re, sys
          zap = json.load(sys.stdin)["services"]["zap"]
          build = zap.get("build")
          if build:
              path = os.path.join(build["context"], build.get("dockerfile") or "Dockerfile")
              text = open(path, encoding="utf-8").read()
              refs = re.findall(r"(?im)^[ \t]*FROM[ \t]+(?:--[^ \t]+[ \t]+)*([^ \t\r\n]+)", text)
          else:
              refs = [zap["image"]]
          unpinned = [ref for ref in refs if "@sha256:" not in ref] if refs else ["(no FROM)"]
          print(" ".join(unpinned) if unpinned else "OK " + zap["image"])
          ' || echo "")
          case "$ZAP_CHECK" in
            "OK "*) ZAP_IMAGE="${ZAP_CHECK#OK }"; echo "ZAP image: ${ZAP_IMAGE}, built from a digest-pinned base" ;;
            *) broken "compose's ZAP is not digest-pinned (${ZAP_CHECK:-unreadable}); not scanning with an unpinned scanner." ;;
          esac

          # Fetched here rather than by ZAP, so an unreachable or gated-off
          # backend is a red step with the reason in it, not a scan that
          # imported nothing and reported nothing.
          curl -fsS --max-time 30 \
            -H "X-Hub-Token: ${DEMO_GATE_TOKEN}" \
            -H "Authorization: Bearer ${DEMO_ADMIN_TOKEN}" \
            -o "$WRK/openapi.json" "${PUBLISHED_BACKEND}/openapi.json" \
            || broken "Could not fetch ${PUBLISHED_BACKEND}/openapi.json from the demo backend."
          PATHS=$(python -c 'import json,sys; print(len(json.load(open(sys.argv[1])).get("paths") or {}))' \
            "$WRK/openapi.json" 2>/dev/null || echo 0)
          if [ "$PATHS" -eq 0 ]; then
            broken "The backend's OpenAPI document has no paths: there is nothing to scan, and an empty scan is not a clean one."
          fi
          echo "OpenAPI document: ${PATHS} path(s)."

          # zap-api-scan.py actively scans unless told `-S` (safe mode, a
          # passive baseline). Same switch as the dashboard's scan: passive
          # after a Delivery (D-053), active weekly or on request.
          MODE=(-S)
          if [ "$ACTIVE" = "true" ]; then
            MODE=()
          else
            echo "::notice::API scan is passive only (D-053). Re-run with active_scan to include it."
          fi

          # Admin, through the gate. The bearer token goes in ZAP's own
          # header-auth variables, by name (`-e VAR`), and only to the backend
          # host; the gate token is a replacer rule, as the dashboard scan
          # uses. Both are the demo stack's public literals, never a secret.
          export ZAP_AUTH_HEADER=Authorization
          export ZAP_AUTH_HEADER_VALUE="Bearer ${DEMO_ADMIN_TOKEN}"
          export ZAP_AUTH_HEADER_SITE=backend
          # The start of the window the access-log check below reads.
          STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # `|| RC=$?`, not `RC=$?` on the next line: GitHub runs this under
          # `bash -e`, which ends the step on ZAP's exit 3 before a bare
          # `RC=$?` is reached, and `broken` below never writes the marker.
          RC=0
          docker run --rm --name mykronos-demo-zap-api --pull never \
            --network mykronos-demo_default \
            -v "$WRK:/zap/wrk:rw" \
            -e ZAP_AUTH_HEADER -e ZAP_AUTH_HEADER_VALUE -e ZAP_AUTH_HEADER_SITE \
            "$ZAP_IMAGE" zap-api-scan.py \
              -t openapi.json -f openapi \
              -O "${PROXIED_BACKEND}" \
              -J zap-api.json -I "${MODE[@]}" \
              -z "-config scanner.maxScanDurationInMins=20 -config replacer.full_list(0).description=perimeter-gate -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=X-Hub-Token -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=${DEMO_GATE_TOKEN}" \
            || RC=$?

          # 0, 1 and 2 are "scanned, and here is what it found" (pass, FAIL,
          # WARN). 3 is an error -- including importing no URLs at all.
          if [ "$RC" -ge 3 ] || [ ! -s "$WRK/zap-api.json" ]; then
            broken "zap-api-scan.py exited ${RC} against ${PROXIED_BACKEND}; no usable API report."
          fi

          # What ZAP actually got back. A scan whose requests the gate or the
          # admin check refused is a scan of the gate, and its report looks
          # exactly like a clean API -- the same trap the dashboard spider fell
          # into. The headers are ZAP's to send, so the evidence is the
          # backend's own uvicorn access log for the scan's window, not a
          # request made from here. The image runs uvicorn at `info` with the
          # access log on, and the demo compose file does not override that.
          # Format, from uvicorn's AccessFormatter:
          #   INFO:     172.18.0.5:41234 - "GET /api/repos HTTP/1.1" 200 OK
          # Only `/api/` lines count: the healthcheck is `/healthz` and this
          # step's own fetch was `/openapi.json`.
          docker logs --since "$STARTED" mykronos-demo-backend-1 > "$WRK/backend.log" 2>&1 || true
          SENT=$(python - "$WRK/backend.log" <<'PY'
          import re
          import sys
          from collections import Counter

          ANSI = re.compile(r"\x1b\[[0-9;]*m")
          LINE = re.compile(r'"[A-Z]+ (/api/\S*) HTTP/[0-9.]+" (\d{3})')
          try:
              text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          except OSError:
              text = ""
          seen = Counter()
          for raw in text.splitlines():
              match = LINE.search(ANSI.sub("", raw))
              if match:
                  seen[match.group(2)] += 1
          total = sum(seen.values())
          ok = sum(n for code, n in seen.items() if code.startswith("2"))
          print(total, ok, seen["401"] + seen["403"])
          PY
          ) || SENT="0 0 0"
          read -r API_TOTAL API_2XX API_DENIED <<< "$SENT"
          echo "The backend answered ZAP's /api/ requests: ${API_TOTAL} total, ${API_2XX} 2xx, ${API_DENIED} 401/403."
          if [ "$API_2XX" -eq 0 ] || [ $((API_DENIED * 2)) -gt "$API_TOTAL" ]; then
            broken "The API scan reached the gate, not the API: ${API_2XX} of ${API_TOTAL} /api/ responses were 2xx and ${API_DENIED} were 401/403. Not uploading it as a scan of the API."
          fi
          cp "$WRK/zap-api.json" "$RUNNER_TEMP/dast/zap-api.json"
          echo "API report written (zap-api-scan.py exit ${RC})."

      # Measure everything first, then report. The first live run put this
      # upload before the scan, the upload failed on a 502 from the ingestion
      # API, and `Spider, and scan` was *skipped* — so an unreachable Mykronos
      # silently cost the DAST scan as well as its own result. Reporting is
      # the fragile half and must never be able to prevent the work.
      - name: Upload the functional result
        # `!cancelled()`, not `always()`: a failed step still reports (as a
        # failed or partial run); a cancelled run reports nothing.
        if: ${{ !cancelled() }}
        uses: ./actions/upload-results
        with:
          capability: functional
          tool: junit
          results-path: ${{ runner.temp }}/functional
          ingestion-url: https://mykronos.toddbenson.net
          token: ${{ secrets.MYKRONOS_INGESTION_TOKEN }}
          # This repository scans itself, so the uploader it installs is this
          # commit's rather than a floating tag's. Nothing here can drift from
          # what is being tested (D-051).
          mykronos-ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Upload the DAST result
        # `!cancelled()`, not `always()`: a failed step still reports (as a
        # failed or partial run); a cancelled run reports nothing.
        if: ${{ !cancelled() }}
        uses: ./actions/upload-results
        with:
          capability: dast
          tool: zap
          results-path: ${{ runner.temp }}/dast
          ingestion-url: https://mykronos.toddbenson.net
          token: ${{ secrets.MYKRONOS_INGESTION_TOKEN }}
          mykronos-ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Keep the browser traces
        # A failed browser test keeps a Playwright trace (DOM, console and
        # network, step by step); `npx playwright show-trace` opens it. After
        # the uploads, like every report here, and never able to fail the job
        # on its own account.
        if: steps.e2e.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-traces
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
          retention-days: 14

      - name: Resource read
        # Before `Tear down`, so the containers still exist to be named, and
        # `always()` because the reading is the point on a run that failed as
        # much as on one that passed. Peaks and p95 per container, into the
        # job summary, and the ZAP version the stack actually ran.
        if: always()
        run: |
          set -uo pipefail
          kill "$(cat "$RUNNER_TEMP/stats/sampler.pid" 2>/dev/null)" 2>/dev/null || true
          ZAP_VERSION=$(curl -fsS --max-time 10 -x "$ZAP_PROXY" "http://zap/JSON/core/view/version/"             | python -c 'import json,sys; print(json.load(sys.stdin)["version"])' 2>/dev/null || echo unknown)
          ZAP_IMAGE=$(docker inspect -f '{{.Config.Image}}' mykronos-demo-zap-1 2>/dev/null || echo unknown)
          python - "$RUNNER_TEMP/stats/samples.log" "$ZAP_IMAGE" "$ZAP_VERSION" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import re, sys
          from collections import defaultdict

          path, image, version = sys.argv[1:4]
          UNITS = {"B": 1, "KIB": 1024, "MIB": 1024**2, "GIB": 1024**3, "KB": 1e3, "MB": 1e6, "GB": 1e9}

          def as_bytes(text):
              m = re.fullmatch(r"([\d.]+)([A-Za-z]+)", text.strip())
              return float(m.group(1)) * UNITS[m.group(2).upper()] if m else 0.0

          cpu, mem, first, last = defaultdict(list), defaultdict(list), None, None
          try:
              lines = open(path, encoding="utf-8").read().splitlines()
          except FileNotFoundError:
              lines = []
          for line in lines:
              parts = line.split()
              if len(parts) < 5 or not parts[2].endswith("%"):
                  continue
              ts, name = int(parts[0]), parts[1]
              first = ts if first is None else first
              last = ts
              cpu[name].append(float(parts[2].rstrip("%")))
              mem[name].append(as_bytes(parts[3]))

          def p95(xs):
              xs = sorted(xs)
              return xs[min(len(xs) - 1, int(round(0.95 * (len(xs) - 1))))]

          gib = lambda b: f"{b / 1024**3:.2f} GiB"
          print(f"### Resource read (D-114)\n")
          print(f"ZAP `{image}`, reporting version `{version}`. "
                f"{sum(len(v) for v in cpu.values())} samples over "
                f"{(last - first) if first is not None else 0}s of the run.\n")
          if not cpu:
              print("No samples were collected: the sampler never started, or no `mykronos-demo-` container existed.")
              sys.exit(0)
          print("| container | peak CPU | p95 CPU | mean CPU | peak memory | samples |")
          print("|---|---:|---:|---:|---:|---:|")
          for name in sorted(cpu, key=lambda n: -max(cpu[n])):
              c = cpu[name]
              print(f"| `{name}` | {max(c):.0f}% | {p95(c):.0f}% | {sum(c) / len(c):.0f}% | {gib(max(mem[name]))} | {len(c)} |")
          print("\nCPU is Docker's percentage of one core, so 200% is two cores flat out. "
                "D-053's reading on the shared host was 548% and 7 GiB for ZAP alone, with active scanning on.")
          PY

      - name: Tear down
        if: always()
        run: docker compose -f "$COMPOSE" down -v --remove-orphans

      - name: Fail if the scan could not get past the gate
        # Last, for the same reason as the step below.
        if: steps.zap.outcome == 'failure'
        run: |
          echo "::error::The DAST scan did not complete; see 'Spider, and scan'."
          exit 1

      - name: Fail if the API scan did not complete
        # Last, after the upload recorded it as a partial run.
        if: steps.zap_api.outcome == 'failure'
        run: |
          echo "::error::The API scan did not complete; see 'Scan the backend API from its OpenAPI document'."
          exit 1

      - name: Fail if the functional suite failed
        # Last, so both ScanRuns are recorded first. Failing earlier would
        # make the pipeline's verdict and the platform's record disagree
        # exactly when somebody most needs them to agree.
        if: steps.functional.outcome == 'failure'
        run: |
          echo "::error::The functional suite failed."
          exit 1

      - name: Fail if the browser suite failed
        # Last, for the same reason. Its JUnit is already in the functional
        # ScanRun; the trace is in the `e2e-traces` artifact.
        if: steps.e2e.outcome == 'failure'
        run: |
          echo "::error::The browser suite failed; see 'Browser suite (Playwright)' and the e2e-traces artifact."
          exit 1
