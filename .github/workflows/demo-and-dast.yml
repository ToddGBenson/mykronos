# Functional tests and DAST against an ephemeral demo stack — spec 32 §4.2.
#
# Replaces `demo-and-dast` in `deploy/concourse/pipelines/mykronos.yml`.
#
# **Why this is hand-written rather than rendered from a template.** `dast`
# and `functional` are real capabilities with real templates, and other
# repositories should keep using them: `dast.yml.j2` probes a `target_url`
# that somebody else deployed, which is the right model for a repository with
# a lower environment. This repository has no such environment — it has a
# compose file — and the orchestration around the scan is repository-specific
# infrastructure rather than a capability. Same reasoning as `delivery.yml`
# and spec 32 §5.
#
# **Why the two are one job.** The functional suite runs *through* ZAP's
# proxy, so ZAP's site tree is built from real authenticated use rather than
# from spidering a login page. Splitting them into two workflows would mean
# two environments and a ZAP that never saw the traffic — spec 16 §8's point
# that the functional suite is what gives ZAP depth. One build, two uploads,
# each answering for itself (spec 15 §4a.1).
#
# **What the ephemeral stack fixes.** Three failure modes in the Concourse
# lane are consequences of one shared, host-resident environment, and all
# three disappear here: `serial: true` (builds 8 and 9 wiped build 7's ZAP
# session), the "rebuild it on the host" preflight, and the seeded-repository
# check guarding against a stale environment. A stack that did not exist
# ninety seconds ago cannot be stale, cannot be shared, and cannot be missing.
#
# Measured at 72s from `down -v` to all four preflight assertions passing
# (spec 32 §4.2), against images already local. A runner pulls from GHCR,
# which is the one number that spike could not produce.

name: Demo and DAST

on:
  # After delivery, not on push: the stack runs the images `delivery.yml`
  # published for this commit, so it has to wait for them to exist. A `push`
  # trigger would race the publish and scan whatever `:latest` happened to be.
  workflow_run:
    workflows: ["Delivery"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      active_scan:
        description: >-
          Run ZAP's active scan as well as passive. Off by default: D-053
          paused active scanning after it measured 548% CPU and 7 GiB, and
          spec 32 §11 keeps that posture until somebody replaces it with a
          measurement taken on a runner rather than an assumption about one.
        type: boolean
        default: false

concurrency:
  group: demo-and-dast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  demo-and-dast:
    name: functional + ZAP
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A delivery that failed published nothing to scan. `workflow_run` fires
    # on completion regardless of outcome, so the check is explicit.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      # The commit under test. For a `workflow_run` that is the commit the
      # triggering Delivery ran on, NOT `github.sha` — which points at the
      # default branch's tip and would tag the results with the wrong commit
      # the moment two pushes land close together.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      COMPOSE: deploy/demo/docker-compose.yml
      # The runner dials ZAP directly, on the port compose publishes.
      ZAP_PROXY: http://localhost:8290
      # These are addresses ZAP resolves *on our behalf* — the proxied
      # functional suite and the spider target — and confusing them with the
      # published ones is what made 26 of 26 tests fail with `502 Bad Gateway`
      # on the first real run.
      #
      # ZAP runs in a container on the compose network, so `localhost` there
      # is ZAP itself: asking it to fetch `localhost:8201` makes it try to
      # proxy to its own port, and it answers 502 for anything whose Host it
      # does not recognise. The service names resolve on the network it shares
      # with them, which is why the compose file puts ZAP there — and why
      # `functional/conftest.py` already defaults to exactly these two.
      PROXIED_BACKEND: http://backend:8100
      PROXIED_FRONTEND: http://frontend:3100

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The functional adapter reads surrounding source to fingerprint a
          # finding's location (spec 05 §5).
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Lowercase the owner
        # `github.repository_owner` is `ToddGBenson`; a Docker repository name
        # must be lowercase or the pull is refused outright. Same fix as
        # `delivery.yml`, which is where a live run found it.
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stand up the demo stack
        env:
          MYKRONOS_IMAGE_BACKEND: ghcr.io/${{ env.OWNER }}/mykronos-backend:${{ github.event.workflow_run.head_sha || github.sha }}
          MYKRONOS_IMAGE_FRONTEND: ghcr.io/${{ env.OWNER }}/mykronos-frontend:${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE" pull --quiet
          docker compose -f "$COMPOSE" up -d

      - name: Wait for health
        run: |
          set -uo pipefail
          # Healthy, not merely started. A functional suite that races the
          # application reports the race rather than the application.
          deadline=$(( $(date +%s) + 300 ))
          healthy=0
          while [ "$(date +%s)" -lt "$deadline" ] && [ "$healthy" -lt 3 ]; do
            sleep 5
            healthy=0; states=""
            for svc in backend frontend zap; do
              state=$(docker inspect -f '{{.State.Health.Status}}' "mykronos-demo-${svc}-1" 2>/dev/null || echo absent)
              states="${states}${state} "
              [ "$state" = "healthy" ] && healthy=$((healthy + 1))
            done
            echo "  $states"
          done
          if [ "$healthy" -lt 3 ]; then
            docker compose -f "$COMPOSE" logs --tail 40
            echo "::error::The demo environment never became healthy."
            exit 1
          fi

      - name: Seed
        run: |
          set -euo pipefail
          # Through the container rather than the published port: minting an
          # ingestion token has no HTTP route — a token is shown once and only
          # its hash is stored (spec 12 §2) — so the seeder has to run where
          # the database is.
          BACKEND=$(docker compose -f "$COMPOSE" ps -q backend)
          docker cp deploy/demo/seed.py "${BACKEND}:/tmp/seed.py"
          docker exec "$BACKEND" python /tmp/seed.py --url http://localhost:8100

      - name: Narrow the suspicious-comments word list
        # Before the functional suite, not with the spider exclusions further
        # down. Rule 10027 is *passive*: it runs on traffic as it crosses the
        # proxy, so by the time the spider starts, the suite's page loads have
        # already been scanned with whatever list was in force.
        #
        # **Why this rule needed tuning.** 10027 looks for developer notes left
        # in shipped code, and its default list is TODO, FIXME, BUG, BUGS, XXX,
        # QUERY, DB, ADMIN, ADMINISTRATOR, USER, USERNAME, SELECT, WHERE, FROM,
        # LATER, DEBUG. Most of those are ordinary vocabulary for a security
        # console: this application's own text says "from", "user", "admin" and
        # "bug" constantly, and the CVE descriptions it renders say them again.
        #
        # It matched them because ZAP's JavaScriptLexer loses its place inside
        # a Next.js RSC payload — a JSON document, full of \" escapes, sitting
        # inside a JS string — and then reads the `//` of an ordinary
        # `https://github.com/...` link as the start of a line comment. The
        # "comment" runs to the end of a minified line, so every word on it
        # becomes a candidate. The evidence on all 24 findings was the English
        # word "from", matched case-insensitively, in prose.
        #
        # So the alerts were not about comments and could not be fixed in the
        # comments. Measured against the running application: the default list
        # alerted on essentially every page; TODO/FIXME/XXX alone alerted zero
        # times across ten, while still catching a real
        # `// TODO: remove the hardcoded admin credential` on a page whose
        # prose also said from, user, admin, bug and query.
        #
        # Kept deliberately: those three do not appear in ordinary writing, so
        # they still mean what the rule intends. Everything dropped here is a
        # word this application legitimately displays.
        run: |
          set -uo pipefail
          zap_api() { curl -fsS --max-time 60 -x "$ZAP_PROXY" "http://zap$1"; }

          # Not in the base image — the payload list is only editable through
          # this add-on, and the install is a marketplace fetch.
          zap_api "/JSON/autoupdate/action/installAddon/?id=custompayloads" >/dev/null

          ready=0
          for _ in $(seq 1 24); do
            if zap_api "/JSON/custompayloads/view/customPayloadsCategories/" >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            # Loud, and not fatal. A noisier DAST run is worth having; a lane
            # that reports nothing is not (see the report-writing note below).
            echo "::warning::custompayloads never came up — 10027 will run with its default word list."
            exit 0
          fi

          for word in QUERY DB ADMIN ADMINISTRATOR USER USERNAME SELECT WHERE FROM LATER BUG BUGS DEBUG; do
            zap_api "/JSON/custompayloads/action/disableCustomPayload/?category=Suspicious-Comments&payload=${word}" >/dev/null \
              || echo "::warning::could not disable suspicious-comment word ${word}"
          done

          echo -n "Suspicious-Comments now matches: "
          zap_api "/JSON/custompayloads/view/customPayloads/?category=Suspicious-Comments" \
            | python -c 'import json,sys; print(", ".join(p["payload"] for p in json.load(sys.stdin)["customPayloads"] if p["enabled"]))'

      - name: Functional suite, proxied through ZAP
        id: functional
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/functional"
          zap_api() { curl -fsS --max-time 60 -x "$ZAP_PROXY" "http://zap$1"; }

          # A session per run, so the site tree belongs to this commit. On a
          # shared ZAP this was load-bearing; here it is belt and braces, and
          # cheap.
          zap_api "/JSON/core/action/newSession/?name=run-${SHA}&overwrite=true" >/dev/null

          python -m pip install --quiet pytest httpx2
          HTTP_PROXY="$ZAP_PROXY" HTTPS_PROXY="$ZAP_PROXY" \
          DEMO_FRONTEND_URL="$PROXIED_FRONTEND" DEMO_BACKEND_URL="$PROXIED_BACKEND" \
            python -m pytest functional -q -p no:cacheprovider \
              --junitxml="$RUNNER_TEMP/functional/functional.xml"

      - name: Spider, and scan
        id: zap
        # `always()`: a failed functional suite still leaves a site tree worth
        # scanning, and a failed *upload* must not skip this at all.
        if: always()
        continue-on-error: true
        env:
          ACTIVE: ${{ inputs.active_scan }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/dast"
          zap_api() { curl -fsS --max-time 60 -x "$ZAP_PROXY" "http://zap$1"; }

          SEEDED=$(zap_api "/JSON/core/view/urls/" | python -c 'import json,sys; print(len(json.load(sys.stdin)["urls"]))')
          echo "Site tree: ${SEEDED} URL(s) seeded by the tests."

          # Next.js build assets are static, numerous, and identical every
          # run. Excluding them keeps the scan about the application. Written
          # out rather than looped: three URLs that differ in the middle are
          # clearer as three lines than as one line of parameter expansion.
          # Tolerated failures — an exclusion ZAP declines is a noisier scan,
          # not a broken one.
          zap_api "/JSON/core/action/excludeFromProxy/?regex=.*/_next/static/.*" >/dev/null || true
          zap_api "/JSON/spider/action/excludeFromScan/?regex=.*/_next/static/.*" >/dev/null || true
          zap_api "/JSON/ascan/action/excludeFromScan/?regex=.*/_next/static/.*" >/dev/null || true

          # Bounded, so a scan that never reports 100 fails with a message
          # rather than running out the job's 60-minute clock with no clue why.
          poll() {
            local endpoint="$1" limit="$2" waited=0
            until [ "$(zap_api "$endpoint" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')" = "100" ]; do
              sleep 5
              waited=$((waited + 5))
              if [ "$waited" -ge "$limit" ]; then
                echo "::error::$endpoint did not reach 100% within ${limit}s."
                return 1
              fi
            done
          }

          # `|| true` on every poll, and the report written whatever they
          # returned. GitHub runs `run:` steps under `bash -e`, so a poll that
          # timed out killed the step before the report was written -- and ZAP
          # had already collected passive findings for the 29 seeded URLs by
          # then. Seventeen consecutive runs failed this way from 2026-08-30,
          # each uploading nothing.
          #
          # Losing the report is far worse than an incomplete scan. A finding
          # closes only after two consecutive *successful* scans observe its
          # absence (`reconcile.REQUIRED_ABSENCES`), so a lane that reports
          # nothing cannot close anything: 115 DAST findings stayed open here
          # against an application that had already been fixed, because the
          # evidence of the fix was thrown away every run.
          zap_api "/JSON/spider/action/scan/?url=${PROXIED_FRONTEND}&recurse=true" >/dev/null
          SPIDER_OK=1
          poll "/JSON/spider/view/status/" 600 || SPIDER_OK=0

          # Non-fatal, and this is the same lesson as the report itself: this
          # is a progress line, and under `bash -e` a progress line that fails
          # kills the step before the report is written. A count nobody could
          # read is not worth the artefact.
          AFTER=$(zap_api "/JSON/core/view/urls/" \
            | python -c 'import json,sys; print(len(json.load(sys.stdin)["urls"]))' \
            || echo "unknown")
          echo "Site tree: ${AFTER} URL(s) after spidering, from ${SEEDED} seeded by the tests."

          ACTIVE_OK=1
          if [ "$ACTIVE" = "true" ]; then
            zap_api "/JSON/ascan/action/scan/?url=${PROXIED_FRONTEND}&recurse=true" >/dev/null
            poll "/JSON/ascan/view/status/" 2400 || ACTIVE_OK=0
          else
            echo "::notice::Passive scan only (D-053). Re-run with active_scan to include it."
          fi

          # Always. This is the line the whole step exists to produce.
          zap_api "/OTHER/core/other/jsonreport/" > "$RUNNER_TEMP/dast/zap.json"

          # Said out loud, and not as an error: an incomplete crawl is a
          # narrower scan, not a broken one, and the findings it did produce
          # are real. Reporting it as a failure is what made the platform
          # discard them.
          if [ "$SPIDER_OK" -eq 0 ] || [ "$ACTIVE_OK" -eq 0 ]; then
            echo "::warning::The crawl did not finish inside its budget. The report covers the ${AFTER} URL(s) reached, which is a narrower scan rather than a failed one."
          fi

      # Measure everything first, then report. The first live run put this
      # upload before the scan, the upload failed on a 502 from the ingestion
      # API, and `Spider, and scan` was *skipped* — so an unreachable Mykronos
      # silently cost the DAST scan as well as its own result. Reporting is
      # the fragile half and must never be able to prevent the work.
      - name: Upload the functional result
        if: always()
        uses: ./actions/upload-results
        with:
          capability: functional
          tool: junit
          results-path: ${{ runner.temp }}/functional
          ingestion-url: https://mykronos.toddbenson.net
          token: ${{ secrets.MYKRONOS_INGESTION_TOKEN }}
          # This repository scans itself, so the uploader it installs is this
          # commit's rather than a floating tag's. Nothing here can drift from
          # what is being tested (D-051).
          mykronos-ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Upload the DAST result
        if: always()
        uses: ./actions/upload-results
        with:
          capability: dast
          tool: zap
          results-path: ${{ runner.temp }}/dast
          ingestion-url: https://mykronos.toddbenson.net
          token: ${{ secrets.MYKRONOS_INGESTION_TOKEN }}
          mykronos-ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Tear down
        if: always()
        run: docker compose -f "$COMPOSE" down -v --remove-orphans

      - name: Fail if the functional suite failed
        # Last, so both ScanRuns are recorded first. Failing earlier would
        # make the pipeline's verdict and the platform's record disagree
        # exactly when somebody most needs them to agree.
        if: steps.functional.outcome == 'failure'
        run: |
          echo "::error::The functional suite failed."
          exit 1
