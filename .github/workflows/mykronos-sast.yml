# Generated by Mykronos Workflow Installer — template version: 1.2.1
# Capability: sast · Repo: ToddGBenson/mykronos
#
# Do not edit by hand. A template resync will overwrite this file (spec 03 §6).
# To change behaviour, edit this repo's sast capability config in
# Mykronos.

name: Mykronos sast

on:

  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:


permissions:
  contents: read

  actions: read
  security-events: read


concurrency:
  group: mykronos-sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: CodeQL (${{ matrix.language }})

    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # One language failing to build must not hide findings in the others.
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "python"]


    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:

          # Full history: the adapter reads surrounding source to build the
          # snippet fingerprint that gives a finding stable identity
          # (spec 05 §5).
          fetch-depth: 0


      - name: Fail fast if Mykronos is unreachable
        # spec 05 §4. Better to stop in ten seconds than scan for twenty
        # minutes and find at upload time that the results have nowhere to go
        # — and silently skipping is not an option (spec 01 §6).
        #
        # Retried, because one slow answer is not an unreachable platform.
        # On 2026-08-30 seven lanes failed together on `curl: (28) Operation
        # timed out after 20002 milliseconds` while the ingestion host was
        # briefly saturated — it was serving in 0.3s a few minutes either
        # side. A single-shot probe turns a busy minute into seven red checks
        # and a scan that never ran, which is a worse answer than waiting.
        #
        # `--retry-all-errors` is what makes this work: `--retry` alone does
        # not retry a timeout, which is the exact failure observed.
        #
        # Still fails fast in the case it exists for. Three attempts at 15s
        # with a 5s backoff is under a minute, against the twenty a scan
        # would otherwise waste before discovering the same thing.
        run: |
          curl --fail --silent --show-error --max-time 15 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.MYKRONOS_INGESTION_TOKEN }}" \
            "https://mykronos.toddbenson.net/api/ingest/health" > /dev/null


      - name: Initialize CodeQL
        uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b  # v3.37.6
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@c4dd10e44af883a891fe31ced449bcb4a6728b9b  # v3.37.6

      - name: Analyze
        uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b  # v3.37.6
        with:
          category: "/language:${{ matrix.language }}"
          output: ${{ runner.temp }}/mykronos-results
          # Mykronos is the system of record for findings (spec 05 §1), so we
          # take the SARIF ourselves rather than routing it to code scanning.
          upload: false


      - name: Upload results to Mykronos
        # Shared composite action, semver-pinned: every onboarded repo depends
        # on it, so it must never be referenced by branch (spec 04 §2).
        # `always()` because a scan that failed still has to register its
        # ScanRun — "never ran" and "ran and broke" must stay distinguishable
        # in the lake (spec 04 §6, §7).
        if: always()
        uses: ToddGBenson/mykronos/actions/upload-results@cce7495afafb3f22b014847bd91624ced9b8e2dd
        with:
          capability: sast
          tool: codeql

          results-path: ${{ runner.temp }}/mykronos-results

          ingestion-url: https://mykronos.toddbenson.net
          token: ${{ secrets.MYKRONOS_INGESTION_TOKEN }}
          severity-threshold: low
          blocking: "false"
          # Same ref as the `uses:` line above, resolved when this file was
          # rendered. The action can also fall back to `github.action_ref`, but
          # that is empty inside a composite action, so it is not relied on.
          mykronos-ref: cce7495afafb3f22b014847bd91624ced9b8e2dd



      - name: Import reachability
        # Which Python files nothing in the repository imports (spec 19 §2.1).
        #
        # Not reachability in the call-graph sense, and the platform says so
        # everywhere it surfaces this. It answers one narrow question that is
        # nonetheless true, where spec 17 §5.3 correctly declined to answer a
        # much harder one falsely.
        #
        # Under sast because reachability is a fact about source code and
        # sast is the capability whose findings it prioritises. A capability
        # of its own would mean a separate grant for something with no
        # findings and no workflow to enable.
        #
        # Runs once per workflow, not once per matrix language: the analysis
        # is Python-only and the matrix would post the same result several
        # times, each overwriting the last.
        if: matrix.language == 'python' || matrix.language == 'javascript-typescript'
        continue-on-error: true
        run: |
          set -uo pipefail
          python -m pip install --quiet 'mykronos @ git+https://github.com/ToddGBenson/mykronos@cce7495afafb3f22b014847bd91624ced9b8e2dd#subdirectory=backend' || exit 0
          python -m mykronos.reachability . \
            --commit-sha "${{ github.sha }}" > reachability.json || exit 0

          echo "Analysed $(jq -r '.files_analysed' reachability.json) Python file(s);" \
               "$(jq -r '.orphaned_paths | length' reachability.json) orphaned."

          curl --fail --silent --show-error --max-time 60 \
            -X POST "https://mykronos.toddbenson.net/api/ingest/reachability" \
            -H "Authorization: Bearer ${{ secrets.MYKRONOS_INGESTION_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @reachability.json > /dev/null

