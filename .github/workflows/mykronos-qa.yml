# Generated by Mykronos Workflow Installer — template version: 1.1.0
# Capability: qa · Repo: ToddGBenson/mykronos
#
# Do not edit by hand. A template resync will overwrite this file (spec 03 §6).
# To change behaviour, edit this repo's qa capability config in
# Mykronos.

name: Mykronos qa

on:

  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: mykronos-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: qa (${{ matrix.check.name }})

    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # One check failing must not cancel the others. The whole reason these
      # are separate legs is that a lint failure should not hide a broken
      # contract, and `fail-fast: true` would reinstate exactly that.
      fail-fast: false
      matrix:
        check:
          # `tojson` on every value: these are configured strings that land in
          # YAML, and a command containing a colon or a quote would otherwise
          # end the scalar and change the document's shape. Setup lines are
          # joined here, at render time, rather than left as a list for a
          # GitHub expression to join at runtime — the value is known now, and
          # `join()` with a literal newline is awkward to write and easy to
          # get subtly wrong.
          - name: "lint-and-types"
            command: "set +e; python -m ruff check . \u003e /tmp/ruff.txt 2\u003e\u00261; rc_ruff=$?; python -m mypy mykronos \u003e /tmp/mypy.txt 2\u003e\u00261; rc_mypy=$?; python -m mykronos.junit_stage --out \"$MYKRONOS_RESULTS/lint.xml\" --suite lint-and-types --case \"ruff:$rc_ruff:/tmp/ruff.txt\" --case \"mypy:$rc_mypy:/tmp/mypy.txt\"; [ \"$rc_ruff\" -eq 0 ] \u0026\u0026 [ \"$rc_mypy\" -eq 0 ]"
            setup: "cd backend\npython -m pip install --quiet -e \".[dev]\""
          # `tojson` on every value: these are configured strings that land in
          # YAML, and a command containing a colon or a quote would otherwise
          # end the scalar and change the document's shape. Setup lines are
          # joined here, at render time, rather than left as a list for a
          # GitHub expression to join at runtime — the value is known now, and
          # `join()` with a literal newline is awkward to write and easy to
          # get subtly wrong.
          - name: "spec-links"
            command: "python scripts/check_links.py . --junit-xml=\"$MYKRONOS_RESULTS/qa-spec-links.xml\""
            setup: ""


    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:

          # Full history: the adapter reads surrounding source to build the
          # snippet fingerprint that gives a finding stable identity
          # (spec 05 §5).
          fetch-depth: 0


      - name: Fail fast if Mykronos is unreachable
        # spec 05 §4. Better to stop in ten seconds than scan for twenty
        # minutes and find at upload time that the results have nowhere to go
        # — and silently skipping is not an option (spec 01 §6).
        run: |
          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer ${{ secrets.MYKRONOS_INGESTION_TOKEN }}" \
            "https://mykronos.toddbenson.net/api/ingest/health" > /dev/null



      - name: Run the qa suite
        # `continue-on-error` rather than `|| true`: the step's own outcome is
        # what the summary step reads, and a suite that fails must still
        # upload. "The tests failed" and "nothing told us anything" are
        # different facts, and the second is worse (spec 04 §6).
        id: suite
        continue-on-error: true
        env:
          # Where the JUnit XML has to land. Named rather than hardcoded into
          # the command so a config written once keeps working if the upload
          # contract moves.
          MYKRONOS_RESULTS: ${{ runner.temp }}/mykronos-results

          # Bound to env, never interpolated into the script body. These are
          # admin-set config rather than attacker-controlled, but `${{ ... }}`
          # is substituted before bash sees the line, so a value containing a
          # quote would change the script's *syntax* rather than its data. The
          # upload action's own comment argues at length that the source of a
          # value is the wrong thing to rely on when deciding this; same
          # reasoning, one file over.
          MYKRONOS_CHECK_NAME: ${{ matrix.check.name }}
          MYKRONOS_CHECK_SETUP: ${{ matrix.check.setup }}
          MYKRONOS_CHECK_COMMAND: ${{ matrix.check.command }}

        run: |
          set -uo pipefail
          mkdir -p "$MYKRONOS_RESULTS"

          echo "qa check: $MYKRONOS_CHECK_NAME"
          if [ -n "$MYKRONOS_CHECK_SETUP" ]; then
            bash -c "$MYKRONOS_CHECK_SETUP"
          fi
          bash -c "$MYKRONOS_CHECK_COMMAND"


      - name: Say what the suite did
        # Before the upload, and unconditionally. An operator reading a failed
        # run should not have to open Mykronos to find out whether the suite
        # ran and failed or never started.
        if: always()
        run: |
          count=$(ls -1 "${{ runner.temp }}/mykronos-results"/*.xml 2>/dev/null | wc -l)
          echo "qa: outcome=${{ steps.suite.outcome }}, $count JUnit report(s)."
          if [ "$count" -eq 0 ]; then
            echo "::warning::The suite produced no JUnit XML. Mykronos will record this run as having reported nothing."
          fi


      - name: Upload results to Mykronos
        # Shared composite action, semver-pinned: every onboarded repo depends
        # on it, so it must never be referenced by branch (spec 04 §2).
        # `always()` because a scan that failed still has to register its
        # ScanRun — "never ran" and "ran and broke" must stay distinguishable
        # in the lake (spec 04 §6, §7).
        if: always()
        uses: ToddGBenson/mykronos/actions/upload-results@8b329fc5c1f739eab8ad40b8a7628da7cd1ee935
        with:
          capability: qa
          tool: junit

          results-path: ${{ runner.temp }}/mykronos-results

          ingestion-url: https://mykronos.toddbenson.net
          token: ${{ secrets.MYKRONOS_INGESTION_TOKEN }}
          severity-threshold: low
          blocking: "false"
          # Same ref as the `uses:` line above, resolved when this file was
          # rendered. The action can also fall back to `github.action_ref`, but
          # that is empty inside a composite action, so it is not relied on.
          mykronos-ref: 8b329fc5c1f739eab8ad40b8a7628da7cd1ee935



      - name: Fail the build if the suite failed
        # Last, so the ScanRun is recorded first. Failing earlier would make
        # the pipeline's verdict and the platform's record disagree exactly
        # when somebody most needs them to agree.
        if: steps.suite.outcome == 'failure'
        run: |
          echo "::error::The qa suite failed."
          exit 1

