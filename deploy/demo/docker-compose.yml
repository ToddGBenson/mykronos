# The demo environment (PIP-4).
#
# Stood up from nothing, seeded, tested, attacked, and destroyed — inside a
# single Concourse task, on a Docker daemon that dies with it. That is what
# makes it immutable rather than merely re-deployable: there is no long-lived
# instance for a previous run to have modified.
#
# Immutability is not tidiness here, it is what makes a DAST result mean
# anything. An active scan submits forms, creates records and follows
# destructive links. Scanning an environment the last scan modified is not
# scanning the application; it is scanning the wreckage of the last scan.
#
# It is also what the `iac` capability scans — the same file that builds it.
#
#   docker compose -f deploy/demo/docker-compose.yml up -d
#
# It runs on the host rather than inside a Concourse task, and that is not a
# preference. dockerd will not start inside a task on this worker - the same
# constraint that moved image builds to kaniko - so a design that stood the
# environment up in-task failed twice before this one replaced it.
#
# Immutability is preserved by the rebuild script, which destroys and
# recreates rather than restarting: state is tmpfs, so nothing survives the
# teardown even by accident.
#
# The ports are published on all interfaces because the Concourse task
# reaches them by host IP, and they are offset from production (8201/3200
# for 8100/3100) so that a mistyped URL cannot aim an active scan at prod.
#
# 8201 rather than the obvious 8200: Vault already holds 8200 on this host,
# so the demo backend failed to bind and the stack came up without it -
# visibly, because compose exits non-zero, but only if somebody reads it.
#
# What that costs: a LAN-visible instance holding fixed credentials. It is
# acceptable only because of what is inside - synthetic data, no GitHub App
# key, no production credential - and because it is destroyed after each run.
# The tokens are fixed literals because a generated secret in an environment
# that exists for ten minutes buys nothing and has to be handed to the
# functional suite and ZAP regardless.

name: mykronos-demo

# Every image in this file is a TOOL, not a service (mykronos #666).
#
# The stack above already says why: stood up from nothing, seeded, attacked and
# destroyed inside one Concourse task, on tmpfs, holding synthetic data. Its
# containers serve no traffic and keep nothing. Findings in them are real and
# they are not estate risk in the sense the risk view means.
#
# Without this, 90% of the estate's container findings came from one image in
# here -- the ZAP scanner -- and drowned the 5 criticals in the process that
# holds every credential the estate has.
#
# `x-` is compose's own extension prefix, so `docker compose` ignores this.
# Absence means `service`: an undeclared image counts toward risk, because
# quietly removing findings from a total is the error that matters.
x-mykronos-role: tool

services:
  backend:
    image: ${MYKRONOS_IMAGE_BACKEND:-mykronos-backend:latest}
    ports:
      # Published on all interfaces because the Concourse task that runs the
      # functional suite reaches this by host IP - it has no route to a
      # loopback publish, exactly as the production backend found.
      #
      # Ports deliberately offset from production (8100/3100) so a mistyped
      # URL cannot point a scan at prod, which is the failure this
      # environment exists to make impossible.
      - "8201:8100"
    environment:
      # Fixed, and safe because this environment is destroyed with the task
      # that created it. Deliberately not the production tokens: a demo that
      # borrows production credentials is a demo that can reach production.
      MYKRONOS_GATE_TOKEN: demo-gate-token-not-a-secret
      MYKRONOS_ADMIN_TOKEN: demo-admin-token-not-a-secret
      MYKRONOS_VIEWER_TOKEN: demo-viewer-token-not-a-secret
      MYKRONOS_INGESTION_API_URL: http://backend:8100
      # No GitHub App. The demo must not be able to reach a real repository,
      # and the platform already degrades honestly without one — it says so
      # in the log rather than pretending.
      MYKRONOS_DATALAKE_DIR: /data/datalake
      MYKRONOS_DATABASE_URL: sqlite:////data/mykronos.db
    tmpfs:
      # The whole point. State lives in memory and cannot outlive the
      # container, so "rebuild from nothing" is the only thing that can
      # happen — there is no volume for a run to inherit.
      #
      # `uid=10001` is not optional. A tmpfs mounts root-owned and the image
      # runs as uid 10001, so without it the backend dies at startup with
      # "Permission denied: /data/datalake" — the same ownership mistake the
      # volume migration made, arriving by a different route.
      - /data:uid=10001,gid=10001,mode=0755
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/healthz', timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s

  frontend:
    image: ${MYKRONOS_IMAGE_FRONTEND:-mykronos-frontend:latest}
    ports:
      - "3200:3100"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      MYKRONOS_API_URL: http://backend:8100
      MYKRONOS_ADMIN_TOKEN: demo-admin-token-not-a-secret
      MYKRONOS_GATE_TOKEN: demo-gate-token-not-a-secret
    healthcheck:
      test:
        - CMD
        # `/nodejs/bin/node`, not `node`: the frontend image is distroless,
        # so there is no shell and nothing is on PATH. Same mistake as the
        # production compose, in a second file, which is the argument for
        # the image declaring its own healthcheck and compose not overriding
        # it at all.
        #
        # `/api/healthz`, not `/` (TheHub #60735). `MYKRONOS_GATE_TOKEN` is
        # set above, so since #753 every other path is behind the perimeter
        # gate and answers a token-less healthcheck with 401: the frontend
        # sat at `unhealthy` and Demo and DAST failed on every main commit
        # from 2026-10-05. `/api/healthz` is the gate's one exemption, and
        # the image's own HEALTHCHECK. Kept as an override only for the
        # faster interval; `test_demo_healthcheck.py` holds it to that path.
        - /nodejs/bin/node
        - -e
        - "fetch('http://localhost:3100/api/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  # OWASP ZAP in daemon mode (PIP-3).
  #
  # Present in the compose file rather than started separately because the
  # functional suite has to be proxied *through* it, which means it must exist
  # before the tests run and share their network. A ZAP started afterwards
  # sees no traffic and spiders from the login page, which is the scan this
  # whole arrangement exists to replace.
  #
  # Built, not pulled: deploy/zap/Dockerfile is upstream's `weekly` held at one
  # digest (D-128) with Debian's fixes applied and the browser, X server,
  # compiler and SSH client our usage never runs removed. Its FROM is the pin
  # (D-114), and TheHub's `zap` resource pins the same digest - move both
  # together. The 2.17.0 release image is Debian 12 with 822 fixable CVEs its
  # maintainers never rebuilt, which is why the base is the weekly at all.
  #
  # `image:` names the local build; it is in no registry, so `pull_policy:
  # build` keeps compose from looking for it there, and the lane's API scan
  # runs it with `--pull never`. The containers lane builds the same
  # Dockerfile and scans that (mykronos.estate_images, `builds`).
  zap:
    build:
      context: ../zap
    image: mykronos-zap:local
    pull_policy: build
    # Out-of-band rebuild (.github/workflows/zap-image.yml): the same
    # Dockerfile, built nightly and published as
    # ghcr.io/<owner>/mykronos-zap:weekly-p<date> only when strictly better.
    # ghcr.io and not the LAN registry, because the DAST lane that runs this
    # service is on GitHub's runners. Declared, not adopted: this service
    # still builds locally until a reviewed change pins a published date and
    # drops `build:`. That change must also keep the image's finding identity
    # (`mykronos-zap`; ghcr.io's path adds the owner), for example by having
    # the containers lane scan a LAN copy, as it does the application images.
    # The baseline is upstream's image at the same digest, because the local
    # tag above cannot be pulled to scan.
    x-mykronos-build:
      context: ../zap
      publish: mykronos-zap:weekly
      baseline: ghcr.io/zaproxy/zaproxy:weekly@sha256:4ec932d24ee6fa7181333a719d519cdebf92df541058d48041ce3358528cd0ea
    # Loopback only. The API below runs with no key and accepts any caller,
    # and ZAP's API can load and run scripts, so a LAN-reachable port is code
    # execution on this container. The DAST lane (.github/workflows/
    # demo-and-dast.yml) reaches it at localhost:8290. The paused Concourse
    # demo-and-dast job reached it at DEMO_HOST:8290 and would need an API
    # key before it runs again.
    ports:
      - "127.0.0.1:8290:8090"
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8090
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.disablekey=true
    healthcheck:
      # ZAP ships curl. Checking the API rather than the port because ZAP
      # accepts connections well before it will answer a scan request.
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/JSON/core/view/version/"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 10s
