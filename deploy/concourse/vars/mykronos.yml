# Non-secret vars for `pipelines/mykronos.yml`. See README.md in this directory.
#
# Every value here is transcribed from the vars array in
# `deploy/concourse/set-pipeline.ps1`, and a test asserts the two still agree.
# Nothing in this file is a credential: the five that are
# (mykronos-ingestion-token, mykronos-gate-token, minio-access-key,
# minio-secret-key, hub-story-token) and the two Slack values resolve from
# Vault at build time.

# Host IP, not a Docker name: garden task containers resolve through the public
# servers set in compose and have never heard of `mykronos` or `minio`.
# 192.168.65.254 is Docker Desktop's host gateway, which reaches this
# machine's loopback, so the services can publish on 127.0.0.1 (TheHub #60841;
# see set-pipeline.ps1).
mykronos-url: http://192.168.65.254:8100

# The pinned uploader tag. `pin-check` is what notices when it goes stale;
# moving it means moving it in set-pipeline.ps1 and here, in one commit.
mykronos-ref: v18

# The branch every upload reports (PS-6), rather than each lane naming the
# default branch as a literal.
scanned-branch: main

# The timezone the `weekly` timer reads its window in (#60014). personal-soc
# and thehub have carried this since they were written; mykronos did not, so
# its window ran in UTC -- "Sunday 04:00" was 21:00 Saturday in Phoenix. The
# `weekly` resource is the only consumer.
scan-timezone: America/Phoenix

# How far forward `time-travel` moves the clock (TheHub #61109), in
# libfaketime's relative form. Longer than NVD_RETRY_DAYS (30), the window
# behind #1034's bomb, and a test keeps it so; it reaches only windows shorter
# than itself, not every window in the code.
time-travel-offset: +45d

# Where `time-travel` files its story: TheHub's API, through the same host
# gateway as everything else here (vars/thehub.yml carries the same value).
thehub-url: http://192.168.65.254:8000

# The detector benchmark corpus the `bench` job grades (spec 23 §1.6, TheHub
# #60742). Onboarded with `synthetic: true`; until it is, every `bench` build
# is red with "not onboarded", by design.
bench-repo: ToddGBenson/mykronos-bench

minio-endpoint: http://192.168.65.254:9000
registry: 192.168.65.254:5000
demo-host: 192.168.65.254
