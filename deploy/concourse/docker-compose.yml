# Concourse for Mykronos (spec 15).
#
# Differences from the quickstart compose this replaces, all of them section 7:
#
#   - No `admin:admin`. The local user's password comes from .env, which is
#     gitignored and generated by `setup.ps1`. A default credential on a host
#     whose worker can deploy is the largest risk in this design.
#   - Nothing is published to 0.0.0.0. Concourse and MinIO bind to loopback;
#     reaching them from elsewhere is the Cloudflare tunnel's job, which means
#     no port opens on the router.
#   - Postgres is not published at all. It is reachable only on the compose
#     network, and TheHub already owns 5432 on this host.
#
# `quickstart` ran web and worker in one container. That was right until one
# worker became the bottleneck - a scan pass off a single commit starved the
# other pipeline for hours, checks included - so web and two workers are now
# separate services. As predicted, it was a compose change and not a redesign.

name: mykronos-concourse

# ── workers ────────────────────────────────────────────────────────────
# Two, because one was the bottleneck: builds queued behind each other and
# so did the resource checks that decide whether a build can start at all.
# They are defined from one anchor so they cannot drift apart; what differs
# is the name, the key, and the state volume, and those must differ.
#
# This adds no CPU - it is the same host - so it is not a throughput fix.
# What it buys is that the two pipelines stop queueing behind each other,
# which is the failure actually observed.
#
# Capped at 6 CPUs of the 20 here. Production, demo, Postgres, Redis, MinIO
# and the registry share this machine, and D-053 is the record of what it
# costs when a scan is allowed to take all of it: at 548% CPU, production
# served timeouts. Two capped workers can take 12 of 20 and leave the rest.
#
# The memory ceiling is deliberately generous rather than tight. A CPU cap
# slows a build down; a memory cap kills it, and an OOM in the middle of a
# scan looks like a tool bug for as long as it takes to find the limit.
# 6g is a runaway backstop, not a budget.
x-worker: &worker
  image: concourse/concourse:7.14
  restart: unless-stopped
  command: worker
  # A worker runs the container runtime. This is the privilege that
  # quickstart forced onto the web node too, and no longer does.
  privileged: true
  depends_on:
    concourse:
      condition: service_healthy
  cpus: 6
  mem_limit: 6g
  environment: &worker-env
    CONCOURSE_TSA_HOST: concourse:2222
    CONCOURSE_TSA_PUBLIC_KEY: /keys/tsa_host_key.pub
    CONCOURSE_WORK_DIR: /worker-state
    CONCOURSE_BAGGAGECLAIM_DRIVER: overlay

    # There is no CONCOURSE_GARDEN_NETWORK here, though the quickstart config
    # carried a `CONCOURSE_WORKER_GARDEN_NETWORK: host` for as long as it
    # existed. The worker forwards every CONCOURSE_GARDEN_* variable to gdn as
    # a flag, and gdn has no --network flag: setting it here killed both
    # workers on boot with `unknown flag 'network'`. Under quickstart the name
    # did not match the forwarding prefix, so it was never passed on and never
    # did anything - dead configuration that only looked load-bearing.

    # Garden gives each task container Docker's internal resolver at
    # 127.0.0.11, which is not reachable from inside them, so every resource
    # check failed with "Could not resolve host: github.com" — a DNS handoff
    # that was never wired up, reading as a network outage.
    #
    # Public resolvers, and the consequence is accepted rather than worked
    # around. `CONCOURSE_GARDEN_DNS_PROXY_ENABLE` looked like the tidy fix
    # and did not bridge it: this container resolves through Docker's
    # embedded server at 127.0.0.11, which a garden container cannot reach
    # from its own network namespace either way.
    #
    # So Docker service names do not resolve inside tasks, and internal
    # services are addressed by IP instead - see the pipeline vars. An IP
    # needs no resolver, and the alternative was a DNS rabbit hole to save
    # two lines of configuration.
    CONCOURSE_GARDEN_DNS_SERVER: "1.1.1.1,8.8.8.8"

    # Builds are pruned aggressively: this host runs several other stacks and
    # Concourse will happily fill a disk with container volumes.
    CONCOURSE_BAGGAGECLAIM_VOLUME_SWEEPER_MAX_IN_FLIGHT: "5"
    CONCOURSE_LOG_LEVEL: info
  networks: [concourse]
  extra_hosts:
    # How a pipeline task reaches the Mykronos backend on the host.
    - "host.docker.internal:host-gateway"


services:
  concourse-db:
    image: postgres:15
    container_name: mykronos-concourse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: concourse
      POSTGRES_USER: concourse
      POSTGRES_PASSWORD: ${CONCOURSE_POSTGRES_PASSWORD:?set it in .env}
    volumes:
      - concourse-db-data:/var/lib/postgresql/data
    networks: [concourse]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concourse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Artifact and SBOM storage (spec 15 §5). S3-compatible rather than a mounted
  # share: Concourse's `s3` resource handles versioning and retention, and the
  # same pipeline runs unchanged against real S3 later. Point the volume at the
  # NAS by setting MINIO_DATA_DIR.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: mykronos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set it in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set it in .env}
    volumes:
      - ${MINIO_DATA_DIR:-minio-data}:/data
    ports:
      # 9000 is published on all interfaces because garden task containers
      # reach it by host IP: they cannot resolve `minio`, and a loopback
      # publish is invisible to them. Credentials are generated, never
      # defaulted. The console stays on loopback - it has no reason to be
      # reachable from anywhere but this machine.
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    networks: [concourse]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Image registry (spec 15 §5, D-038). The pipeline builds images and pushes
  # here; the host pulls from here and restarts the stack.
  #
  # This split is deliberate. The obvious alternative -- mounting the host's
  # Docker socket into a Concourse task -- would let any pipeline task control
  # this machine, which is exactly the risk §7 raises about a worker sitting
  # inside the LAN. A registry is a one-way handoff: Concourse can publish an
  # image, and nothing it does can restart a service.
  #
  # Published on all interfaces because garden task containers reach it by
  # host IP; they cannot resolve Docker service names. The host pulls via
  # localhost:5000, which Docker treats as insecure-by-default, so no daemon
  # configuration is required on this machine.
  registry:
    image: registry:2
    container_name: mykronos-registry
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    networks: [concourse]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/v2/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Credential manager for Concourse, and a personal secret store (see
  # vault/config.hcl for why file storage and why TLS is off).
  #
  # Concourse stores pipeline config verbatim: a secret passed with
  # `fly set-pipeline -l vars.yml` is readable afterwards via `fly get-pipeline`.
  # With this, pipelines carry `((var))` references and the values never enter
  # the config at all.
  #
  # Sealed after every restart by design. `vault-unseal.ps1` opens it; until
  # then, credential lookups fail loudly rather than resolving to empty.
  vault:
    image: hashicorp/vault:1.21.4
    container_name: mykronos-vault
    restart: unless-stopped
    command: server
    cap_add:
      # Lets Vault lock memory so secrets cannot be swapped to disk.
      # disable_mlock is also set, because the file backend in a container
      # cannot always rely on it — belt and braces, and neither is load-bearing
      # on a single-host deployment.
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - vault-data:/vault/file
      - ./vault/config.hcl:/vault/config/config.hcl:ro
    ports:
      # Loopback only. Concourse reaches it over the compose network by service
      # name; this publish exists so `vault` on THIS host can be used as a
      # personal secret store. It is deliberately not on 0.0.0.0 — unlike MinIO
      # and the registry, nothing inside a garden task needs to reach Vault.
      - "127.0.0.1:8200:8200"
    networks: [concourse]
    healthcheck:
      # sealedcode=200 and uninitcode=200: a sealed or uninitialised Vault is
      # STARTED, just not usable yet. Reporting it unhealthy would make compose
      # restart it forever and make a normal post-reboot state look like a
      # crash loop.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200"]
      interval: 15s
      timeout: 5s
      retries: 10
  # ── web ────────────────────────────────────────────────────────────────
  # No longer `quickstart`, which fuses web and worker into one container.
  # One worker meant one queue: `serial_groups` on the heavy jobs plus a
  # single container to run them in, so a Mykronos scan pass (17 jobs off one
  # commit) starved TheHub for hours - 11 builds pending, 0 started, and
  # resource *checks* stuck behind them, which reads as "the pipeline is
  # broken" rather than "the pipeline is queued". The header always said this
  # split was a compose change rather than a redesign; this is that change.
  #
  # Not privileged any more. Only a worker needs that, and this container no
  # longer contains one - which is a §7 improvement rather than a side effect,
  # since the web node is the half that faces the tunnel.
  # Still called `concourse` rather than `concourse-web`, which would read
  # better: renaming the service orphans the running container, and an orphan
  # keeps both the `mykronos-concourse` name and port 8080, so the replacement
  # cannot start. Keeping the name means compose recreates this one in place.
  # `command: web` says what it is.
  concourse:
    image: concourse/concourse:7.14
    container_name: mykronos-concourse
    restart: unless-stopped
    command: web
    depends_on:
      concourse-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CONCOURSE_POSTGRES_HOST: concourse-db
      CONCOURSE_POSTGRES_USER: concourse
      CONCOURSE_POSTGRES_PASSWORD: ${CONCOURSE_POSTGRES_PASSWORD:?set it in .env}
      CONCOURSE_POSTGRES_DATABASE: concourse

      CONCOURSE_EXTERNAL_URL: ${CONCOURSE_EXTERNAL_URL:-http://localhost:8080}

      CONCOURSE_ADD_LOCAL_USER: ${CONCOURSE_LOCAL_USER:?set it in .env}:${CONCOURSE_LOCAL_PASSWORD:?set it in .env}
      CONCOURSE_MAIN_TEAM_LOCAL_USER: ${CONCOURSE_LOCAL_USER}

      # Spreads builds across the workers below rather than filling one.
      CONCOURSE_CONTAINER_PLACEMENT_STRATEGY: fewest-build-containers

      # Persistent keys, generated once by setup.ps1 into ./keys.
      #
      # `quickstart` generates these fresh on every start when they are not
      # supplied, and the session signing key is what browser cookies are
      # signed with -- so every `docker compose up -d` that recreated this
      # container invalidated every session and produced "invalid state
      # token" at the login screen. Five recreates while fixing DNS and the
      # healthcheck made that look like a broken login rather than a restart.
      CONCOURSE_SESSION_SIGNING_KEY: /keys/session_signing_key

      # All three keys are pinned now, where before only the signing key was.
      # That earlier note said supplying the TSA and worker keys left the
      # worker unable to connect ("remote host public key mismatch"), and it
      # was right about quickstart: quickstart runs that handshake between two
      # processes in one container and manages the keys itself, so a
      # half-supplied set fought with a half-generated one.
      #
      # The workers are separate containers now, so the handshake is a real
      # one over the compose network and both ends have to agree on keys that
      # outlive a restart. Ephemeral keys cannot do that: the web node would
      # generate a new host key on every recreate and every worker would
      # refuse it. setup.ps1 already generated the full consistent set into
      # ./keys, which is gitignored.
      CONCOURSE_TSA_HOST_KEY: /keys/tsa_host_key
      CONCOURSE_TSA_AUTHORIZED_KEYS: /keys/authorized_worker_keys

      # ── Credential manager (Vault) ─────────────────────────────────────
      # Lookup order for ((foo)) is:
      #   /concourse/<team>/<pipeline>/foo   then   /concourse/<team>/foo
      # so team-wide credentials live one level up and pipeline-specific ones
      # sit beside the pipeline.
      #
      # KV version 1 is mounted at concourse/ on purpose. KV v2 inserts a
      # `data/` segment into the API path and wraps values in a metadata
      # envelope; v1 is a flat read and is what Concourse's lookup templates
      # expect without further configuration. The personal/ mount is v2,
      # because there versioning is the point.
      CONCOURSE_VAULT_URL: http://vault:8200
      CONCOURSE_VAULT_PATH_PREFIX: /concourse
      CONCOURSE_VAULT_CLIENT_TOKEN: ${CONCOURSE_VAULT_TOKEN:?set it in .env - see vault-init}

      CONCOURSE_LOG_LEVEL: info
    volumes:
      # The whole directory now, read-only: the web node needs three keys from
      # it rather than one file.
      - ./keys:/keys:ro
    networks: [concourse]
    healthcheck:
      # bash's /dev/tcp, because this image ships neither curl nor wget. The
      # first attempt used curl and reported the container unhealthy for
      # eleven minutes while the API answered fine from the host: a
      # healthcheck that cannot run looks exactly like a service that is down,
      # and the wrong one of those is far more alarming.
      #
      # This proves the web process is accepting connections, not that it is
      # serving correctly. That is the honest limit of what the tools present
      # allow, and it catches the failure that actually happens here - the
      # container starting before Postgres is ready.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  concourse-worker-1:
    <<: *worker
    container_name: mykronos-concourse-worker-1
    environment:
      <<: *worker-env
      CONCOURSE_NAME: worker-1
      CONCOURSE_TSA_WORKER_PRIVATE_KEY: /keys/worker_key
    volumes:
      # Keeps the existing volume, so the image and resource caches this
      # worker has already built up survive the split.
      - concourse-worker-data:/worker-state
      - ./keys:/keys:ro

  concourse-worker-2:
    <<: *worker
    container_name: mykronos-concourse-worker-2
    environment:
      <<: *worker-env
      CONCOURSE_NAME: worker-2
      # Its own key rather than a copy of worker-1's. They share a host and a
      # trust boundary, so this buys little today; it costs two lines and
      # means one worker can be revoked without locking the other out.
      CONCOURSE_TSA_WORKER_PRIVATE_KEY: /keys/worker2_key
    volumes:
      - concourse-worker-2-data:/worker-state
      - ./keys:/keys:ro

volumes:
  vault-data:
  registry-data:
  concourse-db-data:
  concourse-worker-data:
  concourse-worker-2-data:
  minio-data:

networks:
  concourse:
    driver: bridge
