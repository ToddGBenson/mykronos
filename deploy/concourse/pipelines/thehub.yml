# TheHub delivery pipeline (spec 16).
#
# Was scanning only. It now takes a commit all the way to production:
#
#   quality + build -> static security -> demo -> DAST -> Oracle -> insider
#     -> [a person] -> prod
#
# Oracle sits after DAST so runtime findings reach the score it gates on;
# insider risk sits after Oracle, as the last check before a human promotes.
# Spec 16 section 3 sets out what that ordering buys and what it costs -- the
# cost being that insider risk is no longer an input to Oracle's score.
#
# Three things about this file are worth knowing before reading it.
#
# **Build happens before the Oracle gate, and spec 15 section 3 says otherwise.**
# You cannot scan an image you have not built, and the previous `containers`
# lane proved the alternative: it read Dockerfiles as configuration and
# reported no base-image CVEs at all, while looking exactly like container
# scanning on the dashboard. The image is tagged with the commit SHA and
# nothing else, and only the deploy jobs ever name a tag - so an image built
# from a commit Oracle refuses sits in the registry unreferenced. The gate
# protects the deploy, which is the step that matters. Spec 16 section 3.
#
# **The prod job has no `trigger: true`, and that is the manual confirmation.**
# There is no other mechanism and none is needed: Concourse will not start a
# job whose inputs are not set to trigger it, so production changes when
# somebody clicks the plus and not before.
#
# **Deploy is a pointer the host pulls, not a connection Concourse makes.**
# Spec 15 section 7 and D-038 both refuse a Docker socket - it would let every
# task in every pipeline drive the host's daemon. Spec 16 section 7 answered
# that with a forced-command SSH key per environment, which is sound but needs
# sshd listening on a machine sitting inside the LAN.
#
# This does the same job with no listener at all. The deploy jobs write a
# commit SHA to `<env>.requested` in MinIO; a Scheduled Task on the host polls
# it, pulls that image by SHA from the registry, deploys it, and writes back
# `<env>.deployed`. Concourse then waits for its own SHA to come back before
# reporting success, so `passed: [deploy-demo]` still means demo is serving
# this commit rather than that a request was filed for it.
#
# It is the same one-way handoff the registry already gives us, applied to the
# instruction as well as the artifact: nothing Concourse can do restarts a
# service, and the host opens no port to be told to.
#
# What this gives up is worth stating plainly. With sshd, the demo key
# physically could not deploy to production - authorized_keys pinned the
# command and sshd enforced it against the key that authenticated. Here the
# separation is by object name: the poller deploys `demo.requested` to demo
# and `prod.requested` to prod and cannot confuse them, but anything holding
# the MinIO credentials can write either pointer. That moves the boundary from
# sshd to the credential, which is weaker, and it is the price of having no
# listener. The manual-only prod job still governs what Concourse writes.
#
# Nothing sensitive appears here. `((var))` resolves through
# `fly set-pipeline --load-vars-from`, written and deleted by
# set-thehub-pipeline.ps1.
#
# The git credential is a GitHub App installation token and expires after an
# hour (CNC-2). Re-run set-thehub-pipeline.ps1 to refresh it.

# The UI, grouped by the delivery stages the header describes. Twenty jobs on
# one flat wall is not a pipeline anybody reads, and this one runs all the way
# to production - which stage a job belongs to is the first thing a person
# needs from it. Jobs appear in more than one group where they genuinely belong
# to both.
#
# Every job is in at least one group on purpose: Concourse hides any job that
# is in none, and a hidden lane is a lane nobody notices has gone red.
groups:
  - name: quality
    jobs: [unit, qa, prompt-evals]
  - name: security
    jobs: [secrets, sast, dependencies, iac, containers, ai-models, insider, cloud-posture, dast-staging]
  - name: build
    jobs: [build, containers]
  - name: demo
    jobs: [deploy-demo, api-inventory, dast-demo, functional-dast]
  - name: gate
    jobs: [oracle-gate, insider]
  - name: prod
    jobs: [deploy-prod, dast-prod]
  - name: remediation
    jobs: [remediate]

resource_types:
  - name: registry-image
    type: registry-image
    source: { repository: concourse/registry-image-resource, tag: "1.10" }

resources:
  - name: source
    type: git
    icon: github
    source:
      # A read-only deploy key, not the GitHub App token. The App token lives
      # one hour, and this worker's serial queue routinely runs deeper than
      # that -- five builds in one afternoon died fetching with a token that
      # had expired while they waited their turn. An SSH deploy key does not
      # expire, and it is the narrower credential: fetch-only, this repository
      # only, no API surface. The App token remains for the one task that
      # calls the GitHub API (GITHUB_TOKEN below), which is what it is for.
      #
      # The key itself is in Vault (concourse/main/thehub/source-deploy-key),
      # so it never appears in `fly get-pipeline` output.
      uri: git@github.com:ToddGBenson/TheHub.git
      branch: ((thehub-branch))
      private_key: ((source-deploy-key))

  - name: python
    type: registry-image
    icon: language-python
    # 3.14 to match TheHub's own backend/Dockerfile. The lane ran 3.13 against
    # a 3.14 codebase, which is one more variable than a test lane should have.
    source: { repository: python, tag: "3.14-slim" }

  # Scans the image out of the registry directly. No daemon, no privileged
  # task, and no `curl get.docker.com` in a task that never started dockerd -
  # which is what the previous containers lane did, and why it always wrote its
  # empty-SARIF fallback.
  # Semgrep does not run on 3.14 -- it dies at import with "Metaclasses with
  # custom tp_new are not supported", which is a CPython 3.14 change one of its
  # dependencies has not caught up with. The `python` resource above is 3.14 on
  # purpose, to match TheHub's own backend/Dockerfile for the unit lane; that is
  # right for running TheHub's code and irrelevant to a scanner that only reads
  # it. So the SAST lane gets the interpreter semgrep actually works on, which
  # is the same 3.13 the mykronos pipeline's passing sast lane uses.
  - name: python313
    type: registry-image
    icon: language-python
    source: { repository: python, tag: "3.13-slim" }

  - name: checkov
    type: registry-image
    icon: file-cog-outline
    source: { repository: bridgecrew/checkov, tag: "3.2.334" }

  # An SBOM outlives the build that made it. Concourse prunes build logs, and
  # the question an SBOM answers -- "did we ship that library" -- is asked
  # long after the build that could have answered it is gone (spec 07 SS7).
  - name: sbom
    type: s3
    icon: file-document-outline
    source:
      endpoint: ((minio-endpoint))
      bucket: thehub-sboms
      regexp: sbom-(.*).cdx.json
      access_key_id: ((minio-access-key))
      secret_access_key: ((minio-secret-key))

  - name: trivy
    type: registry-image
    icon: shield-search
    source: { repository: aquasec/trivy, tag: "0.58.1" }

  - name: zap
    type: registry-image
    icon: spider
    source: { repository: ghcr.io/zaproxy/zaproxy, tag: "2.16.1" }

  - name: playwright
    type: registry-image
    icon: test-tube
    source: { repository: mcr.microsoft.com/playwright, tag: "v1.62.1-noble" }

  - name: prowler
    type: registry-image
    icon: cloud-search-outline
    source: { repository: toniblyx/prowler, tag: ((prowler-version)) }

  - name: kaniko
    type: registry-image
    icon: hammer-wrench
    source: { repository: gcr.io/kaniko-project/executor, tag: v1.23.2-debug }

  # Cloud posture is about the subscription, not the commit. A push does not
  # change an Azure storage account's public-access setting, and scanning on
  # every push would produce one identical finding set per commit - noise in
  # the lake and a rate limit against Resource Manager for nothing.
  - name: daily
    type: time
    icon: clock-outline
    source:
      location: ((scan-timezone))
      start: "2:00 AM"
      stop: "3:00 AM"

anchors:
  # Reporting credentials. Deliberately does *not* include the deploy keys or
  # the Azure principal: spec 15 section 6 asks for deploy credentials scoped
  # to the deploy job, and an anchor every job pulls in is the opposite of
  # that. Jobs that need more write their params out in full rather than
  # merging onto this - a YAML merge key is one typo away from handing the
  # test job the production key.
  mykronos_env: &mykronos_env
    MYKRONOS_URL: ((mykronos-url))
    MYKRONOS_TOKEN: ((thehub-ingestion-token))
    MYKRONOS_REF: ((mykronos-ref))
    # The git resource checks out a detached HEAD, so
    # `git rev-parse --abbrev-ref HEAD` returns the literal string HEAD and
    # every scan run recorded that as its branch. The branch is known when this
    # file is rendered; asking git for what it cannot know was the mistake.
    SCANNED_BRANCH: ((thehub-branch))

  # -- PS-2: fail before scanning, not after (spec 04 SS2, spec 05 SS4) ----
  #
  # The GitHub Actions skeleton every onboarded repository gets
  # (`workflow-templates/_base.yml.j2`) probes the ingestion API before it runs
  # a scanner: better to stop in ten seconds than scan for twenty minutes and
  # find at upload time that the results have nowhere to go. Not one Concourse
  # job did this, and this is the pipeline where it costs most - `unit` is
  # capped at sixty minutes and `functional-dast` at a hundred and twenty.
  #
  # A failure here is a real failure, not a skip. A scan whose results cannot
  # land is the `never_reported` state the coverage cross-check exists to catch
  # (spec 15 SS4a.1), and producing one deliberately is worse than not starting.
  preflight: &preflight
    task: preflight
    timeout: 2m
    params: *mykronos_env
    config:
      platform: linux
      # curlimages/curl rather than the `python` resource: python:3.14-slim
      # ships no curl, so a probe on that image would have to apt-get first and
      # would cost more than the scan it protects. This image is already on the
      # worker for the notifier, and it needs no checkout, no pip and no git.
      image_resource:
        type: registry-image
        source: { repository: curlimages/curl, tag: "8.11.1" }
      run:
        path: sh
        args:
          - -ec
          - |
            curl --fail --silent --show-error --max-time 20 \
              -H "Authorization: Bearer $MYKRONOS_TOKEN" \
              "$MYKRONOS_URL/api/ingest/health" > /dev/null
            echo "Mykronos is reachable and this token is accepted."

  # -- Reporting back into TheHub (spec 16 section 13) --------------------
  #
  # TheHub is not just a repository this pipeline scans; it runs a DevSecOps
  # and story-lifecycle subsystem of its own, and that subsystem advances
  # stories from evidence rather than from anybody clicking a button.
  # `services/devops/lifecycle.py` reads `deploy_runs` and `deploy_history`:
  # a green `integration_tests` stage moves a story in_progress -> tested, and
  # a successful `finish` stage moves it tested -> deployed.
  #
  # Those tables were written by TheHub's own scripts/deploy.sh and by its
  # GitHub Actions. Moving delivery here does not break them - deploy.sh still
  # runs - it does something quieter and worse: Concourse becomes the thing
  # that actually ships TheHub while its lifecycle keeps advancing stories on
  # evidence from a different pipeline. The two would drift with nothing
  # reporting that they had.
  #
  # So every stage reports. `POST /api/ops/deploys` is the endpoint deploy.sh
  # already uses, with the same shared-secret header, so nothing in TheHub
  # needs changing to receive this.
  #
  # `deploy_id` is the commit SHA rather than a build number: TheHub keys a
  # deploy_run on it, and every job in this pipeline is working on the same
  # commit, so all of their stages land under one run. A build number would
  # scatter one commit's stages across seven unrelated runs.
  #
  # The commit *message* is not decoration either - the lifecycle matches
  # stories by regexing the story id out of it, so a report without it
  # advances nothing.
  #
  # Never fails the build. A lifecycle that did not hear about a deploy is a
  # reporting problem; failing the deploy over it would turn it into an outage.
  # The constant half of a report. STAGE, STATUS and TARGET_ENV vary per use
  # and are merged onto this at each call site, the same way `mykronos_env` is
  # merged into a task's params. Without this every one of the eighty-odd hooks
  # below would restate three credentials.
  hub_params: &hub_params
    HUB_URL: ((thehub-url))
    HUB_DEPLOY_TOKEN: ((hub-deploy-token))
    SCANNED_BRANCH: ((thehub-branch))

  hub_report: &hub_report
    task: report-to-hub
    # PS-7. A hook that hangs holds the single worker exactly as a scan does,
    # and this one is one curl. Five minutes is a ceiling, not a budget.
    timeout: 5m
    config:
      platform: linux
      # Self-contained rather than `image: python`, and `source` optional
      # rather than required. Both exist because this runs as a JOB-LEVEL HOOK
      # now, not as a plan step: a job that dies before `get: python` has no
      # python image to run a task on, and one that dies before `get: source`
      # has no source to mount. A hook that cannot start reports nothing, which
      # is the exact failure this task was moved to hooks to fix.
      image_resource:
        type: registry-image
        source: { repository: python, tag: "3.14-slim" }
      inputs: [{ name: source, optional: true }]
      run:
        path: bash
        args:
          - -c
          - |
            set -uo pipefail
            if [ -z "${HUB_URL:-}" ] || [ -z "${HUB_DEPLOY_TOKEN:-}" ]; then
              echo "TheHub reporting is not configured; skipping."
              exit 0
            fi
            apt-get update -qq && apt-get install -y -qq curl jq git >/dev/null 2>&1

            # Guarded, because the early failures are the ones worth reporting
            # and they are exactly the ones with no `source` on disk. An
            # unguarded rev-parse here drops the report for every job that died
            # before its checkout landed.
            SHA=$(git -C source rev-parse HEAD 2>/dev/null || echo unknown)
            MSG=$(git -C source log -1 --pretty=%s 2>/dev/null || echo unknown)

            BODY=$(jq -nc \
              --arg d "$SHA" --arg s "$STAGE" --arg st "$STATUS" \
              --arg sha "$SHA" --arg br "$SCANNED_BRANCH" --arg msg "$MSG" \
              --arg env "${TARGET_ENV:-prod}" \
              '{deploy_id: $d, stage: $s, status: $st, git_sha: $sha,
                git_branch: $br, commit_message: $msg, actor: "concourse",
                target_env: $env,
                meta: {source: "concourse", pipeline: "thehub"}}')

            curl -sS --fail --max-time 20 -X POST \
              -H "Content-Type: application/json" \
              -H "X-Ops-Deploy-Token: $HUB_DEPLOY_TOKEN" \
              -d "$BODY" "$HUB_URL/api/ops/deploys" >/dev/null \
              && echo "Reported $STAGE=$STATUS for $SHA to TheHub." \
              || echo "Could not report $STAGE to TheHub; the build result stands."
            exit 0

  # Failure notification. curl rather than a slack-notification resource type:
  # this pipeline already carries no third-party resource types, and adding
  # one to a security pipeline to send a chat message is a poor trade. It also
  # keeps the payload under this file's control, which the insider job depends
  # on - see the note there about what must never be sent.
  #
  # `notify` is an *optional* input. A job that knows more than "it failed"
  # writes a single line to notify/message.txt and that is used verbatim;
  # every other job falls back to its own name. That is what keeps one
  # notification per event instead of a specific one racing a generic one.
  slack_alert: &slack_alert
    task: notify-slack
    # PS-7. A notifier that hangs turns one failed job into a held worker,
    # inside the hook that exists to report the first failure.
    timeout: 5m
    config:
      platform: linux
      image_resource:
        type: registry-image
        source: { repository: curlimages/curl, tag: "8.11.1" }
      inputs:
        - name: notify
          optional: true
      params:
        SLACK_BOT_TOKEN: ((slack-bot-token))
        SLACK_CHANNEL: ((slack-alert-channel))
      run:
        path: sh
        args:
          - -ec
          - |
            # chat.postMessage with TheHub's bot token, not an incoming
            # webhook. A webhook is bound to whichever channel it was created
            # for, so borrowing TheHub's would interleave pipeline alerts with
            # the messages its app posts to users. This names the channel
            # explicitly, and it authenticates with a header - which the Vault
            # credential manager can substitute at egress, where a webhook's
            # secret sits in the URL path and cannot be.
            #
            # Unset is not an error. The pipeline has to be applicable before
            # Slack is configured, and this hook only ever runs when something
            # has already gone wrong - a missing notification must not become
            # a second failure on top of it.
            if [ -z "${SLACK_BOT_TOKEN:-}" ] || [ -z "${SLACK_CHANNEL:-}" ]; then
              echo "No Slack bot token or channel configured - skipping notification."
              exit 0
            fi

            BUILD_URL="$ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME/builds/$BUILD_NAME"

            if [ -s notify/message.txt ]; then
              TEXT=$(head -1 notify/message.txt)
            else
              TEXT="*TheHub*: job \`$BUILD_JOB_NAME\` failed (build $BUILD_NAME)"
            fi

            # Escaped with sed because this image has no jq. Single-line
            # messages by construction, so backslash and quote are the only
            # characters that can break the document.
            ESCAPED=$(printf '%s' "$TEXT" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')

            # /tmp, not the working directory. curlimages/curl runs as an
            # unprivileged user and Concourse creates the task's working
            # directory owned by root, so `> payload.json` is
            # "Permission denied" and the notify task dies before it reaches
            # curl. This predates the switch to chat.postMessage - the webhook
            # version wrote to the same place - so no alert from this anchor
            # has ever been delivered. It failed inside an on_failure hook,
            # where the only symptom is a red job that was already red.
            printf '{"channel":"%s","text":"%s\\n%s"}' \
              "$SLACK_CHANNEL" "$ESCAPED" "$BUILD_URL" > /tmp/payload.json

            RESP=$(curl -sS --max-time 20 -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H 'Content-Type: application/json; charset=utf-8' \
              -d @/tmp/payload.json) || RESP=""

            # Slack answers 200 with {"ok":false,"error":"..."} when a post is
            # rejected - a wrong channel, a bot that was removed, a revoked
            # scope. The status code proves nothing here; the body is the
            # result, and without this check a silently undelivered alert
            # reads exactly like a delivered one.
            case "$RESP" in
              *'"ok":true'*) echo "Posted to Slack." ;;
              *) echo "Slack post failed: $RESP" ;;
            esac
            exit 0

jobs:
  # Every build and scan job below shares one `serial_groups: [worker]`, so at
  # most one of them runs at a time.
  #
  # This is not tidiness. Seven jobs trigger on the same commit and each one
  # apt-gets and pip-installs before it does any work; run together on a single
  # worker that also hosts TheHub's live stack, they took the box to 1.1 GB
  # free and the kernel killed the Concourse container itself - `Exited (137)`,
  # which is an OOM kill, not a crash. The scheduler dying is a worse outcome
  # than any scan being slow, and it takes every other pipeline with it.
  #
  # The cost is wall-clock: the fan-out is now a queue, and a full run is the
  # sum of its lanes rather than the longest one. On one worker that was always
  # closer to the truth than the diagram suggested.
  # == Stage 1: quality =====================================================

  - name: unit
    public: true
    serial_groups: [worker]
    on_success:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: integration_tests, STATUS: success, TARGET_ENV: prod }
    on_failure:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: integration_tests, STATUS: failed, TARGET_ENV: prod }
    on_error:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: integration_tests, STATUS: errored, TARGET_ENV: prod }
    on_abort:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: integration_tests, STATUS: aborted, TARGET_ENV: prod }
    plan:
      - get: source
        trigger: true
      - get: python
      - *preflight
      - task: pytest
        image: python
        # 45 minutes was not a slow test suite; it was a full reinstall of
        # TheHub's dependency set on every run, from PyPI, with nothing kept
        # between builds. The cache is a worker-local volume Concourse mounts
        # back into this task each time, so the second run downloads only what
        # changed. First run after a requirements change is still slow, which
        # is the honest cost of a changed dependency rather than a fixed tax on
        # every commit.
        params:
          <<: *mykronos_env
          PIP_CACHE_DIR: /pipcache
        # A build that hangs must fail rather than occupy a worker. One ran for
        # 47 minutes and was still going when it was killed by hand; nothing in
        # the pipeline would ever have stopped it, and `unit` gates build,
        # containers, Oracle and both deploys.
        #
        # 40m rather than the 25m this started at, and the number came from
        # measurement: at 25m the first run died inside `pip install -r
        # backend/requirements.txt` with a cold cache. TheHub's dependency set
        # is genuinely large, so a cold install is slow once and warm installs
        # are minutes. A cap that kills the run which populates the cache never
        # lets the cache exist.
        #
        # 60m now, for the same reason one more time. The kernel OOM-killed
        # the Concourse container and the restart swept the worker's volumes,
        # including /pipcache - so the next run was cold again and died at 40m,
        # having spent almost all of it installing. The measurement that
        # settles the number: unit/24 ran 3173 tests in 187 seconds. Three
        # minutes of that half-hour is testing; the rest is pip. The cap has to
        # cover a cold install or the cache can never come back, and every run
        # after it is minutes.
        #
        # [#55173] 60m -> 90m. Measured over 71 runs longer than five minutes:
        # mean 21.7, p95 52.1, max 66.2 minutes. The old 60m cap sat BELOW the
        # observed maximum, so the slow tail was a coin flip, and build #75
        # lost three real failures to it. 90m is p95 x 1.7 and clears the max.
        # There is also a 70m soft timeout inside the task -- see the pytest
        # step -- so a slow run reports rather than being killed silently.
        timeout: 90m
        config:
          platform: linux
          inputs: [{ name: source }]
          caches: [{ path: /pipcache }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -euo pipefail
                cd source

                # L0001's three states, applied to a test suite. A repository
                # with no tests is not a repository whose tests pass, and this
                # job must not be the thing that says otherwise - but it must
                # not be permanently red either, because a red lane gets
                # paused and then nothing runs at all.
                if [ ! -d backend/tests/unit ] && [ ! -d tests ] && [ ! -d test ]; then
                  echo "=================================================="
                  echo "NO TEST SUITE FOUND."
                  echo "There is no tests/ or test/ directory in this"
                  echo "repository. This job did not run any tests and this"
                  echo "green tick is NOT a passing test run."
                  echo "=================================================="
                  exit 0
                fi

                apt-get update -qq && apt-get install -y -qq git build-essential >/dev/null

                # Searched one level down as well as at the root. TheHub keeps
                # its dependencies in backend/requirements.txt and its tests in
                # backend/tests, and the first version of this job looked only
                # at the root -- so it installed nothing, then failed on
                # `ModuleNotFoundError: No module named 'faker'` and read like
                # a broken test suite rather than a job that never installed
                # anything.
                #
                # An install failure is a real failure: it means the declared
                # dependencies do not resolve, which the pipeline should say
                # out loud rather than skip past on its way to a green tick.
                FOUND=0
                for req in requirements.txt requirements-dev.txt \
                           */requirements.txt */requirements-dev.txt; do
                  [ -f "$req" ] || continue
                  echo "Installing $req"
                  pip install --quiet -r "$req"
                  FOUND=1
                done

                if [ "$FOUND" -eq 0 ]; then
                  echo "=================================================="
                  echo "NO REQUIREMENTS FILE FOUND."
                  echo "There is a test directory but nothing declaring what"
                  echo "it needs, so pytest is about to run against a bare"
                  echo "interpreter. Whatever it reports is about this job,"
                  echo "not about the code."
                  echo "=================================================="
                fi

                pip install --quiet pytest

                # -- A real Postgres, because that is what these tests need --
                #
                # Running tests/unit against the SQLite fallback produced 258
                # failures and 113 errors out of ~3100, and TheHub's own
                # conftest predicts every one of them: it says the fallback
                # creates "only tables that are compatible with SQLite" and
                # that "some PostgreSQL-specific features won't work". The
                # failures were `no such table: dev_epics`, `near "'7 days'":
                # syntax error` and `unrecognized token: ":"` -- missing
                # schema, INTERVAL literals and :: casts. Postgres SQL, run on
                # SQLite.
                #
                # So the directory name is a poor guide and the `unit` marker
                # is no better: pytest.ini declares it and not one test file
                # uses it. About a third of tests/unit touches a database.
                #
                # Postgres runs inside this task rather than beside it because
                # a Concourse task is one container, and spec 15 section 7
                # refuses the Docker socket that would let it start a second.
                # pgvector is not optional -- library_items.embedding is a
                # Vector(1536), so `create_all` fails with `type "vector" does
                # not exist` without it.
                # Version detected rather than pinned. TheHub's compose runs
                # pgvector/pgvector:pg16, but this base is Debian trixie, whose
                # default is 17 -- so `postgresql-16` installs nothing and the
                # pgvector package name has to follow whatever landed. Checked
                # against the real image rather than assumed.
                echo "Installing PostgreSQL with pgvector..."
                apt-get install -y -qq postgresql postgresql-contrib >/dev/null 2>&1
                PGVER=$(ls /usr/lib/postgresql 2>/dev/null | head -1)
                if [ -z "$PGVER" ]; then
                  echo "::error::PostgreSQL did not install; these tests need it."
                  exit 1
                fi
                apt-get install -y -qq "postgresql-${PGVER}-pgvector" >/dev/null 2>&1                   || echo "note: pgvector unavailable - vector-typed models will not build"

                service postgresql start >/dev/null 2>&1                   || pg_ctlcluster "$PGVER" main start || true

                # Readiness, not a sleep: the tests fail in a confusing way if
                # they start before the socket is listening.
                for _ in $(seq 1 30); do
                  su postgres -c "pg_isready -q" && break
                  sleep 1
                done
                su postgres -c "pg_isready" || {
                  echo "::error::PostgreSQL did not start. These tests need it;"
                  echo "          running them without it reports TheHub's code"
                  echo "          as broken when it is this task that is."
                  exit 1
                }

                su postgres -c "psql -q -c \"ALTER USER postgres PASSWORD 'test'\"" >/dev/null
                su postgres -c "psql -q -c 'CREATE DATABASE thehub_test'" >/dev/null
                # The extensions create_all depends on, before it runs.
                for ext in vector pgcrypto "uuid-ossp"; do
                  su postgres -c "psql -q -d thehub_test -c 'CREATE EXTENSION IF NOT EXISTS \"$ext\"'"                     >/dev/null 2>&1 || echo "note: extension $ext unavailable"
                done

                # -- Native enum types, which create_all cannot make --------
                #
                # 391 of the 433 errors on the first Postgres run were one
                # line: `type "meal_type_enum" does not exist`. TheHub declares
                # four enums as real Postgres types in its SQL migrations, and
                # the models reference them without defining them, so
                # `Base.metadata.create_all` emits a column of a type nothing
                # created.
                #
                # Replayed from db/migrations rather than transcribed here.
                # There are only four today and typing them into this file
                # would work exactly until somebody adds a fifth, at which
                # point the lane fails with a message about a type nobody
                # changed. Reading them from the migrations means the pipeline
                # follows the schema instead of tracking it.
                #
                # Only CREATE TYPE ... AS ENUM is replayed, not the migrations
                # themselves: those are ordered, cumulative and assume a live
                # database, and running 277 of them here would be a migration
                # test wearing a unit test's name.
                echo "Creating native enum types from db/migrations..."
                python - <<'ENUMS'
                import glob, re, subprocess
                pattern = re.compile(
                    r"CREATE\s+TYPE\s+(\w+)\s+AS\s+ENUM\s*\(([^)]*)\)",
                    re.IGNORECASE | re.DOTALL,
                )
                seen = {}
                # Searched from the repository root, not from backend/. This
                # runs before the `cd backend` further down, and the first
                # version globbed "db/migrations/*.sql" against the checkout
                # root -- where TheHub keeps no such directory. It matched
                # nothing, created nothing, and the count guard below caught it
                # in six minutes instead of twenty-three.
                paths = sorted(glob.glob("**/db/migrations/*.sql", recursive=True))
                if not paths:
                    print("  no db/migrations/*.sql found anywhere in the checkout")
                for path in paths:
                    with open(path, encoding="utf-8", errors="replace") as handle:
                        for name, values in pattern.findall(handle.read()):
                            seen.setdefault(name.lower(), " ".join(values.split()))
                print(f"  found {len(seen)} enum type(s): {', '.join(sorted(seen))}")
                for name, values in seen.items():
                    # Plain CREATE TYPE, and the statement goes to psql on
                    # stdin rather than through `-c` in a shell string.
                    #
                    # The obvious version wrapped a `DO $$ ... $$` block in
                    # double quotes for `su -c`, which the shell expands: `$$`
                    # is the PID. It would have created a type named after
                    # whatever process ran it, or more likely failed with a
                    # syntax error nobody would connect to quoting.
                    #
                    # No duplicate guard is needed because the database is
                    # created fresh in this task a few lines above; a failure
                    # here is tolerated (check=False) and reported by the count
                    # check that follows.
                    subprocess.run(
                        ["su", "postgres", "-c", "psql -q -d thehub_test"],
                        input=f"CREATE TYPE {name} AS ENUM ({values});",
                        text=True,
                        check=False,
                    )
                ENUMS

                MADE=$(su postgres -c "psql -tAq -d thehub_test -c \"SELECT count(*) FROM pg_type WHERE typtype = 'e'\"")
                echo "  created ${MADE} enum type(s) in thehub_test"
                if [ "${MADE:-0}" -eq 0 ]; then
                  echo "::error::No enum types were created. create_all will fail"
                  echo "          with 'type ... does not exist' on ~400 tests."
                  exit 1
                fi

                export DATABASE_URL="postgresql://postgres:test@localhost:5432/thehub_test"
                export TEST_DATABASE_URL="$DATABASE_URL"

                # -- Build the schema with TheHub's own initialiser ----------
                #
                # `tests/conftest.py` calls `Base.metadata.create_all`, but it
                # imports exactly two model modules -- threat_intelligence and
                # user. SQLAlchemy's metadata only holds what has been
                # imported, so create_all builds two tables and every test
                # touching anything else fails on `relation "..." does not
                # exist`. That is what the remaining 133 failures were.
                #
                # scripts/init_db.py exists precisely for this. It does
                # `import models`, whose package __init__ pulls in all 181
                # model modules, and its own comment spells out the trap:
                # "Without it, create_all() runs against an empty registry
                # (silent no-op)". Running TheHub's initialiser rather than
                # reimplementing it here also means the schema follows their
                # models without this file knowing anything about them.
                #
                # It runs after the enum replay because create_all emits
                # columns of those native types and cannot make them itself.
                cd backend
                echo "Building the full schema with scripts/init_db.py..."
                python scripts/init_db.py 2>&1 | tail -5

                # -- Then the migrations, for what the ORM does not own ----
                #
                # create_all builds every table SQLAlchemy knows about, and
                # TheHub has tables it does not: deploy_runs, epic_stage_history,
                # story_gate_history, agent_learning_ledger and friends are
                # created and written by raw SQL (api/ops.py inserts into
                # deploy_runs directly). No model, so no create_all, so 44
                # `relation "..." does not exist` failures.
                #
                # Order matters and was measured, not guessed. Replaying the
                # migrations into an *empty* database applies 32 of 277 and
                # produces 31 tables -- they are overwhelmingly ALTER TABLE
                # against a schema create_all is expected to have made. Run
                # after it, the ALTERs land and the CREATEs that create_all
                # could not cover fill the gaps.
                #
                # Most will still fail, and that is expected rather than
                # tolerated blindly: a migration whose CREATE TABLE already
                # exists is a no-op by another name. Each runs in its own psql
                # session so one failure cannot poison the next, and the counts
                # are printed so a sudden change in them is visible.
                echo "Replaying migrations for tables the ORM does not own..."
                applied=0; skipped=0
                for f in $(ls db/migrations/*.sql | sort -V); do
                  if su postgres -c "psql -q -v ON_ERROR_STOP=1 -d thehub_test -f $PWD/$f" >/dev/null 2>&1; then
                    applied=$((applied+1))
                  else
                    skipped=$((skipped+1))
                  fi
                done
                echo "  applied ${applied}, skipped ${skipped} (already-present objects)"

                # -- One user, because a third of these tests assume one ---
                #
                # Helpers like `_mk_story` do `db.query(User).first()` and then
                # `user.id`, so on a database with no users they raise
                # `AttributeError: 'NoneType' object has no attribute 'id'` --
                # 34 failures, none of them about the code under test.
                #
                # They pass in TheHub's own environment because `make test`
                # runs inside a container pointed at a database that has real
                # users in it. The tests are relying on ambient data rather
                # than a fixture, which is worth fixing in TheHub; until then
                # CI has to provide the environment they were written for
                # rather than pretend the difference is theirs.
                #
                # Deliberately one inert row: a fixed uuid, an unroutable
                # address and a password hash that is not a hash of anything.
                # It exists to be found by `.first()`, not to be logged in as.
                echo "Seeding the single user those tests expect to find..."
                su postgres -c "psql -q -d thehub_test" <<'SEED' || true
                INSERT INTO users (id, email, username, password_hash, is_active)
                VALUES ('00000000-0000-0000-0000-000000000001',
                        'ci@invalid.test', 'ci', 'x-not-a-hash', true)
                ON CONFLICT DO NOTHING;
                SEED

                # -- Mirror Python-side defaults into the database ---------
                #
                # 22 of the remaining failures were `null value in column
                # "tags" of relation "dev_stories"` and friends -- tags,
                # kpi_sketch, autonomy_disabled, cached, status.
                #
                # Each is declared `Column(..., nullable=False, default=X)`.
                # That default is applied by the ORM, not by the database, so
                # create_all emits NOT NULL with no DEFAULT and any raw-SQL
                # INSERT in the code under test fails. The real database does
                # not fail, because those columns arrived via `ALTER TABLE ADD
                # COLUMN ... DEFAULT`, and the migration replay above skips
                # exactly those statements: create_all already made the column.
                #
                # So the defaults are read back out of SQLAlchemy's own
                # metadata and applied, for columns that are NOT NULL, have a
                # scalar Python-side default and no server_default. Derived
                # rather than listed, for the same reason the enums are read
                # from db/migrations: a list typed here is right until somebody
                # adds a column.
                #
                # This is a CI accommodation, not a fix. The real correction is
                # `server_default=` alongside `default=` in TheHub's models, so
                # the model describes the schema it actually needs.
                echo "Mirroring model defaults onto NOT NULL columns..."
                python - <<'DEFAULTS'
                import subprocess
                import models  # noqa: F401 - populates the metadata
                from db.session import Base
                from sqlalchemy import DateTime

                def literal_for(d, col):
                    """SQL literal for a Python-side default, or None to skip.

                    bool is checked before int on purpose: in Python
                    ``False == 0`` and ``True == 1``, so a dict keyed on both
                    collapses to one entry and every boolean column would emit
                    ``SET DEFAULT 0`` -- which Postgres rejects for a boolean,
                    leaving the column with no default and the failure it was
                    meant to fix.
                    """
                    if d is list:
                        return "'[]'::jsonb"
                    if d is dict:
                        return "'{}'::jsonb"
                    if callable(d):
                        # A timestamp default is the one callable worth
                        # translating: `default=datetime.utcnow` and
                        # `func.now()` both mean "now" to the database, and
                        # raw-SQL inserts that omit started_at rely on it.
                        # Everything else callable is Python-side logic with no
                        # SQL equivalent, and guessing one would be worse than
                        # leaving the column without a default.
                        return "now()" if isinstance(col.type, DateTime) else None
                    if isinstance(d, bool):
                        return "true" if d else "false"
                    if isinstance(d, int) and not isinstance(d, bool):
                        return str(d)
                    if isinstance(d, str):
                        return "'" + d.replace("'", "''") + "'"
                    return None

                stmts = []
                for table in Base.metadata.tables.values():
                    for col in table.columns:
                        if col.nullable or col.server_default is not None:
                            continue
                        d = getattr(col.default, "arg", None)
                        if d is None:
                            continue
                        literal = literal_for(d, col)
                        if literal is None:
                            continue
                        stmts.append(
                            f"ALTER TABLE {table.name} "
                            f"ALTER COLUMN {col.name} SET DEFAULT {literal};"
                        )

                print(f"  {len(stmts)} column default(s) to mirror")
                if stmts:
                    subprocess.run(
                        ["su", "postgres", "-c", "psql -q -d thehub_test"],
                        input="\n".join(stmts), text=True, check=False,
                    )
                DEFAULTS

                USERS=$(su postgres -c "psql -tAq -d thehub_test -c 'SELECT count(*) FROM users'")
                echo "  users table has ${USERS} row(s)"

                TABLES=$(su postgres -c "psql -tAq -d thehub_test -c \"SELECT count(*) FROM information_schema.tables WHERE table_schema='public'\"")
                echo "  schema has ${TABLES} table(s)"
                if [ "${TABLES:-0}" -lt 50 ]; then
                  echo "::error::Only ${TABLES} tables were created. The model"
                  echo "          registry was not fully populated, and the"
                  echo "          failures that follow would be about missing"
                  echo "          tables rather than about TheHub's code."
                  exit 1
                fi
                cd ..
                echo "PostgreSQL ready; tests will use it rather than the SQLite fallback."

                # -- What this lane runs, and what it deliberately does not --
                #
                # `tests/unit` only, which is TheHub's own `make test-unit`.
                # Running the whole tree here produced several hundred errors
                # and failures in a row and then hit the timeout, and none of
                # it was about TheHub's code.
                #
                # TheHub's suite is written to run *inside its own container*:
                # `make test` and the integration runner in scripts/deploy.sh
                # both go through `docker-compose exec -T backend pytest`, so
                # the tests get Postgres, Redis, the app's environment and its
                # fixtures. This task is a bare python image with the
                # requirements pip-installed and none of those services -- and
                # spec 15 section 7 is why it cannot have them, since reaching
                # the host's daemon is the grant this whole design refuses.
                #
                # `tests/unit` is the part with no external dependencies, which
                # is what pytest.ini's own `unit` marker says it is. That makes
                # this lane's claim narrow and true rather than broad and
                # false.
                #
                # It is stated on every run because the gap matters: nothing
                # downstream should read a green `unit` as "TheHub's tests
                # pass". The integration suite still runs where it can, which
                # is deploy.sh on the host.
                echo "=================================================="
                # No backticks in this string: inside double quotes bash
                # would run `make test-unit` as a command substitution, in a
                # container with no make and no reason to.
                echo "Running tests/unit only - TheHub's own make test-unit."
                echo "tests/integration is NOT run here: it needs Postgres,"
                echo "Redis and the app environment, which live in TheHub's"
                echo "own container. A green tick on this job means the unit"
                echo "tests pass, not that the suite passes."
                echo "=================================================="

                cd backend

                # TheHub resolves its YAML config through HUB_CONFIG_DIR,
                # defaulting to /app/config -- the path inside its own
                # container. A checkout has no /app, so lifecycle_pipelines.yaml
                # and studio_stage_guide.yaml loaded as empty and the tests that
                # read them failed on the consequences rather than the cause:
                # `assert 0 == 19` canonical stages, `KeyError: 'dev_ready'`,
                # `Stage 'loop' missing gate_md in YAML`.
                #
                # The env var is the mechanism the code already provides for
                # this, so nothing in TheHub needs changing - it just has to be
                # told where the repository is.
                export HUB_CONFIG_DIR="$(cd .. && pwd)/config"
                echo "HUB_CONFIG_DIR=$HUB_CONFIG_DIR"
                test -f "$HUB_CONFIG_DIR/lifecycle_pipelines.yaml" || {
                  echo "::error::No lifecycle_pipelines.yaml under $HUB_CONFIG_DIR."
                  echo "          The stage tests would fail on empty config."
                  exit 1
                }

                # `-p no:cacheprovider` because the checkout is thrown away
                # after the build; writing .pytest_cache into it is pure IO.
                #
                # JUnit XML so the result reaches Mykronos as a ScanRun with no
                # findings (D-046) - this lane ran for months without reporting,
                # so the platform could not tell TheHub's tests passed from
                # TheHub's tests never ran. The exit code is recovered after
                # the upload: a failing suite must still report.
                mkdir -p /tmp/results

                # [#55173] A SOFT timeout below Concourse's hard one.
                #
                # Build #75 was killed by the 60m cap at 62 minutes having
                # already observed three failures. A hard kill takes the task
                # down before --junitxml is written, so the run produced no
                # verdict whatsoever - worse than a red build, because nobody
                # can tell a slow suite from a broken one.
                #
                # `timeout -s INT` sends SIGINT, which Python raises as
                # KeyboardInterrupt and pytest handles: it stops, tears down,
                # and WRITES THE REPORT for everything that finished. The
                # remaining 20 minutes before the hard cap are for the upload.
                SOFT_TIMEOUT_S=4200   # 70m
                rc=0
                started=$(date +%s)
                if command -v timeout >/dev/null 2>&1; then
                  timeout -s INT "${SOFT_TIMEOUT_S}s" \
                    python -m pytest tests/unit -q -p no:cacheprovider \
                    --junitxml=/tmp/results/unit.xml || rc=$?
                else
                  # Stated rather than silently skipped: without coreutils
                  # there is no soft timeout and the hard cap is all there is.
                  echo "::warning::the timeout command is unavailable - no soft timeout; a slow run will be killed without a verdict"
                  python -m pytest tests/unit -q -p no:cacheprovider \
                    --junitxml=/tmp/results/unit.xml || rc=$?
                fi
                elapsed=$(( $(date +%s) - started ))

                TIMED_OUT=false
                if [ "$elapsed" -ge "$SOFT_TIMEOUT_S" ]; then
                  TIMED_OUT=true
                  echo "=================================================="
                  echo "UNIT SUITE HIT THE ${SOFT_TIMEOUT_S}s SOFT TIMEOUT after ${elapsed}s."
                  echo "The results below are PARTIAL - they cover the tests"
                  echo "that finished, not the whole suite. A pass here is not"
                  echo "evidence the suite passes."
                  echo "=================================================="
                fi

                pip install --quiet "mykronos @ git+https://github.com/ToddGBenson/mykronos@${MYKRONOS_REF}#subdirectory=backend"
                python -c "import json,importlib.metadata as m;t=m.distribution('mykronos').read_text('direct_url.json');print('mykronos uploader @', json.loads(t).get('vcs_info',{}).get('commit_id','unknown')[:12] if t else '(local install)')" || echo "mykronos uploader @ (could not resolve)"
                python -m mykronos.upload \
                  --capability unit --tool junit \
                  --results-path /tmp/results \
                  --ingestion-url "$MYKRONOS_URL" --token "$MYKRONOS_TOKEN" \
                  --repo ToddGBenson/TheHub \
                  --commit-sha "$(git rev-parse HEAD)" \
                  --branch "$SCANNED_BRANCH" \
                  --workspace "$PWD" \
                  --severity-threshold low --blocking false || true

                # [#55173] 124 distinguishes "ran out of time" from "tests
                # failed". #75 reported neither: an errored build carries no
                # verdict, so three real failures read the same as a crash.
                # The junit above has already been uploaded either way.
                if [ "$TIMED_OUT" = true ]; then
                  echo "::error::unit suite exceeded its ${SOFT_TIMEOUT_S}s soft timeout - partial results uploaded"
                  exit 124
                fi
                exit "$rc"

  # == Stage 2: build =======================================================
  #
  # Tagged with the commit SHA and nothing else. No `latest`: a floating tag is
  # how an environment ends up running something nobody chose, and every deploy
  # job below names an exact SHA for that reason.
  # -- QA: the capability this pipeline offered and never produced --------
  #
  # PS-5. `qa` is one of the fifteen capabilities in the standard set, the
  # mykronos pipeline has produced it since D-046, and this pipeline had no
  # lane for it at all - so the coverage cross-check reported `no_job` for
  # TheHub: the repository believes it is covered, and no job disagrees,
  # because no job exists (spec 15 SS4a.1).
  #
  # `check_links.py` fetched by raw URL at the pinned ref, which is the idiom
  # `ai-models` already uses for `check_ai.py`: the checker lives in the
  # mykronos repository so both pipelines run byte-identical code, and it is
  # stdlib-only so this task installs nothing to run it. `check_pinned_ref.py`
  # asserts the file exists at the pin, so a stale pin surfaces as a red
  # `pin-check` rather than as a 404 inside this lane.
  #
  # One testcase per document, so "3 of 28 documents have a broken link" is a
  # fact about the documentation rather than a raw link count one bad file
  # could dominate.
  - name: qa
    public: true
    serial_groups: [worker]
    on_success:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: junit, STATUS: success, TARGET_ENV: prod }
    on_failure:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: junit, STATUS: failed, TARGET_ENV: prod }
    on_error:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: junit, STATUS: errored, TARGET_ENV: prod }
    on_abort:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: junit, STATUS: aborted, TARGET_ENV: prod }
    plan:
      - get: source
        trigger: true
        passed: [unit]
      - get: python
      - *preflight
      - task: check-links
        timeout: 45m
        image: python
        params: *mykronos_env
        config:
          platform: linux
          inputs: [{ name: source }]
          outputs: [{ name: results }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -uo pipefail
                apt-get update -qq && apt-get install -y -qq curl git >/dev/null
                cd source

                curl -sSfL -o /tmp/check_links.py \
                  "https://raw.githubusercontent.com/ToddGBenson/mykronos/${MYKRONOS_REF}/scripts/check_links.py"

                # PS-3: the checker's verdict is captured, never allowed to
                # skip the upload. "The links are broken" and "nothing told us
                # anything" are different facts and the second is worse.
                rc=0
                python /tmp/check_links.py . --junit-xml=../results/qa.xml || rc=$?

                pip install --quiet "mykronos @ git+https://github.com/ToddGBenson/mykronos@${MYKRONOS_REF}#subdirectory=backend"
                python -m mykronos.upload \
                  --capability qa --tool junit \
                  --results-path ../results \
                  --ingestion-url "$MYKRONOS_URL" --token "$MYKRONOS_TOKEN" \
                  --repo ToddGBenson/TheHub \
                  --commit-sha "$(git rev-parse HEAD)" \
                  --branch "$SCANNED_BRANCH" --workspace "$PWD" \
                  --severity-threshold low --blocking false || true

                exit "$rc"
  - name: build
    public: true
    serial_groups: [worker]
    on_success:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: package_artifact, STATUS: success, TARGET_ENV: prod }
    on_failure:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: package_artifact, STATUS: failed, TARGET_ENV: prod }
    on_error:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: package_artifact, STATUS: errored, TARGET_ENV: prod }
    on_abort:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: package_artifact, STATUS: aborted, TARGET_ENV: prod }
    plan:
      - get: source
        trigger: true
        passed: [unit]
      - get: python
      - get: kaniko

      # kaniko's image is busybox with no git, so the SHA is computed here and
      # handed over as a file.
      - task: resolve-sha
        timeout: 5m
        image: python
        config:
          platform: linux
          inputs: [{ name: source }]
          outputs: [{ name: meta }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -euo pipefail
                apt-get update -qq && apt-get install -y -qq git >/dev/null
                git -C source rev-parse HEAD | tr -d '\n' > meta/sha
                echo "Building $(cat meta/sha)"

      - task: kaniko
        timeout: 60m
        image: kaniko
        config:
          platform: linux
          inputs: [{ name: source }, { name: meta }]
          params:
            REGISTRY: ((registry))
          run:
            path: /busybox/sh
            args:
              - -ec
              - |
                SHA=$(cat meta/sha)
                # backend/, not the repository root. TheHub has no root Dockerfile:
                # docker-compose builds both backend and backend-staging with
                # context ./backend, dockerfile Dockerfile. Kaniko was pointed at a
                # path that never existed ("error resolving dockerfile path").
                #
                # The context matches compose's for the reason it matters there: the
                # Dockerfile COPYs relative to backend/, so a root context resolves
                # every path one level too high.
                #
                # Flags only between the continuations below. A comment line inside
                # a backslash-continued command is joined onto it, which is how the
                # second attempt commented out --destination and every flag after
                # it: "you must provide --destination, or use --no-push".
                /kaniko/executor \
                  --context source/backend \
                  --dockerfile source/backend/Dockerfile \
                  --destination "${REGISTRY}/thehub:${SHA}" \
                  --insecure --skip-tls-verify \
                  --single-snapshot

  # == Stage 3: security ====================================================
  #
  # All five report through `python -m mykronos.upload`, the same module the
  # composite action calls. `--workspace` is not optional: without it findings
  # record the worker's absolute paths, which are not clickable and, because
  # identity derives from the path, change every time the checkout moves.
  - name: secrets
    public: true
    serial_groups: [worker]
    on_success:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: gitleaks, STATUS: success, TARGET_ENV: prod }
    on_failure:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: gitleaks, STATUS: failed, TARGET_ENV: prod }
    on_error:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: gitleaks, STATUS: errored, TARGET_ENV: prod }
    on_abort:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: gitleaks, STATUS: aborted, TARGET_ENV: prod }
    plan:
      - get: source
        trigger: true
        # PS-4: behind the quality gate, like every other scanning lane in
        # this pipeline and like the whole of the mykronos one. These five
        # had no `passed:` at all, so they scanned commits whose own test
        # suite had failed - spending the single worker on findings about
        # code already known not to work. Spec 15 SS3: "there is no value
        # in scanning a commit that does not pass its own tests."
        passed: [unit]
      - get: python
      - *preflight
      - task: gitleaks
        timeout: 55m
        image: python
        params: *mykronos_env
        config:
          platform: linux
          inputs: [{ name: source }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -uo pipefail
                cd source
                mkdir -p /tmp/results
                apt-get update -qq && apt-get install -y -qq curl git >/dev/null
                # Checksummed (PS-8), the way the osv-scanner binary in the
                # `dependencies` lane already is and this was not. Pinning the
                # version without pinning the bytes is half a control, in a
                # lane whose whole job is to notice exactly this class of thing
                # elsewhere.
                curl -sSfL -o /tmp/gitleaks.tar.gz \
                  https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
                echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tar.gz" \
                  | sha256sum -c -
                tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

                # `detect` reads git history, not the working tree: the claim
                # being made is that no secret was ever committed, not that
                # none is present at HEAD.
                #
                # PS-3: the exit code is captured, never allowed to skip the
                # upload below. gitleaks runs with `--exit-code 0`, so a
                # non-zero here is the scanner failing rather than a secret
                # being found - and a scanner that failed before uploading
                # reads in the lake as a capability nobody ever enabled.
                rc=0
                /tmp/gitleaks detect --source . --report-format json \
                  --report-path /tmp/results/gitleaks.json --redact --exit-code 0 --no-banner || rc=$?

                pip install --quiet "mykronos @ git+https://github.com/ToddGBenson/mykronos@${MYKRONOS_REF}#subdirectory=backend"
                python -c "import json,importlib.metadata as m;t=m.distribution('mykronos').read_text('direct_url.json');print('mykronos uploader @', json.loads(t).get('vcs_info',{}).get('commit_id','unknown')[:12] if t else '(local install)')" || echo "mykronos uploader @ (could not resolve)"
                python -m mykronos.upload \
                  --capability secrets --tool gitleaks \
                  --results-path /tmp/results \
                  --ingestion-url "$MYKRONOS_URL" --token "$MYKRONOS_TOKEN" \
                  --repo ToddGBenson/TheHub \
                  --commit-sha "$(git rev-parse HEAD)" \
                  --branch "$SCANNED_BRANCH" \
                  --workspace "$PWD" \
                  --severity-threshold low --blocking false

                if [ "$rc" -ne 0 ]; then
                  echo "::error::gitleaks exited $rc - a scan failure, not a result."
                  exit "$rc"
                fi
  - name: sast
    public: true
    serial_groups: [worker]
    on_success:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: semgrep, STATUS: success, TARGET_ENV: prod }
    on_failure:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: semgrep, STATUS: failed, TARGET_ENV: prod }
    on_error:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: semgrep, STATUS: errored, TARGET_ENV: prod }
    on_abort:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: semgrep, STATUS: aborted, TARGET_ENV: prod }
    plan:
      - get: source
        trigger: true
        # PS-4: behind the quality gate, like every other scanning lane in
        # this pipeline and like the whole of the mykronos one. These five
        # had no `passed:` at all, so they scanned commits whose own test
        # suite had failed - spending the single worker on findings about
        # code already known not to work. Spec 15 SS3: "there is no value
        # in scanning a commit that does not pass its own tests."
        passed: [unit]
      - get: python313
      - *preflight
      - task: semgrep
        timeout: 45m
        image: python313
        params: *mykronos_env
        config:
          platform: linux
          inputs: [{ name: source }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -uo pipefail
                cd source
                mkdir -p /tmp/results
                apt-get update -qq && apt-get install -y -qq git >/dev/null

                # Semgrep rather than CodeQL, and the substitution is not
                # cosmetic - see spec 16 section 5. CodeQL's CLI wants a
                # multi-hundred-megabyte bundle per language on every run, and
                # its licence covers Actions on public repositories and GHAS
                # customers, not a self-hosted worker scanning a private repo.
                # Semgrep is already a registered `sast` tool (spec 04 section
                # 3 names it as the secondary) and emits SARIF.
                #
                # `--tool semgrep` is passed explicitly below rather than
                # letting the capability default to codeql, so the lake records
                # which analyser produced each finding. A dashboard implying
                # CodeQL coverage that never ran is the failure mode here.
                # setuptools alongside it, held below 81: Python 3.13 images
                # stopped shipping setuptools, semgrep's opentelemetry
                # instrumentation imports pkg_resources at module load, and
                # setuptools 81 removed pkg_resources - so both no setuptools
                # and the newest setuptools produce the same
                # ModuleNotFoundError. Caught on the mykronos pipeline, fixed
                # here too rather than waiting for the same failure twice.
                pip install --quiet "setuptools<81" semgrep==1.97.0

                # Rule packs are downloaded from semgrep.dev; the source code
                # stays on this worker. `--config auto` is deliberately not
                # used - it reports the repository to semgrep.dev, which is
                # exactly the class of thing spec 12 section 5.2 makes opt-in.
                rc=0
                semgrep scan \
                  --config p/security-audit \
                  --config p/owasp-top-ten \
                  --sarif --output /tmp/results/semgrep.sarif \
                  --metrics off --quiet . || rc=$?

                # 1 means findings, which is a result. Anything else is a scan
                # failure and must not read as clean code.
                if [ "$rc" -gt 1 ]; then
                  echo "::error::semgrep exited $rc - a scan failure, not a result"
                  exit "$rc"
                fi

                pip install --quiet "mykronos @ git+https://github.com/ToddGBenson/mykronos@${MYKRONOS_REF}#subdirectory=backend"
                python -c "import json,importlib.metadata as m;t=m.distribution('mykronos').read_text('direct_url.json');print('mykronos uploader @', json.loads(t).get('vcs_info',{}).get('commit_id','unknown')[:12] if t else '(local install)')" || echo "mykronos uploader @ (could not resolve)"
                python -m mykronos.upload \
                  --capability sast --tool semgrep \
                  --results-path /tmp/results \
                  --ingestion-url "$MYKRONOS_URL" --token "$MYKRONOS_TOKEN" \
                  --repo ToddGBenson/TheHub \
                  --commit-sha "$(git rev-parse HEAD)" \
                  --branch "$SCANNED_BRANCH" \
                  --workspace "$PWD" \
                  --severity-threshold low --blocking false
  - name: dependencies
    public: true
    serial_groups: [worker]
    on_success:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: osv_scanner, STATUS: success, TARGET_ENV: prod }
    on_failure:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: osv_scanner, STATUS: failed, TARGET_ENV: prod }
    on_error:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: osv_scanner, STATUS: errored, TARGET_ENV: prod }
    on_abort:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: osv_scanner, STATUS: aborted, TARGET_ENV: prod }
    plan:
      - get: source
        trigger: true
        # PS-4: behind the quality gate, like every other scanning lane in
        # this pipeline and like the whole of the mykronos one. These five
        # had no `passed:` at all, so they scanned commits whose own test
        # suite had failed - spending the single worker on findings about
        # code already known not to work. Spec 15 SS3: "there is no value
        # in scanning a commit that does not pass its own tests."
        passed: [unit]
      - get: python
      - *preflight
      - task: osv-scanner
        timeout: 45m
        image: python
        params: *mykronos_env
        config:
          platform: linux
          inputs: [{ name: source }]
          outputs: [{ name: evidence }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -uo pipefail
                cd source
                mkdir -p /tmp/results
                apt-get update -qq && apt-get install -y -qq curl git >/dev/null

                # The released Go binary, checksummed. `pip install
                # osv-scanner` installs a reserved-name placeholder with no
                # CLI, which is how this lane once reported zero findings for
                # its entire life.
                curl -sSfL -o /usr/local/bin/osv-scanner \
                  https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64
                echo "edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c  /usr/local/bin/osv-scanner" \
                  | sha256sum -c -
                chmod +x /usr/local/bin/osv-scanner

                # `--no-resolve` because transitive resolution calls deps.dev,
                # which returns an internal error for any requirements.txt
                # containing sqlalchemy - TheHub's does - and an extractor
                # error is exit 127, which would fail the whole lane.
                rc=0
                osv-scanner scan source --recursive --no-resolve \
                  --format sarif --output-file /tmp/results/osv.sarif . 2>&1 | tee /tmp/osv.log
                rc=${PIPESTATUS[0]}

                # The same scan again as JSON. SARIF describes findings;
                # it does not describe what was resolved, and the trust
                # score is about the second thing. `|| true` because a
                # failure here costs the evidence, not the findings.
                osv-scanner scan source --recursive --no-resolve \
                  --format json --all-packages --output-file /tmp/osv.json . || true
                test -f /tmp/osv.json || echo '{"results":[]}' > /tmp/osv.json
                cp /tmp/osv.json ../evidence/osv.json

                # L0001. Exit 128 with that message is the third state: nothing
                # to scan. Announced loudly and reported as an empty scan,
                # because a repository that declares no dependencies is not a
                # repository with clean dependencies - and a lane that goes red
                # forever for a repo that will never have a manifest is a lane
                # somebody pauses.
                #
                # Matched on the message as well as the code: 128 is overloaded
                # and a different 128 is still a real failure.
                if [ "$rc" -eq 128 ] && grep -qi "no package sources found" /tmp/osv.log; then
                  echo "=================================================="
                  echo "NO PACKAGE SOURCES FOUND."
                  echo "This is NOT a clean bill of health for dependencies"
                  echo "that exist; it is a statement that none were declared."
                  echo "=================================================="
                  printf '%s' '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"osv-scanner"}},"results":[]}]}' \
                    > /tmp/results/osv.sarif
                  rc=0
                fi

                # PS-3: the verdict is deferred to after the upload. It used
                # to `exit "$rc"` here, so a scanner that broke skipped its own
                # upload and `atlas` read as `never_reported` -
                # indistinguishable from a capability nobody enabled. Whatever
                # findings did get written are still worth having, and the
                # ScanRun's `failure` status is what says the picture is
                # incomplete.

                pip install --quiet "mykronos @ git+https://github.com/ToddGBenson/mykronos@${MYKRONOS_REF}#subdirectory=backend"
                python -c "import json,importlib.metadata as m;t=m.distribution('mykronos').read_text('direct_url.json');print('mykronos uploader @', json.loads(t).get('vcs_info',{}).get('commit_id','unknown')[:12] if t else '(local install)')" || echo "mykronos uploader @ (could not resolve)"
                python -m mykronos.upload \
                  --capability atlas --tool osv-scanner \
                  --results-path /tmp/results \
                  --ingestion-url "$MYKRONOS_URL" --token "$MYKRONOS_TOKEN" \
                  --repo ToddGBenson/TheHub \
                  --commit-sha "$(git rev-parse HEAD)" \
                  --branch "$SCANNED_BRANCH" \
                  --workspace "$PWD" \
                  --severity-threshold low --blocking false

                # 1 means vulnerabilities were found, which is a result.
                # Anything above it is a scan failure and must not read as a
                # clean supply chain - now that it has been reported as one.
                if [ "$rc" -gt 1 ]; then
                  echo "::error::osv-scanner exited $rc - a scan failure, not a result"
                  exit "$rc"
                fi

  # Scans the image this commit produced, out of the registry. Two tasks
  # because Trivy's image has no python and the uploader lives in the mykronos
  # package - which is the seam that lets a Concourse task report findings the
  # dashboard cannot distinguish from an Actions run.

      # Supply-chain evidence. TheHub's Concourse pipeline produced none: no
      # SBOM, no provenance, no ecosystem counts -- so the dashboard's SSCS
      # panel was empty for every commit this pipeline built, and Oracle
      # scored the repo with no Atlas evidence to read.
      #
      # It was not always missing. `.github/workflows/ci.yml` builds a
      # CycloneDX SBOM and says so in its header, listing it among the things
      # only GHA can do. Retiring those workflows for Concourse would have
      # taken the SBOM with them and left nothing in its place, which is the
      # kind of loss a migration does not announce.
      #
      # In `dependencies` rather than `build` on purpose: Oracle reads Atlas
      # evidence, and evidence produced after the gate is evidence the gate
      # could not use.
      - task: sbom-and-evidence
        timeout: 30m
        image: python
        params: *mykronos_env
        config:
          platform: linux
          inputs: [{ name: source }, { name: evidence }]
          outputs: [{ name: sbom-out }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -euo pipefail
                apt-get update -qq && apt-get install -y -qq curl jq git >/dev/null
                pip install --quiet "mykronos @ git+https://github.com/ToddGBenson/mykronos@${MYKRONOS_REF}#subdirectory=backend"
                python -c "import json,importlib.metadata as m;t=m.distribution('mykronos').read_text('direct_url.json');print('mykronos uploader @', json.loads(t).get('vcs_info',{}).get('commit_id','unknown')[:12] if t else '(local install)')" || echo "mykronos uploader @ (could not resolve)"

                SHA=$(git -C source rev-parse HEAD)
                SHORT=$(git -C source rev-parse --short HEAD)

                # Syft, pinned, scanning the checkout. `cyclonedx-py
                # environment` would document the interpreter this task runs
                # in rather than the repository -- a plausible SBOM of
                # entirely the wrong software (D-034).
                # The release tarball, checksummed - not
                # `curl raw.githubusercontent.com/.../main/install.sh | sh`
                # (PS-8). That form pinned the syft *version* while piping an
                # unpinned installer script from a third party's `main` branch
                # straight into a shell, inside the lane that produces this
                # repository's supply-chain evidence.
                curl -sSfL -o /tmp/syft.tar.gz \
                  https://github.com/anchore/syft/releases/download/v1.51.0/syft_1.51.0_linux_amd64.tar.gz
                echo "2a2e837a2c8d59ec9af5472ee22d3b04ee463c4e44476ecf993fd1e5ab6ebc7f  /tmp/syft.tar.gz" \
                  | sha256sum -c -
                tar -xzf /tmp/syft.tar.gz -C /usr/local/bin syft
                syft scan dir:source \
                  --exclude './**/node_modules' --exclude './**/.venv' \
                  --exclude './**/venv' --exclude './**/vendor' \
                  --output cyclonedx-json > "sbom-out/sbom-${SHORT}.cdx.json"

                COMPONENTS=$(jq '((.components // []) | length)' "sbom-out/sbom-${SHORT}.cdx.json")
                echo "SBOM lists $COMPONENTS component(s)"
                if [ "$COMPONENTS" -eq 0 ]; then
                  # Archiving an empty one is worse than recording none: the
                  # dashboard would show an SBOM present for a file that
                  # describes no software.
                  echo "::error::SBOM has no components; refusing to publish an empty one."
                  exit 1
                fi

                SBOM_REF=$(curl --fail --silent --show-error --max-time 60 \
                  -X POST "$MYKRONOS_URL/api/ingest/raw?scan_run_id=${SHA}&capability=atlas&filename=sbom.json" \
                  -H "Authorization: Bearer $MYKRONOS_TOKEN" \
                  -H "Content-Type: application/octet-stream" \
                  --data-binary "@sbom-out/sbom-${SHORT}.cdx.json" | jq -r '.raw_output_ref')

                # Counts, not a score. The trust formula lives in the platform
                # so it cannot drift between CI systems (spec 07 §5, §7).
                #
                # --sbom enables the license pass (spec 22 §1). Without it
                # `licenses_seen` stays empty, which the platform reads as
                # not-computed rather than as no-licenses-found. This call
                # omitted it while the Actions path passed it, so whether a
                # repository had license evidence depended on which CI system
                # finished last — the evidence write is an upsert and both
                # scan the same commits (B-005).
                #
                # No `-f` guard: this task has already exited non-zero above
                # if the SBOM has no components.
                SBOM_ARGS="--sbom sbom-out/sbom-${SHORT}.cdx.json"

                # Opt-in per spec 07 §7: an outbound call to the npm and PyPI
                # registries, never on by default (spec 22 §2.1, B-004).
                if [ "${ATLAS_CHECK_FRESHNESS:-false}" = "true" ]; then
                  SBOM_ARGS="$SBOM_ARGS --check-freshness --staleness-threshold-days ${ATLAS_STALENESS_THRESHOLD_DAYS:-730}"
                fi

                # shellcheck disable=SC2086  # deliberate word splitting
                ECOSYSTEMS=$(python -m mykronos.atlas_counts evidence/osv.json $SBOM_ARGS)

                PROVENANCE=$(jq -nc \
                  --arg builder "concourse" \
                  --arg repo "ToddGBenson/TheHub" \
                  --arg commit "$SHA" \
                  --arg run_id "${BUILD_ID:-unknown}" \
                  --arg runner "linux-amd64" \
                  --arg workflow "${BUILD_PIPELINE_NAME:-thehub}/${BUILD_JOB_NAME:-dependencies}" \
                  '{builder_id: $builder, source_repo: $repo, source_commit: $commit,
                    build_run_id: $run_id, runner: $runner, workflow: $workflow}')

                BODY=$(jq -nc \
                  --arg commit "$SHA" \
                  --arg sbom "$SBOM_REF" \
                  --argjson ecosystems "$ECOSYSTEMS" \
                  --argjson provenance "$PROVENANCE" \
                  '{commit_sha: $commit, ecosystems: $ecosystems, provenance: $provenance}
                   + (if $sbom == "" or $sbom == "null" then {} else {sbom_ref: $sbom} end)')

                curl --fail --silent --show-error --max-time 60 \
                  -X POST "$MYKRONOS_URL/api/ingest/atlas" \
                  -H "Authorization: Bearer $MYKRONOS_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "$BODY" > out.json

                TRUST=$(jq -r '.trust_score' out.json)
                DEPS=$(jq -r '.dependency_count' out.json)
                VULN=$(jq -r '.vulnerable_dependency_count' out.json)

                # Null rather than a number means the scan resolved nothing
                # (spec 07 §5a). Printing `null/100` would undo the whole
                # point of that distinction.
                if [ "$TRUST" = "null" ]; then
                  echo "Supply-chain trust: NOT ASSESSED - no dependencies were resolved."
                else
                  echo "Supply-chain trust: $TRUST/100 ($VULN vulnerable of $DEPS dependencies)"
                  if [ "$(jq -r '.below_minimum' out.json)" = "true" ]; then
                    echo "::warning::Trust score $TRUST is below this repository's floor of $(jq -r '.min_trust_score' out.json)."
                  fi
                fi

      - put: sbom
        params: { file: sbom-out/sbom-*.cdx.json }
  - name: containers
    public: true
    serial_groups: [worker]
    on_success:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: trivy, STATUS: success, TARGET_ENV: prod }
    on_failure:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: trivy, STATUS: failed, TARGET_ENV: prod }
    on_error:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: trivy, STATUS: errored, TARGET_ENV: prod }
    on_abort:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: trivy, STATUS: aborted, TARGET_ENV: prod }
    plan:
      - get: source
        trigger: true
        passed: [build]
      - get: python
      - get: trivy

      - *preflight
      # The SHA is resolved in a task that has git, and handed over as a file.
      # Trivy's image does not, and reading `.git/HEAD` by hand works right up
      # until the ref is packed.
      - task: resolve-sha
        timeout: 5m
        image: python
        config:
          platform: linux
          inputs: [{ name: source }]
          outputs: [{ name: meta }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -euo pipefail
                apt-get update -qq && apt-get install -y -qq git >/dev/null
                git -C source rev-parse HEAD | tr -d '\n' > meta/sha

      - task: scan-image
        timeout: 45m
        image: trivy
        config:
          platform: linux
          inputs: [{ name: source }, { name: meta }]
          outputs: [{ name: results }]
          params:
            REGISTRY: ((registry))
          run:
            path: sh
            args:
              - -ec
              - |
                set -eu
                SHA=$(cat meta/sha)
                echo "Scanning ${REGISTRY}/thehub:${SHA}"

                # `--insecure` is the registry's TLS, not the scan's rigour:
                # the registry is plain HTTP on the LAN (spec 15 section 5).
                # No daemon and no privileged task - Trivy pulls the image
                # itself, which is the whole reason this lane can finally scan
                # an image rather than a Dockerfile.
                # `--parallel 1`, and the reason is not caution for its own
                # sake. At the default of 5 this lane failed twice with
                #
                #   failed to analyze .../coverage/tracer...so:
                #   semaphore acquire: context deadline exceeded
                #
                # after ten and fourteen minutes of a thirty-minute budget -
                # so it was not the timeout running out, it was five analyser
                # goroutines contending for a worker that is also building
                # images for two other pipelines. Serialising the analysis
                # trades wall-clock for a scan that finishes.
                #
                # It matters which way that trade goes. The step below
                # refuses to upload an empty report, so contention here does
                # not become a clean container scan - it becomes a red lane,
                # which is correct and also blocks everything behind it.
                trivy image "${REGISTRY}/thehub:${SHA}" \
                  --insecure \
                  --scanners vuln \
                  --format sarif --output results/trivy.sarif \
                  --exit-code 0 --quiet \
                  --parallel 1 \
                  --timeout 30m

                # An absent or empty report is a failed scan, and the uploader
                # already treats it as one. Saying so here names the step that
                # broke instead of leaving it to be inferred.
                test -s results/trivy.sarif || {
                  echo "::error::Trivy wrote no report - the image scan did not run."
                  exit 1
                }
        # PS-3: `ensure`, so the upload runs whether the scan above
        # succeeded or not. Concourse creates a declared output volume before
        # the task runs, so a scanner that died leaves an empty `results` --
        # which `adapters/registry.py` reports as a *failed scan*, and which is
        # the honest answer. As a plain following step this never ran on a bad
        # build, and the capability went `never_reported`: identical, in the
        # lake, to a capability nobody enabled (L0003).
        ensure:
          task: upload
          timeout: 10m
          image: python
          params: *mykronos_env
          config:
            platform: linux
            inputs: [{ name: source }, { name: results }]
            run:
              path: bash
              args:
                - -ec
                - |
                  set -euo pipefail
                  apt-get update -qq && apt-get install -y -qq git >/dev/null
                  pip install --quiet "mykronos @ git+https://github.com/ToddGBenson/mykronos@${MYKRONOS_REF}#subdirectory=backend"
                  python -c "import json,importlib.metadata as m;t=m.distribution('mykronos').read_text('direct_url.json');print('mykronos uploader @', json.loads(t).get('vcs_info',{}).get('commit_id','unknown')[:12] if t else '(local install)')" || echo "mykronos uploader @ (could not resolve)"
                  python -m mykronos.upload \
                    --capability containers --tool trivy \
                    --results-path results \
                    --ingestion-url "$MYKRONOS_URL" --token "$MYKRONOS_TOKEN" \
                    --repo ToddGBenson/TheHub \
                    --commit-sha "$(git -C source rev-parse HEAD)" \
                    --branch "$SCANNED_BRANCH" \
                    --workspace "$PWD/source" \
                    --severity-threshold low --blocking false


  # Insider risk, without a pull-request event to hang it on. Spec 16 section 6
  # is the whole explanation; the short version is that Concourse sees a branch
  # and Aegis is built around a `pull_request`, so the missing context is
  # recovered by asking GitHub which pull request introduced this commit.
  # **The promotion gate (#55167).** `insider` is the last job a version clears
  # before `deploy-prod` becomes reachable, so its `passed:` list IS the gate.
  # Until 2026-09-04 it named only `oracle-gate`, which made `api-inventory`,
  # `dast-demo` and `functional-dast` siblings of the gate rather than part of
  # it: they hang off `deploy-demo` and nothing downstream required them, so a
  # commit whose demo DAST failed was still eligible for production. That is
  # the 2026-08-20 state, where api-inventory failed builds #14-#19 while
  # oracle-gate #20 went green and the version stayed promotable. A security
  # scan that cannot stop a release is advisory decoration.
  #
  # `functional-dast` is deliberately NOT listed, and that is not an oversight.
  # It is **paused** on the server under D-053 -- the active scan measured 548%
  # CPU and 7 GiB and took production down -- and a `passed:` constraint on a
  # paused job can never be satisfied. Listing it would not tighten the gate,
  # it would close it permanently. It goes in the day the scan has a resource
  # budget and comes off pause, and not before.
  - name: insider
    public: true
    serial_groups: [worker]
    on_success:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: insider_risk, STATUS: success, TARGET_ENV: prod }
    on_failure:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: insider_risk, STATUS: failed, TARGET_ENV: prod }
    on_error:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: insider_risk, STATUS: errored, TARGET_ENV: prod }
    on_abort:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: insider_risk, STATUS: aborted, TARGET_ENV: prod }
    plan:
      - get: source
        trigger: true
        passed: [oracle-gate, api-inventory, dast-demo]
      - get: python
      - *preflight
      - task: aegis
        timeout: 15m
        image: python
        params:
          MYKRONOS_URL: ((mykronos-url))
          MYKRONOS_TOKEN: ((thehub-ingestion-token))
          MYKRONOS_REF: ((mykronos-ref))
          # Read-only, and the same installation token the git resource uses.
          # Aegis never needs to write: spec 06 section 6 requires that it can
          # never merge, close or force-push.
          GITHUB_TOKEN: ((github-token))
          SLACK_BOT_TOKEN: ((slack-bot-token))
          SLACK_CHANNEL: ((slack-alert-channel))
        config:
          platform: linux
          inputs: [{ name: source }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -uo pipefail
                apt-get update -qq && apt-get install -y -qq curl jq git >/dev/null
                cd source
                git config --global --add safe.directory "$PWD"

                SHA=$(git rev-parse HEAD)
                API=https://api.github.com/repos/ToddGBenson/TheHub

                curl --fail --silent --show-error --max-time 30 \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "$API/commits/$SHA/pulls" > pulls.json || echo '[]' > pulls.json

                PR=$(jq -r 'if type == "array" and length > 0 then .[0].number else "" end' pulls.json)

                if [ -z "$PR" ] || [ "$PR" = "null" ]; then
                  echo "=================================================="
                  echo "NO PULL REQUEST FOR $SHA."
                  echo "This commit reached ${SCANNED_BRANCH:-the branch}"
                  echo "without one, so there are no reviews to have"
                  echo "integrity, no base ref to measure an author baseline"
                  echo "against, and no description to check for AI"
                  echo "disclosure."
                  echo ""
                  echo "NO INSIDER-RISK ASSESSMENT WAS RECORDED. That is"
                  echo "deliberate: submitting one anyway would score 0/100"
                  echo "for exactly the case Aegis exists to notice - the"
                  echo "change nobody reviewed reading as the safest change"
                  echo "in the repository."
                  echo "=================================================="
                  exit 0
                fi

                # Errexit from here on. Up to this point a failed fetch is a
                # tolerated outcome that takes the no-pull-request path; past
                # it, every call is one whose failure would produce an
                # assessment built from an empty payload - a null author and no
                # signals, which posts as a clean 0/100.
                set -e

                echo "Assessing pull request #$PR"
                curl --fail --silent --show-error --max-time 30 \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "$API/pulls/$PR" > pr.json

                AUTHOR=$(jq -r '.user.login' pr.json)
                BASE=$(jq -r '.base.ref' pr.json)
                # A PR description is attacker-controlled text. Written to a
                # file and passed by path, never interpolated into a command.
                jq -r '.body // ""' pr.json > pr-body.txt

                # A failed fetch costs the review-integrity signals, not the
                # whole assessment.
                curl --fail --silent --show-error --max-time 30 \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "$API/pulls/$PR/reviews" > reviews.json || echo '[]' > reviews.json

                # The author's role on this repo, for `privilege_adjacent`.
                # Tolerated failure: the endpoint needs push access, and a
                # token without it must cost this one signal rather than the
                # whole assessment. An empty ROLE means "not established",
                # which the scorer treats as absent, not as ordinary access.
                ROLE=""
                if curl --fail --silent --show-error --max-time 30                   -H "Accept: application/vnd.github.v3+json"                   "$API/collaborators/$AUTHOR/permission" > perm.json; then
                  # `role_name` distinguishes maintain from write; the older
                  # `permission` field collapses them, and maintain is exactly
                  # the case this signal is about.
                  ROLE=$(jq -r '.role_name // .permission // ""' perm.json)
                fi

                # The git resource clones with full history by default, but the
                # base branch is not fetched, and the author-baseline signal
                # compares against it. Without this the signal is skipped
                # rather than guessed (spec 06 section 7) - which is safe, and
                # is still less than this could see.
                git fetch --quiet origin "$BASE" || true

                pip install --quiet "mykronos @ git+https://github.com/ToddGBenson/mykronos@${MYKRONOS_REF}#subdirectory=backend"
                python -c "import json,importlib.metadata as m;t=m.distribution('mykronos').read_text('direct_url.json');print('mykronos uploader @', json.loads(t).get('vcs_info',{}).get('commit_id','unknown')[:12] if t else '(local install)')" || echo "mykronos uploader @ (could not resolve)"

                python -m mykronos.aegis_signals \
                  --pr-number "$PR" \
                  --commit-sha "$SHA" \
                  --author "$AUTHOR" \
                  --base-ref "FETCH_HEAD" \
                  --head-ref "$SHA" \
                  --pr-body-file pr-body.txt \
                  --reviews-file reviews.json                   ${ROLE:+--author-role "$ROLE"} \
                  --sensitive-path '**/auth/**' \
                  --sensitive-path '**/*secret*' \
                  --sensitive-path '**/.github/workflows/**' \
                  --sensitive-path '**/iam/**' \
                  > signals.json

                echo "Signals observed:"
                jq -r '.signals[] | "  \(.key): \(.rationale)"' signals.json

                curl --fail --silent --show-error --max-time 60 \
                  -X POST "$MYKRONOS_URL/api/ingest/aegis" \
                  -H "Authorization: Bearer $MYKRONOS_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d @signals.json > result.json

                echo "Aegis: $(jq -r '.recommendation' result.json) at $(jq -r '.insider_risk_score' result.json)/100"

                # Slack gets a pull request number and a link. Nothing else.
                #
                # spec 06 section 9 treats an insider-risk row as personal
                # data about a named colleague - kept because it is useful
                # while reviewing the pull request it concerns, and purged
                # after retention_days. A Slack channel is a broadcast with
                # its own retention that no purge job can reach, so the score,
                # the signal breakdown and the author's login stay out of it.
                # They live in the check run, where the person they are about
                # can read them and argue with them.
                if [ "$(jq -r '.recommendation' result.json)" != "pass" ] \
                   && [ -n "${SLACK_BOT_TOKEN:-}" ]; then
                  printf '{"channel":"%s","text":"*TheHub / insider risk*: pull request #%s is flagged for closer review.\\nDetail is in the check run: https://github.com/ToddGBenson/TheHub/pull/%s"}' \
                    "$SLACK_CHANNEL" "$PR" "$PR" > slack.json
                  curl -sS --max-time 20 -X POST https://slack.com/api/chat.postMessage \
                    -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
                    -H 'Content-Type: application/json; charset=utf-8' \
                    -d @slack.json \
                    || echo "Slack post failed - not failing the assessment over a notification."
                fi

                # Advisory unless this repository opted into blocking
                # (spec 06 section 4). Even then a human decides; this is a
                # prompt to review the change carefully, not a judgement about
                # the person who wrote it.
                if [ "$(jq -r '.blocking' result.json)" = "true" ] \
                   && [ "$(jq -r '.recommendation' result.json)" = "block_recommended" ]; then
                  echo "::error::Aegis recommends blocking and blocking is enabled for this repository."
                  exit 1
                fi

  # == Stage 4: the gate ====================================================
  #
  # After every security lane, never alongside them. Oracle scores the whole
  # picture (spec 09 section 8); gating on a partial one produces a decision
  # the next finding invalidates.
  - name: oracle-gate
    public: true
    on_success:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: oracle_gate, STATUS: success, TARGET_ENV: prod }
    on_failure:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: oracle_gate, STATUS: failed, TARGET_ENV: prod }
    on_error:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: oracle_gate, STATUS: errored, TARGET_ENV: prod }
    on_abort:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: oracle_gate, STATUS: aborted, TARGET_ENV: prod }
    plan:
      - get: source
        trigger: true
        # DAST is temporarily out of the mandatory chain (D-053): the active
        # scan saturates the single worker host - ZAP alone was measured at
        # 548% CPU / 7 GiB - and while it runs, everything sharing the machine
        # (including production Mykronos) times out. `functional-dast` still
        # exists and can be triggered by hand; when it runs, its results still
        # reach Mykronos. It is paused, not deleted, and this edge goes back
        # when the scan has a resource budget it can live within.
        passed: [deploy-demo]
      - get: python
      - *preflight
      - task: evaluate
        timeout: 10m
        image: python
        params:
          MYKRONOS_URL: ((mykronos-url))
          MYKRONOS_TOKEN: ((thehub-ingestion-token))
          MYKRONOS_GATE_TOKEN: ((mykronos-gate-token))
          # Whether a no_go stops the deploy. Anything other than "true" lets
          # it through and says so, loudly, in the build log and in Slack.
          # See the gate body below for why this is a var and not an edit.
          ORACLE_BLOCKING: ((thehub-oracle-blocking))
        config:
          platform: linux
          inputs: [{ name: source }]
          outputs: [{ name: notify }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -euo pipefail
                cd source
                apt-get update -qq && apt-get install -y -qq curl jq git >/dev/null

                # No repo_full_name: it comes from the ingestion token, so a
                # pipeline cannot request a decision about somebody else's
                # repository. The endpoint forbids extra fields, so sending it
                # is a 422 rather than a harmless duplicate.
                BODY=$(jq -nc \
                  --arg sha "$(git rev-parse HEAD)" \
                  '{commit_sha: $sha, decision_type: "portfolio"}')

                curl --fail --silent --show-error --max-time 120 \
                  -X POST "$MYKRONOS_URL/api/oracle/evaluate" \
                  -H "Authorization: Bearer $MYKRONOS_TOKEN" \
                  -H "X-Hub-Token: $MYKRONOS_GATE_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "$BODY" > decision.json

                echo "Oracle: $(jq -r '.recommendation' decision.json) (score $(jq -r '.overall_risk_score' decision.json))"
                jq -r '.reasoning // empty' decision.json

                RECOMMENDATION=$(jq -r '.recommendation' decision.json)
                SCORE=$(jq -r '.overall_risk_score' decision.json)
                SHORT=$(git rev-parse --short HEAD)

                # Blocks on what this commit INTRODUCED, not on the backlog
                # (D-048, ported from the mykronos pipeline - D-083).
                #
                # This gate used to block on the composite score, and D-048
                # had already written down why that does not work: the score
                # describes the whole estate, so a repository carrying a large
                # accepted backlog refuses every commit regardless of content,
                # "and a gate that refuses everything gets switched off or
                # routed around". That is exactly what happened here. It
                # refused everything, and on 2026-08-18 it was switched off.
                #
                # The lesson was learned once, for one pipeline, and left
                # unapplied to the other. "No new criticals, no new highs"
                # does not drift as the backlog grows, so the gate can be on
                # permanently rather than until the next bad week.
                #
                # The score is still evaluated, still recorded, still drives
                # the dashboard and still reaches Slack on a no_go. It just no
                # longer decides whether TheHub ships.
                INTRODUCED_BLOCKING=$(jq -r '.introduced_blocking' decision.json)
                NEW_CRITICAL=$(jq -r '.introduced.critical // 0' decision.json)
                NEW_HIGH=$(jq -r '.introduced.high // 0' decision.json)

                if [ "$RECOMMENDATION" = "no_go" ]; then
                  echo "::warning::Oracle scores TheHub no_go at ${SCORE}/100."
                  echo "That is the standing backlog, not this change - see D-048."
                fi

                echo "Introduced by ${SHORT}: ${NEW_CRITICAL} critical, ${NEW_HIGH} high."

                if [ "$INTRODUCED_BLOCKING" = "true" ]; then
                  # -- The gate can still be turned off, and it says so -----
                  #
                  # `((thehub-oracle-blocking))`, set in
                  # set-thehub-pipeline.ps1, kept from the 2026-08-18 override
                  # (D-081) rather than removed. The reason it existed - a
                  # control switched off invisibly is worse than one switched
                  # off loudly - is still right. What changed is that it now
                  # guards a floor worth guarding, so it should stay "true".
                  if [ "${ORACLE_BLOCKING:-true}" != "true" ]; then
                    printf '*TheHub / Oracle* - commit `%s` introduced %s critical and %s high finding(s). Gate is NON-BLOCKING, so this deployed anyway.' \
                      "$SHORT" "$NEW_CRITICAL" "$NEW_HIGH" > ../notify/message.txt

                    echo "=================================================="
                    echo "THIS COMMIT INTRODUCED ${NEW_CRITICAL} CRITICAL AND"
                    echo "${NEW_HIGH} HIGH FINDING(S), AND THE GATE IS"
                    echo "NON-BLOCKING. It is proceeding because"
                    echo "thehub-oracle-blocking is not 'true'."
                    echo ""
                    echo "This green tick is NOT a passing risk decision."
                    echo "=================================================="
                    exit 0
                  fi

                  # Written for the on_failure hook, which otherwise knows
                  # only the job name. Counts of findings a commit introduced
                  # describe the change, not a person, so this is safe to
                  # broadcast - unlike anything the insider lane produces.
                  printf '*TheHub / Oracle* - commit `%s` introduced %s critical and %s high finding(s). Nothing is deployed.' \
                    "$SHORT" "$NEW_CRITICAL" "$NEW_HIGH" > ../notify/message.txt

                  echo "::error::This commit introduced ${NEW_CRITICAL} critical and ${NEW_HIGH} high finding(s)."
                  echo "The floor is no new criticals and no new highs. Fix them, or"
                  echo "disposition them - an accepted risk with a reason does not block."
                  exit 1
                fi

  # == Stage 5: deliver to demo =============================================
  - name: deploy-demo
    public: true
    on_success:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: deploy_staging, STATUS: success, TARGET_ENV: staging }
    on_failure:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: deploy_staging, STATUS: failed, TARGET_ENV: staging }
    on_error:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: deploy_staging, STATUS: errored, TARGET_ENV: staging }
    on_abort:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: deploy_staging, STATUS: aborted, TARGET_ENV: staging }
    plan:
      - get: source
        trigger: true
        passed: [secrets, sast, dependencies, containers, prompt-evals, iac]
      - get: python
      - task: request-deploy
        timeout: 45m
        image: python
        params:
          MINIO_ENDPOINT: ((minio-endpoint))
          MINIO_ACCESS_KEY: ((minio-access-key))
          MINIO_SECRET_KEY: ((minio-secret-key))
          RELEASE_BUCKET: ((thehub-release-bucket))
          DEPLOY_TIMEOUT_MINUTES: ((deploy-timeout-minutes))
          TARGET_URL: ((thehub-demo-url))
          ENVIRONMENT: demo
        config:
          platform: linux
          inputs: [{ name: source }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -euo pipefail
                apt-get update -qq && apt-get install -y -qq curl git >/dev/null
                curl -sSfL -o /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-amd64/mc
                chmod +x /usr/local/bin/mc
                SCHEME=${MINIO_ENDPOINT%%://*}
                HOSTPORT=${MINIO_ENDPOINT#*://}
                export MC_HOST_store="$SCHEME://$MINIO_ACCESS_KEY:$MINIO_SECRET_KEY@$HOSTPORT"

                SHA=$(git -C source rev-parse HEAD)
                echo "Requesting $ENVIRONMENT deploy of $SHA"

                # Concourse publishes a pointer. It does not connect to the
                # deploy host, and the host has no listener for it to connect
                # to - the same one-way handoff the image registry already
                # gives us, and the reason docker-compose.yml chose a registry
                # over mounting the Docker socket. Nothing this job can do
                # restarts a service.
                mc --quiet mb --ignore-existing "store/$RELEASE_BUCKET" >/dev/null
                printf '%s' "$SHA" > requested
                mc --quiet cp requested "store/$RELEASE_BUCKET/$ENVIRONMENT.requested"

                # Then wait to be told it happened. Fire-and-forget would let
                # DAST probe the previous build and report it as this commit's
                # result - `passed: [deploy-demo]` has to mean demo is actually
                # serving this SHA, not that a request for it was filed.
                DEADLINE=$(( $(date +%s) + DEPLOY_TIMEOUT_MINUTES * 60 ))
                while :; do
                  if mc --quiet cp "store/$RELEASE_BUCKET/$ENVIRONMENT.deployed" deployed >/dev/null 2>&1 \
                     && [ "$(cat deployed)" = "$SHA" ]; then
                    echo "Host reports $ENVIRONMENT at $SHA"
                    break
                  fi
                  if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                    echo "::error:: $ENVIRONMENT never reported $SHA (waited $DEPLOY_TIMEOUT_MINUTES min)."
                    echo "          The pointer is published and still stands. This means the"
                    echo "          host-side poller is not running, or it failed and rolled back:"
                    echo "          Scheduled Task 'TheHub Registry Pull Deploy' on the deploy host."
                    exit 1
                  fi
                  sleep 20
                done

                # Confirmed from outside the host as well as inside it. The
                # host script health-checks the containers; this checks that
                # the environment answers over the network the way a user
                # reaches it, which is a different claim.
                echo "Confirming ${TARGET_URL} serves the new build..."
                curl --fail --silent --show-error --max-time 30 --retry 5 --retry-delay 10 \
                  --retry-all-errors -o /dev/null "$TARGET_URL"
                echo "$ENVIRONMENT is serving ${SHA}"

  # == Stage 6: DAST against the lower environment ==========================
  #
  # Demo, and only demo. ZAP's baseline is a spider and a passive scan rather
  # than an attack, but the boundary is worth being explicit about because it
  # is the one people erode first: attack traffic against production is a
  # decision with an incident report attached, not a pipeline setting.
  # -- Prompt evals: the AI quality gate (spec 16 section 14) --------------
  #
  # TheHub's prompts are code. `backend/prompts/<feature>/main.<v>.md` drives
  # the room coordinators, and a wording change can regress behaviour no unit
  # test can see: the code is identical and the output is not.
  #
  # The machinery already exists. `services/ai/eval_harness.py` runs fixture
  # sets, `tests/eval_fixtures/eval_thresholds.yaml` holds a pass-rate, p95
  # latency and cost baseline per prompt, and `scripts/run_prompt_evals.py` is
  # the gate. deploy.sh has run it for 51 deploys.
  #
  # Concourse did not - the same gap as the lifecycle bridge in section 13, and
  # worse in one respect: nothing failed. The eval gate simply stopped being
  # consulted for anything this pipeline shipped, so a prompt regression would
  # reach demo with every other lane green.
  #
  # **This costs nothing by default, deliberately.** The runner's own
  # guardrail: rubric fixtures need a Claude API key, and without one they
  # report as skipped while schema_validator and exact_match graders run
  # normally. The deterministic half gates every commit for free; the half that
  # needs a model is opt-in, which is the same rule spec 12 section 5.2 applies
  # to every other outbound AI call here. The judge cache is a Concourse cache,
  # keyed as the harness keys it - on prompt version - so a configured key pays
  # only for prompts that actually changed.
  #
  # Only changed prompts are evaluated, through the runner's own --base-ref
  # diffing. A commit touching no prompt says so and exits clean rather than
  # re-running a suite whose inputs did not move.
  # -- IaC: the configuration nobody was scanning (spec 04 section 3) ------
  #
  # The platform defines ten capabilities and registers checkov as the `iac`
  # scanner, and neither pipeline ran it. Both repositories are substantially
  # infrastructure: Dockerfiles, compose files, an nginx config, and in this
  # one the Concourse pipelines themselves. A privileged container, a bound
  # 0.0.0.0 port or a missing USER directive is exactly the class of finding
  # SAST cannot see, because it is not in the application code.
  #
  # This is the gap a coverage review found rather than a failure: nothing was
  # red, the capability simply had no lane and the dashboard column for it had
  # always been empty.
  - name: iac
    public: true
    serial_groups: [worker]
    on_success:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: checkov, STATUS: success, TARGET_ENV: prod }
    on_failure:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: checkov, STATUS: failed, TARGET_ENV: prod }
    on_error:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: checkov, STATUS: errored, TARGET_ENV: prod }
    on_abort:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: checkov, STATUS: aborted, TARGET_ENV: prod }
    plan:
      - get: source
        trigger: true
        # PS-4: behind the quality gate, like every other scanning lane in
        # this pipeline and like the whole of the mykronos one. These five
        # had no `passed:` at all, so they scanned commits whose own test
        # suite had failed - spending the single worker on findings about
        # code already known not to work. Spec 15 SS3: "there is no value
        # in scanning a commit that does not pass its own tests."
        passed: [unit]
      - get: python
      - get: checkov
      - *preflight
      - task: scan-iac
        timeout: 20m
        image: checkov
        config:
          platform: linux
          inputs: [{ name: source }]
          outputs: [{ name: results }]
          run:
            path: sh
            args:
              - -ec
              - |
                set -eu
                cd source

                # Frameworks named rather than autodetected. Checkov will
                # happily look for Terraform, CloudFormation and Helm, none of
                # which exist here, and each guess is time spent on a result
                # that cannot exist.
                #
                # `docker_compose` is deliberately absent because it is not a
                # checkov framework -- the first version passed it and checkov
                # refused the whole run with "Invalid frameworks specified".
                # Checkov's own list is dockerfile, github_actions, kubernetes,
                # terraform and friends; compose is not among them.
                #
                # So compose files are NOT covered by this lane, and nothing
                # else covers them either. That is a real gap in IaC coverage
                # rather than a scanner setting, and it is written here so the
                # green tick is not read as "the compose files were checked".
                #
                # --soft-fail because the severity gate belongs to Mykronos and
                # this repository's configured threshold, not to the scanner
                # (spec 04 section 5). A findings-driven exit code here would
                # take the decision away from the platform that owns it.
                OUT=$(mktemp -d)
                checkov --directory . \
                  --framework dockerfile github_actions \
                  --output sarif --output-file-path "$OUT" \
                  --soft-fail --compact --quiet

                # Written to a temp dir and copied out: this image does not run
                # as root and an output volume's ownership is not something to
                # bet a scan on.
                ls "$OUT"/*.sarif >/dev/null 2>&1 || {
                  echo "::error::checkov wrote no SARIF - the scan did not run."
                  exit 1
                }
                cp "$OUT"/*.sarif ../results/
        # PS-3: `ensure`, so the upload runs whether the scan above
        # succeeded or not. Concourse creates a declared output volume before
        # the task runs, so a scanner that died leaves an empty `results` --
        # which `adapters/registry.py` reports as a *failed scan*, and which is
        # the honest answer. As a plain following step this never ran on a bad
        # build, and the capability went `never_reported`: identical, in the
        # lake, to a capability nobody enabled (L0003).
        ensure:
          task: upload
          timeout: 10m
          image: python
          params: *mykronos_env
          config:
            platform: linux
            inputs: [{ name: source }, { name: results }]
            run:
              path: bash
              args:
                - -ec
                - |
                  set -euo pipefail
                  apt-get update -qq && apt-get install -y -qq git >/dev/null
                  pip install --quiet "mykronos @ git+https://github.com/ToddGBenson/mykronos@${MYKRONOS_REF}#subdirectory=backend"
                  python -c "import json,importlib.metadata as m;t=m.distribution('mykronos').read_text('direct_url.json');print('mykronos uploader @', json.loads(t).get('vcs_info',{}).get('commit_id','unknown')[:12] if t else '(local install)')" || echo "mykronos uploader @ (could not resolve)"
                  python -m mykronos.upload \
                    --capability iac --tool checkov \
                    --results-path results \
                    --ingestion-url "$MYKRONOS_URL" --token "$MYKRONOS_TOKEN" \
                    --repo ToddGBenson/TheHub \
                    --commit-sha "$(git -C source rev-parse HEAD)" \
                    --branch "$SCANNED_BRANCH" --workspace "$PWD/source" \
                    --severity-threshold low --blocking false
  - name: prompt-evals
    public: true
    serial_groups: [worker]
    on_success:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: prompt_evals, STATUS: success, TARGET_ENV: prod }
    on_failure:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: prompt_evals, STATUS: failed, TARGET_ENV: prod }
    on_error:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: prompt_evals, STATUS: errored, TARGET_ENV: prod }
    on_abort:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: prompt_evals, STATUS: aborted, TARGET_ENV: prod }
    plan:
      - get: source
        trigger: true
        # PS-4: behind the quality gate, like every other scanning lane in
        # this pipeline and like the whole of the mykronos one. These five
        # had no `passed:` at all, so they scanned commits whose own test
        # suite had failed - spending the single worker on findings about
        # code already known not to work. Spec 15 SS3: "there is no value
        # in scanning a commit that does not pass its own tests."
        passed: [unit]
      - get: python
      - *preflight
      - task: run-evals
        timeout: 90m
        image: python
        params:
          PIP_CACHE_DIR: /pipcache
          # The harness's own default key, pointed at a Concourse cache so a
          # judged fixture is paid for once rather than once per build.
          HUB_EVAL_CACHE_DIR: /eval-cache
          # Empty by default. With no key the rubric graders skip and say so;
          # supplying one turns them on without touching this file.
          ANTHROPIC_API_KEY: ((anthropic-api-key))
        config:
          platform: linux
          inputs: [{ name: source }]
          outputs: [{ name: notify }]
          caches:
            - path: /pipcache
            - path: /eval-cache
          run:
            path: bash
            args:
              - -ec
              - |
                set -uo pipefail
                apt-get update -qq && apt-get install -y -qq git >/dev/null
                cd source

                if [ ! -f scripts/run_prompt_evals.py ]; then
                  echo "=================================================="
                  echo "NO PROMPT EVAL RUNNER."
                  echo "scripts/run_prompt_evals.py is absent, so no prompt"
                  echo "was evaluated. This green tick says nothing about"
                  echo "prompt quality."
                  echo "=================================================="
                  exit 0
                fi

                git config --global --add safe.directory "$PWD"
                pip install --quiet -r backend/requirements.txt

                if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
                  echo "No Claude key configured: rubric fixtures report as"
                  echo "skipped and the gate scores the deterministic graders"
                  echo "only. A narrower check, not a passing rubric run."
                fi

                # `set +e` is load-bearing: this task runs under `bash -ec`,
                # so errexit is on before the first line and `set -uo pipefail`
                # above turns pipefail ON without turning errexit OFF. A
                # failing `run_prompt_evals | tee` would kill the shell at the
                # pipe, before ${PIPESTATUS} could be read - so the exit-2
                # branch below, which exists to distinguish a broken harness
                # from a real regression, could never be reached.
                set +e
                python scripts/run_prompt_evals.py --base-ref HEAD~1 2>&1 | tee /tmp/evals.log
                rc=${PIPESTATUS[0]}
                set -e

                TAIL=$(tail -3 /tmp/evals.log | tr -s '[:space:]' ' ' | cut -c1-200)

                # PS-1: reported to Mykronos, not only to TheHub's own
                # lifecycle. Evaluation coverage is one of the three concerns
                # D-047 puts under the `ai` capability - the other two being
                # prompt-injection surface and model provenance, which the
                # `ai-models` lane covers. Two `ai` ScanRuns per commit under
                # different tool names is intended: each answers for itself,
                # and the coverage cross-check takes the newest.
                #
                # Tolerated failure throughout. The eval gate is this job's
                # product; a reporting problem must not become a second
                # failure on top of a real one.
                (
                  set +e
                  pip install --quiet "mykronos @ git+https://github.com/ToddGBenson/mykronos@${MYKRONOS_REF}#subdirectory=backend"
                  mkdir -p ../results
                  python -m mykronos.junit_stage \
                    --out ../results/prompt-evals.xml --suite prompt-evals \
                    --case "prompt-evals:${rc}:/tmp/evals.log"
                  python -m mykronos.upload \
                    --capability ai --tool mykronos-ai-checks \
                    --results-path ../results \
                    --ingestion-url "$MYKRONOS_URL" --token "$MYKRONOS_TOKEN" \
                    --repo ToddGBenson/TheHub \
                    --commit-sha "$(git rev-parse HEAD)" \
                    --branch "$SCANNED_BRANCH" --workspace "$PWD" \
                    --severity-threshold low --blocking false
                ) || echo "::warning::Could not report the eval result to Mykronos; the gate below still stands."

                # deploy.sh's semantics, kept on purpose. Exit 2 is the runner
                # failing to run - a broken harness, an unreachable judge -
                # which is not evidence of a prompt regression and must not be
                # reported as one. Any other non-zero is a measured regression
                # against the baseline and fails the job.
                if [ "$rc" -eq 2 ]; then
                  echo "::warning::Prompt eval harness could not run: $TAIL"
                  printf '%s' "*TheHub*: prompt eval harness error, not a regression" > ../notify/message.txt
                  exit 0
                fi
                if [ "$rc" -ne 0 ]; then
                  echo "::error::Prompt eval regression against the baseline in"
                  echo "          backend/tests/eval_fixtures/eval_thresholds.yaml"
                  printf '%s' "*TheHub*: prompt eval regression - $TAIL" > ../notify/message.txt
                  exit "$rc"
                fi
                echo "Prompt evals passed: $TAIL"
  # -- The API inventory is a contract, not a document ---------------------
  #
  # docs/api/inventory.json lists all ~1,739 operations The Hub exposes. It is
  # generated from the running application's own OpenAPI document, so it is
  # correct by construction -- but only at the moment it is generated.
  #
  # This job regenerates it against the demo instance the deploy just built
  # and fails if it differs from what is committed. That is the whole point:
  # the surface cannot change without the change appearing in a diff that a
  # person reviews. Without it the inventory is a snapshot that quietly ages
  # into a confident lie, which is worse than having no inventory at all
  # because people trust it (i2i 2026-08-13, API-1).
  #
  # After deploy-demo rather than off source, because it reads the API from a
  # running instance and the instance has to be the one built from this commit.
  - name: api-inventory
    public: true
    serial_groups: [worker]
    on_success:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: api_inventory, STATUS: success, TARGET_ENV: demo }
    on_failure:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: api_inventory, STATUS: failed, TARGET_ENV: demo }
    on_error:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: api_inventory, STATUS: errored, TARGET_ENV: demo }
    on_abort:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: api_inventory, STATUS: aborted, TARGET_ENV: demo }
    plan:
      - get: source
        trigger: true
        passed: [deploy-demo]
      - get: python
      - *preflight
      - task: check-inventory
        timeout: 20m
        image: python
        params:
          <<: *mykronos_env
          TARGET_URL: ((thehub-demo-url))
        config:
          platform: linux
          inputs: [{ name: source }]
          outputs: [{ name: results }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -uo pipefail
                apt-get update -qq && apt-get install -y -qq git >/dev/null
                cd source

                # PS-1: this lane ran on every deploy and told Mykronos
                # nothing. It reported its stage to TheHub's own lifecycle and
                # stopped there, so the platform that is supposed to hold every
                # repository's coverage had no evidence the API surface was
                # ever checked. `qa`/`junit` for the same reason the lint lane
                # uses it: one registered adapter for the capability
                # (`adapters/registry.py`), and quality stages record a run and
                # never a finding (D-046).
                #
                # No dependencies for the check itself: the generator uses only
                # the standard library, precisely so this job needs nothing
                # installed and cannot fail for a reason unrelated to the API.
                rc=0
                python scripts/api_inventory.py --url "$TARGET_URL" --check 2>&1 \
                  | tee /tmp/inventory.txt
                rc=${PIPESTATUS[0]}

                if [ "$rc" -eq 0 ]; then
                  echo "The committed inventory matches the deployed API."
                fi

                pip install --quiet "mykronos @ git+https://github.com/ToddGBenson/mykronos@${MYKRONOS_REF}#subdirectory=backend"
                python -m mykronos.junit_stage \
                  --out ../results/api-inventory.xml --suite api-inventory \
                  --case "inventory:${rc}:/tmp/inventory.txt"
                python -m mykronos.upload \
                  --capability qa --tool junit \
                  --results-path ../results \
                  --ingestion-url "$MYKRONOS_URL" --token "$MYKRONOS_TOKEN" \
                  --repo ToddGBenson/TheHub \
                  --commit-sha "$(git rev-parse HEAD)" \
                  --branch "$SCANNED_BRANCH" --workspace "$PWD" \
                  --severity-threshold low --blocking false || true

                # Reported either way, then the inventory decides the job.
                exit "$rc"

  # -- Unauthenticated baseline DAST: Demo ----------------------------------
  #
  # zap-baseline.py is spider + passive rules only. It crawls the target and
  # analyses the responses; it does NOT send attack payloads. That is what
  # makes it safe to point at demo -- unlike an active scan, which measured
  # 548% CPU and took production down (D-053), a passive baseline adds ordinary
  # crawl traffic and nothing more.
  #
  # Unauthenticated on purpose: this is the view an anonymous attacker gets.
  # On demo the gate is off, so that is the whole app; on prod the gate is on,
  # so it is the perimeter -- and a scan that confirms the perimeter refuses
  # anonymous callers is a real result, not an empty one.
  - name: dast-demo
    public: true
    serial_groups: [worker]
    on_success:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: dast_headers, STATUS: success, TARGET_ENV: demo }
    on_failure:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: dast_headers, STATUS: failed, TARGET_ENV: demo }
    on_error:
      do:
        - *slack_alert
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: dast_headers, STATUS: errored, TARGET_ENV: demo }
    on_abort:
      do:
        - <<: *hub_report
          params: { <<: *hub_params, STAGE: dast_headers, STATUS: aborted, TARGET_ENV: demo }
    plan:
      - get: source
        trigger: true
        passed: [deploy-demo]
      - get: python
      - get: zap
      - *preflight
      # Scan and upload in ONE task, which is not the obvious shape but is the
      # only one that works here. Concourse creates output volumes owned by
      # root:root 0755 and this image runs as the unprivileged `zap` user with
      # no sudo, so the scan succeeds and then cannot hand its report to a
      # separate upload task ("cp: cannot create regular file
      # 'results/zap.json': Permission denied"). Pre-chmodding the volume from
      # a root task does not help either -- a task's output is a fresh volume,
      # not the same-named input it was given. The ZAP image already carries
      # git, python3 and pip, so the report never has to cross a volume
      # boundary at all.
      - task: zap-baseline
        image: zap
        timeout: 45m
        config:
          platform: linux
          inputs: [{ name: source }]
          params:
            <<: *mykronos_env
            TARGET_URL: ((thehub-demo-url))
          run:
            path: bash
            args:
              - -ec
              - |
                set -uo pipefail

                # Reachability first. A scan of a host that is not answering
                # produces a report with no alerts, which on the dashboard is
                # indistinguishable from a clean scan (L0001). Retried, because
                # a single curl on a loaded worker fails while the target is up.
                if ! curl --fail --silent --max-time 30 \
                     --retry 5 --retry-delay 6 --retry-all-errors \
                     -o /dev/null "$TARGET_URL"; then
                  echo "::error::$TARGET_URL is not answering after retries. Refusing to report an empty scan as clean."
                  exit 1
                fi

                # zap-baseline hardcodes its report directory to /zap/wrk when
                # it runs inside a container, and refuses a file-based report
                # (-J) unless that directory exists. The warning wording says
                # "not mounted", but the actual check is os.path.exists -- so
                # no bind mount is required (a Concourse task cannot provide one
                # anyway); the directory merely has to be there. The image
                # ships without it, so create it and let ZAP write there. /zap
                # is owned by the zap user this image runs as, so mkdir works.
                mkdir -p /zap/wrk

                # -I: informational warnings do not fail the run (the severity
                # decision is Mykronos's, not the scanner's). -m 5: cap the
                # spider at 5 minutes so the crawl is bounded on any target.
                rc=0
                zap-baseline.py -t "$TARGET_URL" -J zap.json -I -m 5 || rc=$?

                # 0 = nothing to report, 1 = a FAIL, 2 = warnings. All results.
                # Anything higher is ZAP itself breaking.
                if [ "$rc" -gt 2 ]; then
                  echo "::error::zap-baseline exited $rc - a scan failure, not a result"
                  exit "$rc"
                fi

                # The report lands in /zap/wrk (base_dir), regardless of cwd.
                test -s /zap/wrk/zap.json || {
                  echo "::error::ZAP wrote no report."
                  exit 1
                }

                # --user because this runs unprivileged; python adds the user
                # site directory to sys.path, so `python3 -m` finds it.
                #
                # --break-system-packages is named alarmingly and does nothing
                # of the sort here: this image is Debian-based, so PEP 668 marks
                # the interpreter externally-managed and pip refuses outright
                # ("This environment is externally managed"). Combined with
                # --user the install goes to ~/.local and touches no system
                # package; the alternative, a venv, needs python3-venv, which
                # would mean apt-get, which needs the root this task does not
                # have. The container is discarded when the scan ends either way.
                #
                # These are checked explicitly rather than relying on `set -e`,
                # which is deliberately off above so a ZAP exit code can be
                # inspected rather than kill the task.
                pip install --quiet --user --break-system-packages \
                  --no-warn-script-location \
                  "mykronos @ git+https://github.com/ToddGBenson/mykronos@${MYKRONOS_REF}#subdirectory=backend" || {
                  echo "::error::Could not install the Mykronos uploader."
                  exit 1
                }

                # Concourse creates the source volume as root and this task runs
                # as `zap`, so git refuses to read it ("detected dubious
                # ownership"). Left alone, rev-parse prints nothing, the upload
                # posts an empty commit_sha, and Mykronos rejects the run with a
                # 422 that reads like a schema bug rather than a permissions
                # one. Marking it safe is correct here: the repository was
                # placed there by the git resource in this same build.
                git config --global --add safe.directory "$PWD/source"
                COMMIT_SHA=$(git -C source rev-parse HEAD)

                # A scan that cannot say what it scanned is not a result (L0001,
                # the same rule the reachability check above enforces).
                test -n "$COMMIT_SHA" || {
                  echo "::error::Could not determine the commit under scan."
                  exit 1
                }

                # DAST findings have no file and no line -- the request is the
                # location -- so --workspace buys nothing beyond consistency.
                python3 -m mykronos.upload \
                  --capability dast --tool zap \
                  --results-path /zap/wrk \
                  --ingestion-url "$MYKRONOS_URL" --token "$MYKRONOS_TOKEN" \
                  --repo ToddGBenson/TheHub \
                  --commit-sha "$COMMIT_SHA" \
                  --branch "$SCANNED_BRANCH" --workspace "$PWD/source" \
                  --severity-threshold low --blocking false || {
                  echo "::error::Uploading the DAST findings to Mykronos failed."
                  exit 1
                }
                echo "ZAP reported $(grep -o '"alert"' /zap/wrk/zap.json | wc -l) alert entries against demo"

