# Mykronos pipeline (spec 15 §3).
#
# Quality gate -> security -> Oracle gate -> build. Each stage passes the same
# checked-out source forward, so every job scans the commit the tests ran on
# rather than whatever main happens to be when it starts.
#
# **This is now the only CI this repository has.** `.github/workflows/` is
# gone (spec 16 §4): its five workflows scanned the identical commits these
# jobs scan, producing findings the ingestion upsert made indistinguishable,
# which D-038 called worse than harmless and then left in place because
# nothing yet ran the full set here. Something does now.
#
# What that costs is real and is not hidden: a pull request from a fork gets no
# checks. Concourse polls a branch, and running an untrusted contributor's code
# on a worker inside the LAN is exactly what spec 14 §4 and spec 15 §7 refuse.
# The day somebody else opens a pull request, the answer is to restore the
# Actions lanes for pull requests only - not to widen what Concourse trusts.
#
# `workflow-templates/` and `actions/upload-results` are untouched. They are
# the platform's product: the workflows installed into *other people's*
# repositories by the Workflow Installer (spec 03).
#
# Nothing sensitive appears here. `((var))` resolves from Concourse's
# credential manager; with none configured, `fly set-pipeline --load-vars-from`
# supplies them from a gitignored file. Neither puts a secret in this file.

resource_types:
  - name: registry-image
    type: registry-image
    source: { repository: concourse/registry-image-resource, tag: "1.10" }

resources:
  - name: source
    type: git
    icon: github
    source:
      uri: https://github.com/ToddGBenson/mykronos.git
      branch: main

  - name: python
    type: registry-image
    icon: language-python
    source: { repository: python, tag: "3.13-slim" }

  # The frontend half of what `ci.yml` used to guard (spec 16 §4). Same major
  # as the workflow pinned, because the generated API client and the build both
  # depend on it.
  - name: checkov
    type: registry-image
    icon: file-cog-outline
    source: { repository: bridgecrew/checkov, tag: "3.2.334" }

  - name: node
    type: registry-image
    icon: nodejs
    source: { repository: node, tag: "24-slim" }

  # Scans the published images out of the registry directly. No daemon and no
  # privileged task: Trivy pulls the image itself.
  - name: trivy
    type: registry-image
    icon: shield-search
    source: { repository: aquasec/trivy, tag: "0.58.1" }

  # Artifact storage (spec 15 §5). S3-compatible rather than a mounted share:
  # this resource handles versioning and retention, and the same pipeline runs
  # unchanged against real S3 later.
  #
  # `regexp` rather than `versioned_file`: MinIO buckets here are not
  # versioned, and the build number in the key is what makes an artifact
  # traceable to the run that produced it.
  - name: wheel
    type: s3
    icon: package-variant-closed
    source:
      endpoint: ((minio-endpoint))
      bucket: mykronos-artifacts
      regexp: wheels/mykronos-(.*)-py3-none-any.whl
      access_key_id: ((minio-access-key))
      secret_access_key: ((minio-secret-key))

  # Kept in its own bucket because its retention differs: artifacts expire
  # after 30 days, an SBOM is evidence and answers a question asked long
  # afterwards.
  - name: sbom
    type: s3
    icon: file-document-outline
    source:
      endpoint: ((minio-endpoint))
      bucket: mykronos-sboms
      regexp: sbom-(.*).cdx.json
      access_key_id: ((minio-access-key))
      secret_access_key: ((minio-secret-key))

anchors:
  # Failure notification. curl rather than a slack-notification resource type:
  # this pipeline already carries no third-party resource types, and adding
  # one to a security pipeline to send a chat message is a poor trade. It also
  # keeps the payload under this file's control, which the insider job depends
  # on - see the note there about what must never be sent.
  #
  # `notify` is an *optional* input. A job that knows more than "it failed"
  # writes a single line to notify/message.txt and that is used verbatim;
  # every other job falls back to its own name. That is what keeps one
  # notification per event instead of a specific one racing a generic one.
  slack_alert: &slack_alert
    task: notify-slack
    config:
      platform: linux
      image_resource:
        type: registry-image
        source: { repository: curlimages/curl, tag: "8.11.1" }
      inputs:
        - name: notify
          optional: true
      params:
        SLACK_WEBHOOK_URL: ((slack-webhook-url))
      run:
        path: sh
        args:
          - -ec
          - |
            # An unset webhook is not an error. The pipeline has to be
            # applicable before Slack is configured, and this hook only ever
            # runs when something has already gone wrong - a missing
            # notification must not become a second failure on top of it.
            if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
              echo "No Slack webhook configured - skipping notification."
              exit 0
            fi

            BUILD_URL="$ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME/builds/$BUILD_NAME"

            if [ -s notify/message.txt ]; then
              TEXT=$(head -1 notify/message.txt)
            else
              TEXT="*Mykronos*: job \`$BUILD_JOB_NAME\` failed (build $BUILD_NAME)"
            fi

            # Escaped with sed because this image has no jq. Single-line
            # messages by construction, so backslash and quote are the only
            # characters that can break the document.
            ESCAPED=$(printf '%s' "$TEXT" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')
            printf '{"text":"%s\\n%s"}' "$ESCAPED" "$BUILD_URL" > payload.json

            curl -sS --max-time 20 -X POST -H 'Content-Type: application/json' \
              -d @payload.json "$SLACK_WEBHOOK_URL" \
              || echo "Slack post failed - the build result stands regardless."
            exit 0

  # Every task that reports findings does this: install the package the
  # GitHub composite action installs, then call the same uploader. The logic
  # lives in `mykronos.upload`, not in the action (DECISIONS D-012), which is
  # the entire reason a second CI system costs almost nothing here.
  mykronos_env: &mykronos_env
    MYKRONOS_URL: ((mykronos-url))
    MYKRONOS_TOKEN: ((mykronos-ingestion-token))
    MYKRONOS_REF: ((mykronos-ref))
    MYKRONOS_GATE_TOKEN: ((mykronos-gate-token))

jobs:
  # -- Stage 1: quality gate (spec 15 §3) ---------------------------------
  #
  # In parallel, and a failure in any one stops everything downstream. There
  # is no value in scanning a commit that does not pass its own tests.

  - name: unit
    public: true
    on_failure: *slack_alert
    on_error: *slack_alert
    plan:
      - get: source
        trigger: true
      - get: python
      - task: pytest
        image: python
        # Worker-local pip cache. These tasks reinstall the same dependency
        # set on every commit; without it each run re-downloads the lot, which
        # is where `unit` spent most of its 19 minutes.
        params:
          <<: *mykronos_env
          PIP_CACHE_DIR: /pipcache
          # The spec 05 section 9 and spec 10 section 6 performance budgets are
          # claims about a developer's machine -- "against a locally running
          # instance", in the spec's own words. This worker is a container
          # inside Docker Desktop on a host also running the Mykronos stack, a
          # registry, MinIO, TheHub's twelve services and up to four pipeline
          # jobs at once. The same commit measured 61.3s on one run and passed
          # on the next two, which is contention rather than code.
          #
          # 3x, and the number is from the measurement rather than a round
          # one: the worst observed run was 61.3s, so a 2x budget of 60s would
          # have failed the very run that motivated this. 90s clears it with
          # margin for a worse day.
          #
          # It still does not absorb a real regression. D-003 replaced a
          # row-by-row insert that took 21 seconds for this batch with a
          # vectorised scan that takes 0.7 -- a 30x difference on that step
          # alone. Anything of that order blows through 90s as easily as
          # through 30. What 3x buys is tolerance of a contended worker, not
          # tolerance of slow code. The job echoes the factor below, so a
          # relaxed budget is never a silent one.
          MYKRONOS_PERF_MULTIPLIER: "3" 
        config:
          platform: linux
          inputs: [{ name: source }]
          caches: [{ path: /pipcache }]
          run:
            path: bash
            args:
              - -ec
              - |
                apt-get update -qq && apt-get install -y -qq git >/dev/null
                cd source/backend
                pip install --quiet -e ".[dev]"

                # Said out loud, every run. A performance budget that was
                # quietly relaxed is a budget nobody knows the value of.
                echo "Performance budgets scaled x${MYKRONOS_PERF_MULTIPLIER:-1}"                      "for this worker (spec 05 section 9 is 30s at x1)."

                # JUnit XML so the result reaches Mykronos as a ScanRun with
                # no findings (D-046). `|| true` on pytest, then the exit code
                # is recovered from the report: a failing suite must still
                # report, because "the tests failed" and "nothing told us
                # anything" are different facts and the second is worse.
                mkdir -p ../../results
                rc=0
                python -m pytest -q --junitxml=../../results/unit.xml || rc=$?

                pip install --quiet "mykronos @ git+https://github.com/ToddGBenson/mykronos@${MYKRONOS_REF}#subdirectory=backend"
                python -m mykronos.upload                   --capability unit --tool junit                   --results-path ../../results                   --ingestion-url "$MYKRONOS_URL" --token "$MYKRONOS_TOKEN"                   --repo ToddGBenson/mykronos                   --commit-sha "$(git -C ../.. rev-parse HEAD)"                   --branch main                   --workspace "$PWD"                   --severity-threshold low --blocking false || true

                exit "$rc"

  - name: lint-and-types
    public: true
    on_failure: *slack_alert
    on_error: *slack_alert
    plan:
      - get: source
        trigger: true
        passed: []
      - get: python
      - task: ruff-and-mypy
        image: python
        # Worker-local pip cache. These tasks reinstall the same dependency
        # set on every commit; without it each run re-downloads the lot, which
        # is where `unit` spent most of its 19 minutes.
        params:
          PIP_CACHE_DIR: /pipcache
        config:
          platform: linux
          inputs: [{ name: source }]
          caches: [{ path: /pipcache }]
          run:
            path: bash
            args:
              - -ec
              - |
                cd source/backend
                pip install --quiet -e ".[dev]"
                python -m ruff check .
                python -m mypy mykronos

  - name: qa-spec-links
    public: true
    on_failure: *slack_alert
    on_error: *slack_alert
    plan:
      - get: source
        trigger: true
      - get: python
      - task: check-links
        image: python
        config:
          platform: linux
          inputs: [{ name: source }]
          run:
            path: bash
            args:
              - -ec
              - |
                cd source
                python scripts/check_links.py

  # The frontend, which had no Concourse lane at all until `ci.yml` was
  # retired: lint, build, and the contract check that matters more than either.
  - name: frontend
    public: true
    on_failure: *slack_alert
    on_error: *slack_alert
    plan:
      - get: source
        trigger: true
      - get: python
      - get: node

      # The generated client is derived from the backend's OpenAPI, so the
      # contract is regenerated here rather than trusted from the committed
      # copy. A backend change that breaks the frontend should fail this job,
      # not surface as a runtime error in a browser.
      - task: dump-openapi
        image: python
        config:
          platform: linux
          inputs: [{ name: source }]
          outputs: [{ name: contract }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -euo pipefail
                cd source/backend
                pip install --quiet -e .
                cd ..
                python scripts/dump_openapi.py "${TARGET}/openapi.json"
                echo "Schema is $(wc -c < "${TARGET}/openapi.json") bytes"
        params:
          TARGET: ../contract

      - task: lint-types-build
        image: node
        config:
          platform: linux
          inputs: [{ name: source }, { name: contract }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -euo pipefail
                cp contract/openapi.json source/frontend/openapi.json
                cd source/frontend
                npm ci

                # Compared as files rather than through `git diff`. node:slim
                # has no git, and the question being asked is whether the
                # committed types match what the schema generates - which is a
                # question about two files, not about the index.
                npx openapi-typescript openapi.json -o /tmp/api-types.d.ts
                if ! diff -q lib/api-types.d.ts /tmp/api-types.d.ts >/dev/null; then
                  echo "::error::The committed API types are out of date."
                  echo "The backend's OpenAPI schema has changed. Regenerate with:"
                  echo "  python scripts/dump_openapi.py frontend/openapi.json"
                  echo "  cd frontend && npx openapi-typescript openapi.json -o lib/api-types.d.ts"
                  diff lib/api-types.d.ts /tmp/api-types.d.ts | head -40
                  exit 1
                fi

                npm run lint
                npm run build

  # -- Stage 2: security (spec 15 §4) -------------------------------------
  #
  # Reports through `python -m mykronos.upload`, the same module the composite
  # action calls. `--workspace` is not optional: without it findings record the
  # runner's absolute paths, which are not clickable and, because identity
  # derives from the path, change every time the checkout moves.

  - name: secrets
    public: true
    on_failure: *slack_alert
    on_error: *slack_alert
    plan:
      - get: source
        trigger: true
        passed: [unit, lint-and-types, qa-spec-links, frontend]
      - get: python
      - task: gitleaks
        image: python
        params: *mykronos_env
        config:
          platform: linux
          inputs: [{ name: source }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -uo pipefail
                cd source
                mkdir -p /tmp/results
                apt-get update -qq && apt-get install -y -qq curl git >/dev/null
                curl -sSfL -o /tmp/gitleaks.tar.gz \
                  https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
                tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
                /tmp/gitleaks detect --source . --report-format json \
                  --report-path /tmp/results/gitleaks.json --redact --exit-code 0 --no-banner

                pip install --quiet "mykronos @ git+https://github.com/ToddGBenson/mykronos@${MYKRONOS_REF}#subdirectory=backend"
                python -m mykronos.upload \
                  --capability secrets --tool gitleaks \
                  --results-path /tmp/results \
                  --ingestion-url "$MYKRONOS_URL" --token "$MYKRONOS_TOKEN" \
                  --repo ToddGBenson/mykronos \
                  --commit-sha "$(git rev-parse HEAD)" \
                  --branch main --workspace "$PWD" \
                  --severity-threshold low --blocking false

  - name: dependencies
    public: true
    on_failure: *slack_alert
    on_error: *slack_alert
    plan:
      - get: source
        trigger: true
        passed: [unit, lint-and-types, qa-spec-links, frontend]
      - get: python
      - task: osv-scanner
        image: python
        params: *mykronos_env
        config:
          platform: linux
          inputs: [{ name: source }]
          outputs: [{ name: evidence }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -uo pipefail
                cd source
                mkdir -p /tmp/results
                apt-get update -qq && apt-get install -y -qq curl git >/dev/null

                # The released Go binary, checksummed. `pip install
                # osv-scanner` installs a reserved-name placeholder with no
                # CLI, which is how this lane reported zero findings for its
                # entire first life.
                curl -sSfL -o /usr/local/bin/osv-scanner \
                  https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64
                echo "edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c  /usr/local/bin/osv-scanner" \
                  | sha256sum -c -
                chmod +x /usr/local/bin/osv-scanner

                # Exit 1 means vulnerabilities were found, which is a result.
                # Anything else is a scan failure and must not read as a clean
                # supply chain.
                rc=0
                osv-scanner scan source --recursive --no-resolve \
                  --format sarif --output-file /tmp/results/osv.sarif . || rc=$?
                if [ "$rc" -gt 1 ]; then
                  echo "::error::osv-scanner exited $rc - that is a failure, not a result"
                  exit "$rc"
                fi

                # A second copy in JSON, because the counts the trust score is
                # built from are not derivable from the SARIF. Tolerant of a
                # failure here: it costs the evidence step, not the findings.
                osv-scanner scan source --recursive --no-resolve \
                  --format json --all-packages --output-file /tmp/osv.json . || true
                test -f /tmp/osv.json || echo '{"results":[]}' > /tmp/osv.json
                cp /tmp/osv.json ../evidence/osv.json

                pip install --quiet "mykronos @ git+https://github.com/ToddGBenson/mykronos@${MYKRONOS_REF}#subdirectory=backend"
                python -m mykronos.upload \
                  --capability atlas --tool osv-scanner \
                  --results-path /tmp/results \
                  --ingestion-url "$MYKRONOS_URL" --token "$MYKRONOS_TOKEN" \
                  --repo ToddGBenson/mykronos \
                  --commit-sha "$(git rev-parse HEAD)" \
                  --branch main --workspace "$PWD" \
                  --severity-threshold low --blocking false

      # Supply-chain evidence (spec 07). This only ever existed in
      # `mykronos-atlas.yml`: Concourse uploaded the *findings* and never the
      # SBOM or the trust score, so the dashboard's SSCS panel had nothing to
      # show for any commit this pipeline built.
      #
      # It sits here rather than in `build` for a reason that matters: Oracle
      # reads Atlas evidence, and evidence produced after the gate is evidence
      # the gate could not use. It also means one syft run instead of two.
      - task: sbom-and-evidence
        image: python
        params: *mykronos_env
        config:
          platform: linux
          inputs: [{ name: source }, { name: evidence }]
          outputs: [{ name: sbom-out }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -euo pipefail
                apt-get update -qq && apt-get install -y -qq curl jq git >/dev/null
                pip install --quiet "mykronos @ git+https://github.com/ToddGBenson/mykronos@${MYKRONOS_REF}#subdirectory=backend"

                SHA=$(git -C source rev-parse HEAD)
                SHORT=$(git -C source rev-parse --short HEAD)

                # Syft, pinned. `cyclonedx-py environment` documents the
                # interpreter this task runs in rather than the repository --
                # a plausible SBOM of entirely the wrong software, which is how
                # it shipped in the Atlas workflow.
                curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
                  | sh -s -- -b /usr/local/bin v1.51.0 >/dev/null
                syft scan dir:source \
                  --exclude './**/node_modules' --exclude './**/.venv' \
                  --exclude './**/venv' --exclude './**/vendor' \
                  --output cyclonedx-json > "sbom-out/sbom-${SHORT}.cdx.json"

                COMPONENTS=$(jq '((.components // []) | length)' "sbom-out/sbom-${SHORT}.cdx.json")
                echo "SBOM lists $COMPONENTS component(s)"
                if [ "$COMPONENTS" -eq 0 ]; then
                  # An SBOM with nothing in it is not evidence, and archiving
                  # one is worse than recording none: the dashboard would show
                  # an SBOM present for a file describing no software.
                  echo "::error::SBOM has no components; refusing to publish an empty one."
                  exit 1
                fi

                SBOM_REF=$(curl --fail --silent --show-error --max-time 60 \
                  -X POST "$MYKRONOS_URL/api/ingest/raw?scan_run_id=${SHA}&capability=atlas&filename=sbom.json" \
                  -H "Authorization: Bearer $MYKRONOS_TOKEN" \
                  -H "Content-Type: application/octet-stream" \
                  --data-binary "@sbom-out/sbom-${SHORT}.cdx.json" | jq -r '.raw_output_ref')

                # Counts, not a score. The trust formula lives in the platform
                # so it is reproducible and cannot drift between CI systems
                # (spec 07 §5, §7).
                ECOSYSTEMS=$(python -m mykronos.atlas_counts evidence/osv.json)

                PROVENANCE=$(jq -nc \
                  --arg builder "concourse" \
                  --arg repo "ToddGBenson/mykronos" \
                  --arg commit "$SHA" \
                  --arg run_id "${BUILD_ID:-unknown}" \
                  --arg runner "linux-amd64" \
                  --arg workflow "${BUILD_PIPELINE_NAME:-mykronos}/${BUILD_JOB_NAME:-dependencies}" \
                  '{builder_id: $builder, source_repo: $repo, source_commit: $commit,
                    build_run_id: $run_id, runner: $runner, workflow: $workflow}')

                BODY=$(jq -nc \
                  --arg commit "$SHA" \
                  --arg sbom "$SBOM_REF" \
                  --argjson ecosystems "$ECOSYSTEMS" \
                  --argjson provenance "$PROVENANCE" \
                  '{commit_sha: $commit, ecosystems: $ecosystems, provenance: $provenance}
                   + (if $sbom == "" or $sbom == "null" then {} else {sbom_ref: $sbom} end)')

                curl --fail --silent --show-error --max-time 60 \
                  -X POST "$MYKRONOS_URL/api/ingest/atlas" \
                  -H "Authorization: Bearer $MYKRONOS_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "$BODY" > out.json

                TRUST=$(jq -r '.trust_score' out.json)
                DEPS=$(jq -r '.dependency_count' out.json)
                VULN=$(jq -r '.vulnerable_dependency_count' out.json)

                # Null rather than a number means the scan resolved nothing
                # (spec 07 §5a). Saying "not assessed" is the entire point of
                # that change; printing `null/100` would undo it.
                if [ "$TRUST" = "null" ]; then
                  echo "Supply-chain trust: NOT ASSESSED - no dependencies were resolved."
                else
                  echo "Supply-chain trust: $TRUST/100 ($VULN vulnerable of $DEPS dependencies)"
                  if [ "$(jq -r '.below_minimum' out.json)" = "true" ]; then
                    echo "::warning::Trust score $TRUST is below this repository's floor of $(jq -r '.min_trust_score' out.json)."
                  fi
                fi

      - put: sbom
        params: { file: sbom-out/sbom-*.cdx.json }

  # Replaces `mykronos-sast.yml`, and not like for like: that workflow ran
  # CodeQL, which is unavailable here. Its CLI wants a multi-hundred-megabyte
  # bundle per language on every run, and its licence covers Actions on public
  # repositories and GHAS customers rather than a self-hosted worker. Semgrep
  # is spec 04 §3's registered secondary, emits SARIF, and installs from PyPI.
  #
  # `--tool semgrep` is explicit rather than defaulted, so the lake records
  # which analyser produced each finding. Expect findings to appear and
  # disappear across the cutover: that is a tool change, not a change in this
  # code's security. Spec 16 §5.
  - name: sast
    public: true
    on_failure: *slack_alert
    on_error: *slack_alert
    plan:
      - get: source
        trigger: true
        passed: [unit, lint-and-types, qa-spec-links, frontend]
      - get: python
      - task: semgrep
        image: python
        params: *mykronos_env
        config:
          platform: linux
          inputs: [{ name: source }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -uo pipefail
                cd source
                mkdir -p /tmp/results
                apt-get update -qq && apt-get install -y -qq git >/dev/null

                # setuptools is not optional here despite not being a semgrep
                # dependency, and the version bound is not caution. Python
                # 3.13 images stopped shipping setuptools, and semgrep's
                # opentelemetry instrumentation imports pkg_resources at
                # module load - so semgrep dies with ModuleNotFoundError
                # before parsing an argument. Installing plain `setuptools`
                # does not fix it: 81 removed pkg_resources, so the newest
                # release reintroduces the exact error it was added to solve.
                #
                # The upload reported a failed scan rather than clean code,
                # which is the only reason any of this was visible.
                pip install --quiet "setuptools<81" semgrep==1.97.0

                # Rule packs download from semgrep.dev; the source stays here.
                # `--config auto` is deliberately not used - it reports the
                # repository to semgrep.dev, which is the class of thing spec
                # 12 §5.2 makes opt-in.
                rc=0
                semgrep scan \
                  --config p/security-audit \
                  --config p/owasp-top-ten \
                  --sarif --output /tmp/results/semgrep.sarif \
                  --metrics off --quiet . || rc=$?

                # 1 means findings, which is a result. Anything else is a scan
                # failure and must not read as clean code.
                if [ "$rc" -gt 1 ]; then
                  echo "::error::semgrep exited $rc - a scan failure, not a result"
                  exit "$rc"
                fi

                pip install --quiet "mykronos @ git+https://github.com/ToddGBenson/mykronos@${MYKRONOS_REF}#subdirectory=backend"
                python -m mykronos.upload \
                  --capability sast --tool semgrep \
                  --results-path /tmp/results \
                  --ingestion-url "$MYKRONOS_URL" --token "$MYKRONOS_TOKEN" \
                  --repo ToddGBenson/mykronos \
                  --commit-sha "$(git rev-parse HEAD)" \
                  --branch main --workspace "$PWD" \
                  --severity-threshold low --blocking false

  # Replaces `mykronos-aegis.yml`. That workflow ran on `pull_request` and
  # `pull_request_review`; Concourse sees a branch, so the pull request that
  # introduced the commit is looked up instead. Spec 16 §6 is the full
  # explanation.
  #
  # Unauthenticated: this repository is public, and the App is not installed on
  # it (D-007). That buys a 60-requests-per-hour limit, which two calls per
  # build sits well inside. If the limit is ever hit the lookup fails, the job
  # takes the no-pull-request path below, and nothing is recorded - which is
  # the honest outcome and is announced rather than inferred.
  - name: insider
    public: true
    on_failure: *slack_alert
    on_error: *slack_alert
    plan:
      - get: source
        trigger: true
        passed: [unit, lint-and-types, qa-spec-links, frontend]
      - get: python
      - task: aegis
        image: python
        params: *mykronos_env
        config:
          platform: linux
          inputs: [{ name: source }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -uo pipefail
                apt-get update -qq && apt-get install -y -qq curl jq git >/dev/null
                cd source
                git config --global --add safe.directory "$PWD"

                SHA=$(git rev-parse HEAD)
                API=https://api.github.com/repos/ToddGBenson/mykronos

                curl --fail --silent --show-error --max-time 30 \
                  -H "Accept: application/vnd.github.v3+json" \
                  "$API/commits/$SHA/pulls" > pulls.json || echo '[]' > pulls.json

                PR=$(jq -r 'if type == "array" and length > 0 then .[0].number else "" end' pulls.json)

                if [ -z "$PR" ] || [ "$PR" = "null" ]; then
                  echo "=================================================="
                  echo "NO PULL REQUEST FOR $SHA."
                  echo "This commit reached main without one, so there are no"
                  echo "reviews to have integrity, no base ref to measure an"
                  echo "author baseline against, and no description to check"
                  echo "for AI disclosure."
                  echo ""
                  echo "NO INSIDER-RISK ASSESSMENT WAS RECORDED. Submitting"
                  echo "one anyway would score 0/100 for exactly the case"
                  echo "Aegis exists to notice."
                  echo "=================================================="
                  exit 0
                fi

                # Errexit from here on. Up to this point a failed fetch is a
                # tolerated outcome that takes the no-pull-request path; past
                # it, every call is one whose failure would produce an
                # assessment built from an empty payload - a null author and no
                # signals, which posts as a clean 0/100.
                set -e

                echo "Assessing pull request #$PR"
                curl --fail --silent --show-error --max-time 30 \
                  -H "Accept: application/vnd.github.v3+json" \
                  "$API/pulls/$PR" > pr.json

                AUTHOR=$(jq -r '.user.login' pr.json)
                BASE=$(jq -r '.base.ref' pr.json)
                # A PR description is attacker-controlled text. Written to a
                # file and passed by path, never interpolated into a command.
                jq -r '.body // ""' pr.json > pr-body.txt

                curl --fail --silent --show-error --max-time 30 \
                  -H "Accept: application/vnd.github.v3+json" \
                  "$API/pulls/$PR/reviews" > reviews.json || echo '[]' > reviews.json

                # The base branch is not fetched by the git resource, and the
                # author-baseline signal compares against it. Without this the
                # signal is skipped rather than guessed (spec 06 §7).
                git fetch --quiet origin "$BASE" || true

                pip install --quiet "mykronos @ git+https://github.com/ToddGBenson/mykronos@${MYKRONOS_REF}#subdirectory=backend"

                python -m mykronos.aegis_signals \
                  --pr-number "$PR" \
                  --commit-sha "$SHA" \
                  --author "$AUTHOR" \
                  --base-ref "FETCH_HEAD" \
                  --head-ref "$SHA" \
                  --pr-body-file pr-body.txt \
                  --reviews-file reviews.json \
                  --sensitive-path '**/auth/**' \
                  --sensitive-path '**/*secret*' \
                  --sensitive-path '**/.github/workflows/**' \
                  --sensitive-path '**/iam/**' \
                  > signals.json

                echo "Signals observed:"
                jq -r '.signals[] | "  \(.key): \(.rationale)"' signals.json

                curl --fail --silent --show-error --max-time 60 \
                  -X POST "$MYKRONOS_URL/api/ingest/aegis" \
                  -H "Authorization: Bearer $MYKRONOS_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d @signals.json > result.json

                echo "Aegis: $(jq -r '.recommendation' result.json) at $(jq -r '.insider_risk_score' result.json)/100"

                if [ "$(jq -r '.blocking' result.json)" = "true" ] \
                   && [ "$(jq -r '.recommendation' result.json)" = "block_recommended" ]; then
                  echo "::error::Aegis recommends blocking and blocking is enabled for this repository."
                  exit 1
                fi

  # -- IaC: the configuration nobody was scanning (spec 04 section 3) ------
  #
  # The platform defines ten capabilities and registers checkov as the `iac`
  # scanner, and neither pipeline ran it. Both repositories are substantially
  # infrastructure: Dockerfiles, compose files, an nginx config, and in this
  # one the Concourse pipelines themselves. A privileged container, a bound
  # 0.0.0.0 port or a missing USER directive is exactly the class of finding
  # SAST cannot see, because it is not in the application code.
  #
  # This is the gap a coverage review found rather than a failure: nothing was
  # red, the capability simply had no lane and the dashboard column for it had
  # always been empty.
  - name: iac
    public: true
    on_failure: *slack_alert
    on_error: *slack_alert
    plan:
      - get: source
        trigger: true
        passed: [unit, lint-and-types, qa-spec-links, frontend]
      - get: python
      - get: checkov
      - task: scan-iac
        image: checkov
        config:
          platform: linux
          inputs: [{ name: source }]
          outputs: [{ name: results }]
          run:
            path: sh
            args:
              - -ec
              - |
                set -eu
                cd source

                # Frameworks named rather than autodetected. Checkov will
                # happily look for Terraform, CloudFormation and Helm, none of
                # which exist here, and each guess is time spent on a result
                # that cannot exist.
                #
                # `docker_compose` is deliberately absent because it is not a
                # checkov framework -- the first version passed it and checkov
                # refused the whole run with "Invalid frameworks specified".
                # Checkov's own list is dockerfile, github_actions, kubernetes,
                # terraform and friends; compose is not among them.
                #
                # So compose files are NOT covered by this lane, and nothing
                # else covers them either. That is a real gap in IaC coverage
                # rather than a scanner setting, and it is written here so the
                # green tick is not read as "the compose files were checked".
                #
                # --soft-fail because the severity gate belongs to Mykronos and
                # this repository's configured threshold, not to the scanner
                # (spec 04 section 5). A findings-driven exit code here would
                # take the decision away from the platform that owns it.
                OUT=$(mktemp -d)
                checkov --directory . \
                  --framework dockerfile github_actions \
                  --output sarif --output-file-path "$OUT" \
                  --soft-fail --compact --quiet

                # Written to a temp dir and copied out: this image does not run
                # as root and an output volume's ownership is not something to
                # bet a scan on.
                ls "$OUT"/*.sarif >/dev/null 2>&1 || {
                  echo "::error::checkov wrote no SARIF - the scan did not run."
                  exit 1
                }
                cp "$OUT"/*.sarif ../results/

      - task: upload
        image: python
        params: *mykronos_env
        config:
          platform: linux
          inputs: [{ name: source }, { name: results }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -euo pipefail
                apt-get update -qq && apt-get install -y -qq git >/dev/null
                pip install --quiet "mykronos @ git+https://github.com/ToddGBenson/mykronos@${MYKRONOS_REF}#subdirectory=backend"
                python -m mykronos.upload \
                  --capability iac --tool checkov \
                  --results-path results \
                  --ingestion-url "$MYKRONOS_URL" --token "$MYKRONOS_TOKEN" \
                  --repo ToddGBenson/mykronos \
                  --commit-sha "$(git -C source rev-parse HEAD)" \
                  --branch main --workspace "$PWD/source" \
                  --severity-threshold low --blocking false

  # -- Stage 3: the gate (spec 15 §3, and spec 16 §3 for the ordering) ----
  #
  # Oracle now runs *after* the image is built, published and scanned, rather
  # than before. That is the change spec 16 §3 already made for TheHub, and it
  # is here for a harder reason than symmetry: the old order deadlocked.
  #
  #   oracle-gate <- code scans          build      <- oracle-gate
  #   publish     <- build               containers <- publish
  #
  # Container findings fed the gate, and clearing them needs a rebuild that sat
  # behind that gate. Every commit was refused at no_go 100/100 on 338 findings
  # that were all `containers`, and the fix for them -- a new base image -- could
  # not be built because the findings blocked the build. The gate was holding
  # shut against its own remedy.
  #
  # Build is a file. Publishing is a tag nothing deploys on its own; the deploy
  # is `deploy.ps1` on the host, run by a person (D-038). So gating the build
  # bought nothing and cost the ability to ever improve an image.
  #
  # After every security job, never alongside them. Oracle scores the whole
  # picture (spec 09 §8); gating on a partial one produces a decision the next
  # finding invalidates.

  - name: oracle-gate
    public: true
    on_failure: *slack_alert
    on_error: *slack_alert
    plan:
      - get: source
        trigger: true
        passed: [secrets, dependencies, sast, insider, containers, iac]
      - get: python
      - task: evaluate
        image: python
        params: *mykronos_env
        config:
          platform: linux
          inputs: [{ name: source }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -euo pipefail
                cd source
                apt-get update -qq && apt-get install -y -qq curl jq git >/dev/null

                # No repo_full_name: it comes from the ingestion token, so a
                # pipeline cannot request a decision about somebody else's
                # repository. The endpoint forbids extra fields, so sending it
                # is a 422 rather than a harmless duplicate.
                BODY=$(jq -nc \
                  --arg sha "$(git rev-parse HEAD)" \
                  '{commit_sha: $sha, decision_type: "portfolio"}')

                curl --fail --silent --show-error --max-time 120 \
                  -X POST "$MYKRONOS_URL/api/oracle/evaluate" \
                  -H "Authorization: Bearer $MYKRONOS_TOKEN" \
                  -H "X-Hub-Token: $MYKRONOS_GATE_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "$BODY" > decision.json

                RECOMMENDATION=$(jq -r '.recommendation' decision.json)
                SCORE=$(jq -r '.overall_risk_score' decision.json)
                echo "Oracle: $RECOMMENDATION (score $SCORE)"
                jq -r '.reasoning // empty' decision.json

                if [ "$RECOMMENDATION" = "no_go" ]; then
                  echo "Oracle says no_go - stopping before build."
                  exit 1
                fi

  # -- Promotion: what makes the Oracle gate mean anything ----------------
  #
  # Until this existed, publish pushed `:latest`, deploy.ps1 pulled `:latest`,
  # and nothing depended on oracle-gate. A no_go changed nothing an operator
  # would meet: the refused build already sat under the tag the deploy script
  # reads. The gate was decoration.
  #
  # Build and publish still run ahead of the gate on purpose (D-045) -- an
  # image has to exist before it can be scanned, and gating the build is what
  # deadlocked this pipeline against its own container findings. What is gated
  # is the *pointer*: images publish by commit SHA, are scanned by SHA, and
  # `:latest` moves only once Oracle has passed.
  #
  # A refused commit therefore leaves an image in the registry that nothing
  # points at, which is the shape spec 16 section 3 already chose for TheHub.
  - name: promote
    public: true
    on_failure: *slack_alert
    on_error: *slack_alert
    plan:
      - get: source
        trigger: true
        passed: [oracle-gate]
      - get: python
      - task: resolve-sha
        image: python
        config:
          platform: linux
          inputs: [{ name: source }]
          outputs: [{ name: meta }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -euo pipefail
                apt-get update -qq && apt-get install -y -qq git >/dev/null
                git -C source rev-parse HEAD | tr -d '\n' > meta/sha

      - task: promote-tags
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: gcr.io/go-containerregistry/crane
              tag: debug
          inputs: [{ name: meta }]
          params:
            REGISTRY: ((registry))
          run:
            path: /busybox/sh
            args:
              - -ec
              - |
                SHA=$(cat meta/sha)
                for image in mykronos-backend mykronos-frontend; do
                  echo "Promoting ${image}:${SHA} -> :latest"
                  /ko-app/crane tag --insecure "${REGISTRY}/${image}:${SHA}" latest
                done

  # -- Stage 4: build (spec 15 §3) ----------------------------------------

  - name: build
    public: true
    on_failure: *slack_alert
    on_error: *slack_alert
    plan:
      - get: source
        trigger: true
        passed: [unit, lint-and-types, qa-spec-links, frontend]
      - get: python
      - task: build-backend
        image: python
        config:
          platform: linux
          inputs: [{ name: source }]
          outputs: [{ name: dist }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -euo pipefail
                # git is not in python:3.13-slim and the SHA is read from the
                # checkout rather than from a Concourse variable.
                apt-get update -qq && apt-get install -y -qq git >/dev/null
                cd source/backend
                pip install --quiet build
                python -m build --wheel --outdir "${TARGET}"

                # The commit SHA, not the build number. Concourse's
                # BUILD_NAME was empty in this task and everything landed as
                # `b0`, which is worse than useless: it looks like a version.
                # The SHA is also the better key - it identifies the exact
                # code, and it is what the scan runs and the Oracle decision
                # for this artifact are already keyed on.
                cd ../..
                SHA=$(git -C source rev-parse --short HEAD)
                cd source/backend
                for wheel in "${TARGET}"/*.whl; do
                  base=$(basename "$wheel" .whl)
                  mv "$wheel" "${TARGET}/${base%%-py3-none-any}+${SHA}-py3-none-any.whl"
                done
                ls -l "${TARGET}"
        params:
          TARGET: ../../dist

      # The SBOM moved to the `dependencies` job, where Oracle can still see
      # it: evidence produced after the gate is evidence the gate could not
      # use. This job keeps the wheel, which is the artifact rather than the
      # evidence, and their retentions differ for that reason (spec 15 5).
      - put: wheel
        params: { file: dist/mykronos-*.whl }

  # -- Stage 5: publish (spec 15 §3, D-038) -------------------------------
  #
  # Only after the Oracle gate. An image built from a commit Oracle refused is
  # an image somebody could deploy by accident.
  #
  # kaniko, not oci-build-task. The latter runs buildkitd, which needs cgroup
  # delegation this worker cannot give it -- Concourse is itself a container
  # on Docker Desktop, and buildkit failed with "setup cgroups: exit status 1"
  # even though privileged tasks can otherwise mount fine. kaniko builds
  # without a daemon and without cgroups, which is exactly the constraint.
  #
  # The alternative was mounting the host's Docker socket into the task. That
  # would work, and it would let any pipeline task control this machine -- the
  # risk §7 raises about a worker inside the LAN. A slower builder is the
  # cheaper trade.

  - name: publish-backend
    public: true
    on_failure: *slack_alert
    on_error: *slack_alert
    plan:
      - get: source
        trigger: true
        passed: [build]
      - get: python
      - task: resolve-sha
        image: python
        config:
          platform: linux
          inputs: [{ name: source }]
          outputs: [{ name: meta }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -euo pipefail
                apt-get update -qq && apt-get install -y -qq git >/dev/null
                git -C source rev-parse HEAD | tr -d '\n' > meta/sha
      - task: kaniko
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: gcr.io/kaniko-project/executor
              tag: v1.23.2-debug
          inputs: [{ name: source }, { name: meta }]
          params:
            REGISTRY: ((registry))
          run:
            path: /busybox/sh
            args:
              - -ec
              - |
                # Built from the repository root: the backend reads workflow
                # templates from disk at startup and they live outside
                # backend/.
                SHA=$(cat meta/sha)
                /kaniko/executor                   --context source                   --dockerfile source/backend/Dockerfile                   --destination "${REGISTRY}/mykronos-backend:${SHA}"                   --insecure --skip-tls-verify                   --single-snapshot

  - name: publish-frontend
    public: true
    on_failure: *slack_alert
    on_error: *slack_alert
    plan:
      - get: source
        trigger: true
        passed: [build]
      - get: python
      - task: resolve-sha
        image: python
        config:
          platform: linux
          inputs: [{ name: source }]
          outputs: [{ name: meta }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -euo pipefail
                apt-get update -qq && apt-get install -y -qq git >/dev/null
                git -C source rev-parse HEAD | tr -d '\n' > meta/sha
      - task: kaniko
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: gcr.io/kaniko-project/executor
              tag: v1.23.2-debug
          inputs: [{ name: source }, { name: meta }]
          params:
            REGISTRY: ((registry))
          run:
            path: /busybox/sh
            args:
              - -ec
              - |
                SHA=$(cat meta/sha)
                /kaniko/executor                   --context source/frontend                   --dockerfile source/frontend/Dockerfile                   --destination "${REGISTRY}/mykronos-frontend:${SHA}"                   --insecure --skip-tls-verify                   --single-snapshot

  # -- Stage 5: the images this pipeline just published --------------------
  #
  # The platform builds two images, publishes them, and until now scanned
  # neither - while offering `containers` as a capability to other people's
  # repositories. A platform that reports coverage it does not have is the
  # exact failure it exists to catch.
  #
  # After publish rather than before: you cannot scan an image that does not
  # exist yet. Nothing is gated on the result - these images are already in
  # the registry by the time this runs, and the deploy is a deliberate manual
  # pull (D-038). What this produces is findings in the lake, which is where
  # the decision about them belongs.
  - name: containers
    public: true
    on_failure: *slack_alert
    on_error: *slack_alert
    plan:
      - get: source
        trigger: true
        passed: [publish-backend, publish-frontend]
      - get: python
      - get: trivy

      # The SHA is resolved in a task that has git and handed over as a file.
      # Trivy's image does not ship git, and reading `.git/HEAD` by hand works
      # right up until the ref is packed.
      - task: resolve-sha
        image: python
        config:
          platform: linux
          inputs: [{ name: source }]
          outputs: [{ name: meta }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -euo pipefail
                apt-get update -qq && apt-get install -y -qq git >/dev/null
                git -C source rev-parse HEAD | tr -d '\n' > meta/sha

      - task: scan-images
        image: trivy
        config:
          platform: linux
          inputs: [{ name: meta }]
          outputs: [{ name: results }]
          params:
            REGISTRY: ((registry))
          run:
            path: sh
            args:
              - -ec
              - |
                set -eu

                # The tag publish pushed. Images are published by commit SHA so the
                # scan, the Oracle decision and the promoted tag all name the same
                # artefact rather than whatever `latest` happened to be.
                SHA=$(cat meta/sha)

                # One report per image, and the file names differ on purpose.
                # Container findings once collapsed 600 to 118 because every
                # image was scanned under the same tag, so the same CVE in two
                # different images shared an identity and the second one
                # silently overwrote the first.
                for image in mykronos-backend mykronos-frontend; do
                  echo "Scanning ${REGISTRY}/${image}:${SHA}"
                  # `--insecure` is the registry's TLS, not the scan's rigour:
                  # the registry is plain HTTP on the LAN (spec 15 §5).
                  trivy image "${REGISTRY}/${image}:${SHA}" \
                    --insecure \
                    --scanners vuln \
                    --format sarif --output "results/trivy-${image}.sarif" \
                    --exit-code 0 --quiet \
                    --timeout 30m

                  # An absent or empty report is a failed scan, and the
                  # uploader already treats it as one. Failing here names the
                  # image that broke instead of leaving it to be inferred from
                  # a finding count.
                  test -s "results/trivy-${image}.sarif" || {
                    echo "::error::Trivy wrote no report for ${image} - the scan did not run."
                    exit 1
                  }
                done

      - task: upload
        image: python
        params: *mykronos_env
        config:
          platform: linux
          inputs: [{ name: source }, { name: results }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -euo pipefail
                apt-get update -qq && apt-get install -y -qq git >/dev/null
                pip install --quiet "mykronos @ git+https://github.com/ToddGBenson/mykronos@${MYKRONOS_REF}#subdirectory=backend"
                python -m mykronos.upload \
                  --capability containers --tool trivy \
                  --results-path results \
                  --ingestion-url "$MYKRONOS_URL" --token "$MYKRONOS_TOKEN" \
                  --repo ToddGBenson/mykronos \
                  --commit-sha "$(git -C source rev-parse HEAD)" \
                  --branch main \
                  --workspace "$PWD/source" \
                  --severity-threshold low --blocking false

  # -- Auto-remediation (spec 08) -----------------------------------------
  #
  # Patchwork is a capability this platform offers other people's
  # repositories and has never once run on anything - the workflow template
  # exists, no pipeline calls it, and no repository had the grant.
  #
  # It runs *after* the security lanes, because it reads findings out of the
  # lake rather than from a scanner. The `passed:` list is what guarantees
  # the findings it reads are for this commit rather than the previous one.
  #
  # Two properties this job depends on and does not enforce, both server-side
  # (spec 08 §7): every pull request Patchwork opens is a draft, and the
  # GitHub client it holds exposes no merge operation at all. This job could
  # not make it merge something if it tried to.
  - name: remediate
    public: true
    on_failure: *slack_alert
    on_error: *slack_alert
    plan:
      - get: source
        trigger: true
        passed: [secrets, dependencies, sast, containers]
      - get: python
      - task: patchwork
        image: python
        params:
          MYKRONOS_URL: ((mykronos-url))
          MYKRONOS_TOKEN: ((mykronos-ingestion-token))
        config:
          platform: linux
          inputs: [{ name: source }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -uo pipefail
                apt-get update -qq && apt-get install -y -qq git jq curl >/dev/null
                SHA="$(git -C source rev-parse HEAD)"

                BODY=$(jq -nc --arg sha "$SHA" '{commit_sha: $sha}')

                # --fail-with-body, not --fail: a 4xx here carries the reason
                # in its body - most often that the capability is not granted
                # for this repository - and plain --fail throws that away and
                # reports only the status code.
                rc=0
                curl --fail-with-body --silent --show-error --max-time 300 \
                  -X POST "$MYKRONOS_URL/api/patchwork/run" \
                  -H "Authorization: Bearer $MYKRONOS_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "$BODY" > result.json || rc=$?

                if [ "$rc" -ne 0 ]; then
                  echo "::error::Patchwork run failed:"
                  cat result.json
                  exit "$rc"
                fi

                CONSIDERED=$(jq -r '.findings_considered' result.json)
                OPENED=$(jq -r '.draft_prs_opened' result.json)
                QUEUED=$(jq -r '.queued' result.json)
                echo "Patchwork considered $CONSIDERED finding(s): opened $OPENED draft PR(s), queued $QUEUED"
                jq -r '.by_stage | to_entries[] | "  \(.key): \(.value)"' result.json

                # Toxic combinations are the interesting output and are easy
                # to miss in a stage tally, because the stage they land in -
                # `correlated` - reads like progress rather than a stop.
                COMBOS=$(jq -r '[.events[]? | select(.toxic_combination_id != null)] | length' result.json)
                if [ "${COMBOS:-0}" != "0" ] && [ "${COMBOS:-0}" != "null" ]; then
                  echo "::warning::$COMBOS toxic combination(s) detected - these stop individual fixes and need a person (spec 08 section 2)."
                fi

                # Errors are reported and never fatal. Spec 08 section 8: a
                # pipeline that broke partway still recorded where each
                # finding got to, and failing here would hide that behind a
                # red X.
                if [ "$(jq -r '.errors | length' result.json)" != "0" ]; then
                  jq -r '.errors[]' result.json | while read -r line; do
                    echo "::warning::Patchwork: $line"
                  done
                fi

  # -- Functional tests and proxy-first DAST (PIP-2, PIP-3) ---------------
  #
  # The demo environment is *not* built here, and the first two versions of
  # this job were wrong about that. They started dockerd inside the task and
  # composed the stack up; dockerd never starts on this worker - the same
  # constraint that moved image builds to kaniko - and both runs failed after
  # ten and twenty-four minutes respectively.
  #
  # It is built on the host by deploy/demo/Invoke-DemoRebuild.ps1, where
  # Docker works, and this job reaches it over the network by host IP - the
  # same way every other task reaches the ingestion API. The task itself needs
  # nothing but python and a route.
  #
  # The order is still the whole design:
  #
  #   functional tests *through ZAP* -> spider -> active scan
  #
  # A baseline scan crawls from the landing page and never authenticates. The
  # functional suite already holds a session and walks multi-step flows;
  # proxying it hands ZAP that corpus, and the spider then explores from
  # inside the authenticated surface rather than from the front door.
  - name: demo-and-dast
    public: true
    # One at a time, and this is load-bearing rather than politeness. There is
    # one demo environment and one ZAP daemon on the host, and the job resets
    # ZAP's session so its site tree belongs to this run. Two builds
    # overlapping means the second wipes the first's tree, and the first then
    # fails its active scan with a 400 because the URL it is asking about is
    # no longer known - which is exactly what happened to build 7 when builds
    # 8 and 9 started while it was still scanning.
    serial: true
    on_failure: *slack_alert
    on_error: *slack_alert
    plan:
      - get: source
        trigger: true
        passed: [publish-backend, publish-frontend]
      - get: python
      - task: functional-and-dast
        image: python
        params:
          <<: *mykronos_env
          DEMO_HOST: ((demo-host))
        config:
          platform: linux
          inputs: [{ name: source }]
          outputs: [{ name: results }]
          run:
            path: bash
            args:
              - -ec
              - |
                set -uo pipefail
                apt-get update -qq && apt-get install -y -qq git curl jq >/dev/null
                cd source
                SHA="$(git rev-parse HEAD)"

                FRONTEND="http://${DEMO_HOST}:3200"
                BACKEND="http://${DEMO_HOST}:8201"

                # ZAP serves its API on the same port it proxies, and it
                # decides which you meant from the Host header: anything
                # that is not one of its own names is treated as traffic
                # to forward, and answers 502. Every API call therefore
                # goes *through* the proxy to the pseudo-host `zap`,
                # which is the documented way and the only one that works
                # from another machine.
                ZAP_PROXY="http://${DEMO_HOST}:8290"
                zap_api() { curl -fsS --max-time 60 -x "$ZAP_PROXY" "http://zap$1"; }

                # The environment is somebody else's job to build, so this
                # says so plainly rather than failing with a connection error
                # forty lines later.
                if ! curl -fsS --max-time 10 "$BACKEND/healthz" >/dev/null; then
                  echo "::error::No demo environment at $BACKEND."
                  echo "Rebuild it on the host: deploy/demo/Invoke-DemoRebuild.ps1"
                  exit 1
                fi
                if ! zap_api "/JSON/core/view/version/" >/dev/null; then
                  echo "::error::No ZAP daemon behind $ZAP_PROXY - the proxy is part of the demo stack."
                  exit 1
                fi

                # A stale environment is worse than none: it answers, so the
                # suite passes, and the DAST result describes an application
                # nobody is shipping. The seed writes one repository per run,
                # so an empty portfolio means the rebuild did not seed.
                REPOS=$(curl -fsS --max-time 20 \
                  -H "X-Hub-Token: demo-gate-token-not-a-secret" \
                  -H "Authorization: Bearer demo-admin-token-not-a-secret" \
                  "$BACKEND/api/dashboard/portfolio" | jq '.repos | length')
                echo "Demo environment has ${REPOS} repository(ies)."
                if [ "${REPOS:-0}" -lt 1 ]; then
                  echo "::error::The demo environment is empty - it was never seeded."
                  exit 1
                fi

                # Reset ZAP's session so the site tree belongs to this run.
                # Without it a second run spiders URLs the first one left
                # behind, and the "traffic reached the proxy" check below
                # would pass on somebody else's traffic.
                zap_api "/JSON/core/action/newSession/?name=run-${SHA}&overwrite=true" >/dev/null

                echo "== Functional tests, proxied through ZAP (PIP-2, PIP-3) =="
                pip install --quiet pytest httpx2
                set +e
                HTTP_PROXY="$ZAP_PROXY" HTTPS_PROXY="$ZAP_PROXY" \
                DEMO_FRONTEND_URL="$FRONTEND" DEMO_BACKEND_URL="$BACKEND" \
                  python -m pytest functional -q -p no:cacheprovider \
                    --junitxml=../results/functional.xml
                FUNC_RC=$?
                set -e
                echo "Functional suite exited ${FUNC_RC}"

                URLS=$(zap_api "/JSON/core/view/urls/" | jq '.urls | length')
                echo "ZAP recorded ${URLS} URL(s) from the functional run."

                # A proxy nobody routed through yields an empty site tree, and
                # an active scan of an empty site tree is a clean DAST report
                # of nothing. That is the failure this whole design exists to
                # prevent, so it is fatal rather than a warning.
                if [ "${URLS:-0}" -lt 5 ]; then
                  echo "::error::Only ${URLS} URLs reached the proxy - the functional traffic was not proxied."
                  exit 1
                fi

                # Static chunks are most of a Next.js site tree and none of
                # its attack surface. Excluding them is not a shortcut: the
                # active scan spends its time where a finding can exist, and
                # the first run spent ten minutes reaching 6% mostly on
                # hashed .js files.
                zap_api "/JSON/core/action/excludeFromProxy/?regex=.*/_next/static/.*" >/dev/null || true
                zap_api "/JSON/spider/action/excludeFromScan/?regex=.*/_next/static/.*" >/dev/null || true
                zap_api "/JSON/ascan/action/excludeFromScan/?regex=.*/_next/static/.*" >/dev/null || true

                echo "== Spider, from inside the authenticated surface =="
                zap_api "/JSON/spider/action/scan/?url=${FRONTEND}&recurse=true" >/dev/null
                for _ in $(seq 1 60); do
                  st=$(zap_api "/JSON/spider/view/status/" | jq -r '.status')
                  [ "$st" = "100" ] && break
                  sleep 5
                done
                AFTER=$(zap_api "/JSON/core/view/urls/" | jq '.urls | length')
                echo "Site tree: ${AFTER} URL(s) after spidering, from ${URLS} seeded by the tests."

                echo "== Active scan =="
                # Attack traffic. It goes at the demo environment and nowhere
                # else - the ports are offset from production so a mistyped
                # host cannot reach it.
                if ! zap_api "/JSON/ascan/action/scan/?url=${FRONTEND}&recurse=true" >/dev/null; then
                  echo "::error::ZAP refused to start the active scan for ${FRONTEND}."
                  echo "The usual cause is the URL not being in the site tree - which"
                  echo "means something reset ZAP's session mid-run. This job is serial"
                  echo "for that reason; check whether anything else is driving the"
                  echo "shared ZAP on the demo host."
                  exit 1
                fi
                for _ in $(seq 1 180); do
                  st=$(zap_api "/JSON/ascan/view/status/" | jq -r '.status')
                  [ "$st" = "100" ] && break
                  sleep 10
                done

                zap_api "/OTHER/core/other/jsonreport/" > ../results/zap.json
                test -s ../results/zap.json || {
                  echo "::error::ZAP produced no report."
                  exit 1
                }

                echo "== Uploading =="
                pip install --quiet "mykronos @ git+https://github.com/ToddGBenson/mykronos@${MYKRONOS_REF}#subdirectory=backend"

                python -m mykronos.upload \
                  --capability functional --tool junit \
                  --results-path ../results \
                  --ingestion-url "$MYKRONOS_URL" --token "$MYKRONOS_TOKEN" \
                  --repo ToddGBenson/mykronos \
                  --commit-sha "$SHA" --branch main \
                  --workspace "$PWD" \
                  --severity-threshold low --blocking false || true

                python -m mykronos.upload \
                  --capability dast --tool zap \
                  --results-path ../results \
                  --ingestion-url "$MYKRONOS_URL" --token "$MYKRONOS_TOKEN" \
                  --repo ToddGBenson/mykronos \
                  --commit-sha "$SHA" --branch main \
                  --workspace "$PWD" \
                  --severity-threshold low --blocking false

                # The functional result decides the job. DAST findings are
                # recorded and do not fail it: Oracle gates on them later,
                # which is where a risk decision belongs.
                exit "$FUNC_RC"
