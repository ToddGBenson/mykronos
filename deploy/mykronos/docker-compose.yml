# Mykronos, deployed (spec 15 §2, D-038).
#
# The deploy target decided in D-038: this host, in Docker, behind the
# Cloudflare tunnel that already fronts mykronos.toddbenson.net. Not a new
# idea -- TheHub runs twelve containers here the same way -- and it retires a
# class of failure that cost real time: six manual backend restarts in a
# session, an orphaned dev server degrading for two days, port collisions, and
# a hand-typed bind that a reboot forgets.
#
#   docker compose --env-file ../../backend/.env up -d
#
# The tunnel's ingress already splits this hostname by path: /api, /webhooks,
# /healthz and the docs to 8100, everything else to 3100. The frontend is
# published on 127.0.0.1 only, and so is the backend: Concourse task containers
# reach it through Docker Desktop's host gateway (see its `ports:` below).

name: mykronos

services:
  backend:
    image: ${MYKRONOS_IMAGE_BACKEND:-mykronos-backend:latest}
    container_name: mykronos-backend
    restart: unless-stopped
    # No process here may gain privileges it did not start with (setuid,
    # file capabilities), and it starts with none: both containers run as a
    # non-root user and need no capability to listen above 1024 or read their
    # volumes. Measured 2026-10-05: the backend image's remaining high CVEs
    # with no Debian fix (libacl symlink traversal, systemd-homed) need a
    # privileged caller to matter, and this is what guarantees there is none.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Loopback only (TheHub #60841). Consumers: cloudflared (127.0.0.1:8100),
      # deploy.ps1 (127.0.0.1:8100), Concourse tasks (192.168.65.254:8100),
      # TheHub's backend (host.docker.internal:8100); the frontend uses
      # backend:8100 on the compose network. Concourse tasks resolve through
      # public DNS and have never heard of `host.docker.internal`, so they
      # dial Docker Desktop's host gateway by IP, 192.168.65.254, which lands
      # on this machine's loopback. Measured 2026-10-18: a 127.0.0.1 publish
      # answers there and refuses on the LAN address. Nothing on the LAN
      # reached this anyway: the host firewall has denied 192.168.0.0/24 on
      # this port since F-15.
      - "127.0.0.1:8100:8100"
    environment:
      # Secrets come from --env-file, never from this file. The gate token,
      # the admin token and the webhook secret are all in backend/.env, which
      # is gitignored (spec 12 §2).
      MYKRONOS_GATE_TOKEN: ${MYKRONOS_GATE_TOKEN:?set it in backend/.env}
      MYKRONOS_ADMIN_TOKEN: ${MYKRONOS_ADMIN_TOKEN:?set it in backend/.env}
      MYKRONOS_VIEWER_TOKEN: ${MYKRONOS_VIEWER_TOKEN:-}
      MYKRONOS_GITHUB_WEBHOOK_SECRET: ${MYKRONOS_GITHUB_WEBHOOK_SECRET:-}
      # Spec 35: the Product Owner tab reads and moves TheHub stories. The token is
      # the Hub's own HUB_API_TOKEN value (D-133); empty = "TheHub is not connected".
      MYKRONOS_HUB_API_URL: ${MYKRONOS_HUB_API_URL:-http://host.docker.internal:8000}
      MYKRONOS_HUB_API_TOKEN: ${MYKRONOS_HUB_API_TOKEN:-}
      # Which perimeter token the deployment probe presents, per origin, as a
      # JSON object (TheHub #60918): `{"http://host:port": "@gate"}`. It was
      # never passed, so no configured probe could read build.sha. `{}`, not
      # empty: empty does not parse.
      MYKRONOS_DEPLOYMENT_PROBE_TOKENS: ${MYKRONOS_DEPLOYMENT_PROBE_TOKENS:-{}}
      # Patchwork's bump-image-date fixer lists tags on the registry the
      # image-refresh lanes publish to. That registry is published on this
      # host's loopback, which a container reaches through Docker Desktop's
      # host gateway, the same route as the Hub API above. Empty disables it.
      MYKRONOS_PATCHWORK_IMAGE_REGISTRY: ${MYKRONOS_PATCHWORK_IMAGE_REGISTRY:-http://host.docker.internal:5000}
      # The platform-started independent reviewer (spec 34 sec. 4.3, D-149).
      # Not listed, `MYKRONOS_REVIEWER_MODE=live` in backend/.env read as the
      # code default `shadow` in the container and the key as empty: the
      # routing lesson again. Defaults are the code's, so this is inert until
      # the operator sets them (scripts/enable-agent-reviewer.ps1).
      MYKRONOS_REVIEWER_MODE: ${MYKRONOS_REVIEWER_MODE:-shadow}
      MYKRONOS_REVIEWER_MODEL: ${MYKRONOS_REVIEWER_MODEL:-claude-opus-5-5}
      MYKRONOS_REVIEWER_API_KEY: ${MYKRONOS_REVIEWER_API_KEY:-}
      MYKRONOS_GITHUB_APP_ID: ${MYKRONOS_GITHUB_APP_ID:-}
      # Mounted read-only below. The container never holds a copy.
      MYKRONOS_GITHUB_APP_PRIVATE_KEY_PATH: /secrets/github-app.pem
      MYKRONOS_INGESTION_API_URL: ${MYKRONOS_INGESTION_API_URL:-https://mykronos.toddbenson.net}

      # Reading Concourse back (spec 15 §4a). Two URLs because they genuinely
      # differ: this container reaches Concourse by service name across the
      # shared network below, and a person clicking a link reaches it on
      # loopback. A link to http://concourse:8080 resolves nowhere in a
      # browser, which is the sort of thing that looks fine until somebody
      # clicks it.
      MYKRONOS_CONCOURSE_URL: ${MYKRONOS_CONCOURSE_URL:-http://concourse:8080}
      # Read-only and unauthenticated: /v1/sys/health needs no token and says
      # whether Vault is sealed. Defaulted rather than left to .env because an
      # unset value silently disables the one check that notices a sealed
      # Vault -- which is the state this deployment comes back in after every
      # restart, and which took a day to notice on 2026-08-28 (B-014).
      MYKRONOS_VAULT_URL: ${MYKRONOS_VAULT_URL:-http://vault:8200}
      MYKRONOS_CONCOURSE_EXTERNAL_URL: ${MYKRONOS_CONCOURSE_EXTERNAL_URL:-http://localhost:8080}
      MYKRONOS_CONCOURSE_TEAM: ${MYKRONOS_CONCOURSE_TEAM:-main}

      # Alerting (spec 16 §12). Empty by default and nothing is posted -- but
      # it has to be *passed* to be settable at all, and without these two
      # lines `mykronos.notify` could never fire in the deployed stack no
      # matter what backend/.env said. A notifier that is wired everywhere
      # except the one process that runs is worse than no notifier: it looks
      # configured.
      MYKRONOS_SLACK_WEBHOOK_URL: ${MYKRONOS_SLACK_WEBHOOK_URL:-}
      # Preferred over the webhook above, and used instead of it when both
      # are set. The pipelines already post with a bot token and record
      # why: a webhook's secret lives in the URL path of the endpoint being
      # called, so whatever holds the URL holds the credential, while a bot
      # token lives in an `Authorization:` header Vault can substitute at
      # egress. Both are needed together - a token with no channel posts
      # nowhere, which is the state B-035 exists about.
      MYKRONOS_SLACK_BOT_TOKEN: ${MYKRONOS_SLACK_BOT_TOKEN:-}
      MYKRONOS_SLACK_CHANNEL: ${MYKRONOS_SLACK_CHANNEL:-}
      MYKRONOS_SLACK_NOTIFY_MIN_SEVERITY: ${MYKRONOS_SLACK_NOTIFY_MIN_SEVERITY:-high}
      # The 07:00 briefing DM (TheHub #60864). Posted with the bot token above
      # to a person, not the alert channel; with the target or the dashboard
      # URL empty the `briefing-dm` job records `skipped` and names which.
      MYKRONOS_BRIEFING_DM_CHANNEL: ${MYKRONOS_BRIEFING_DM_CHANNEL:-}
      MYKRONOS_BRIEFING_DM_TIME: ${MYKRONOS_BRIEFING_DM_TIME:-07:00}
      MYKRONOS_BRIEFING_DM_TIMEZONE: ${MYKRONOS_BRIEFING_DM_TIMEZONE:-America/Phoenix}
      MYKRONOS_DASHBOARD_URL: ${MYKRONOS_DASHBOARD_URL:-}

      # #60754: the Slack lesson a third time. docs/OPERATOR-TASKS.md says to
      # set MYKRONOS_DIGEST_ENABLED=true in backend/.env, and none of the lines
      # below were here, so the digest could not be switched on in this stack
      # at all. Every fallback is the code's own default - written out, not
      # left empty, because an empty string is a validation error for a bool,
      # an int or a list and the backend would not start.
      # test_compose_passes_settings.py now diffs .env.example against this
      # block, so the next documented setting cannot be missed the same way.
      MYKRONOS_DIGEST_ENABLED: ${MYKRONOS_DIGEST_ENABLED:-false}
      MYKRONOS_WEEKLY_DIGEST_INTERVAL_SECONDS: ${MYKRONOS_WEEKLY_DIGEST_INTERVAL_SECONDS:-604800}
      # On-demand Concourse builds (spec 17 sec. 2.5). Empty disables dispatch
      # only; the read-only pipeline panel works without it.
      MYKRONOS_CONCOURSE_API_TOKEN: ${MYKRONOS_CONCOURSE_API_TOKEN:-}
      # JSON list, e.g. ["my-app[bot]"]. `[]`, not empty: empty does not parse.
      MYKRONOS_GITHUB_BOT_LOGINS: ${MYKRONOS_GITHUB_BOT_LOGINS:-[]}
      MYKRONOS_COMPACTION_INTERVAL_SECONDS: ${MYKRONOS_COMPACTION_INTERVAL_SECONDS:-300}
      MYKRONOS_MAX_FINDINGS_PER_REQUEST: ${MYKRONOS_MAX_FINDINGS_PER_REQUEST:-10000}
      MYKRONOS_RATE_LIMIT_REQUESTS_PER_MINUTE: ${MYKRONOS_RATE_LIMIT_REQUESTS_PER_MINUTE:-100}
      MYKRONOS_TOKEN_OVERLAP_HOURS: ${MYKRONOS_TOKEN_OVERLAP_HOURS:-24}
      MYKRONOS_ADMIN_IDENTITY: ${MYKRONOS_ADMIN_IDENTITY:-admin}
      MYKRONOS_INSIDER_RISK_DEFAULT_RETENTION_DAYS: ${MYKRONOS_INSIDER_RISK_DEFAULT_RETENTION_DAYS:-90}
      MYKRONOS_KNOWLEDGE_HALF_LIFE_DAYS: ${MYKRONOS_KNOWLEDGE_HALF_LIFE_DAYS:-180}
    volumes:
      # Every finding, decision, token and archived scan output. Without this
      # a deploy destroys the lot, including the data a day of reprocessing
      # was spent repairing.
      - mykronos-data:/data
      # The App private key, read-only and outside the image. Spec 12 §2 puts
      # it in the "never in a repo, never in a layer" tier, and an image is a
      # layer somebody can pull.
      #
      # `:?` and not `:-/dev/null`. The default was a silent one: compose
      # mounted an empty file, the container started, the healthcheck went
      # green, and the platform ran with no GitHub credential at all. It fired
      # again on 2026-09-18 -- a recreate where the variable had not been
      # exported left /dev/null here for six minutes, reporting Healthy
      # throughout. `MYKRONOS_ADMIN_TOKEN` two blocks up already refuses this
      # way; there was no reason for the one credential that cannot be rotated
      # from inside the platform to be the lenient one.
      - ${MYKRONOS_GITHUB_APP_KEY_HOST_PATH:?set it in backend/.env — the host path to the App private key}:/secrets/github-app.pem:ro
    healthcheck:
      # python, not curl: curl is no longer in the image (its CVEs were 4 of
      # the highs the platform's own scan found), and compose's healthcheck
      # overrides the image's - so leaving this line would call a binary that
      # is gone and report a working service as unhealthy.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/healthz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default
      # Concourse's own network, joined rather than published: its API is on
      # loopback only, and `host.docker.internal` maps to the host's gateway
      # address rather than to 127.0.0.1, so from a container there is no
      # route to it otherwise. Read-only traffic in one direction - nothing
      # in Concourse can reach back through this.
      - concourse

  frontend:
    image: ${MYKRONOS_IMAGE_FRONTEND:-mykronos-frontend:latest}
    container_name: mykronos-frontend
    restart: unless-stopped
    # Same as the backend: no privilege to start with, none to gain.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      # Service name, not a host IP: these two share a compose network and
      # Docker's resolver works between them. The garden-container DNS problem
      # that forced IPs in the pipeline does not apply here.
      MYKRONOS_API_URL: http://backend:8100
      MYKRONOS_ADMIN_TOKEN: ${MYKRONOS_ADMIN_TOKEN:?set it in backend/.env}
      MYKRONOS_GATE_TOKEN: ${MYKRONOS_GATE_TOKEN:?set it in backend/.env}
    healthcheck:
      # `/nodejs/bin/node`, not `node`. The frontend image is distroless
      # now: there is no shell, nothing is on PATH, and the binary sits at an
      # absolute path. Compose's healthcheck overrides the image's, so this
      # line kept calling a name that no longer resolves and reported a
      # container serving 200s as unhealthy for a day.
      #
      # Same trap as curl, one base image later. The rule that survives both:
      # a healthcheck must name something the image is known to contain, and
      # the image is the only place that knows.
      #
      # `/api/healthz`, not `/`. Until 2026-08-25 this fetched the portfolio
      # page — `force-dynamic`, `cache: "no-store"`, one backend call per
      # render — so the check ran Next.js, the backend and a DuckDB aggregate
      # before it would answer. Under CI load that took 3-10s against the 5s
      # timeout below, and the container reported `unhealthy` while serving
      # 200s to every real request. It also meant a backend blip marked the
      # *frontend* unhealthy, which is the backend healthcheck's job to
      # report from the container that can do something about it.
      #
      # `/api/healthz` touches nothing. If it answers, this process is up and
      # routing works, which is the whole claim a container should make about
      # itself.
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://localhost:3100/api/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      # 10s, not 5s. The endpoint is trivial now, so this is headroom for a
      # contended box rather than time for real work: both Concourse workers
      # can be at 600% CPU on this host, and a scheduling delay is not a
      # failing service.
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mykronos-data:

networks:
  default:
  # Created by deploy/concourse/docker-compose.yml. External, because that
  # stack owns it: bringing this one up must not create a half-configured
  # network that the real Concourse then cannot join.
  concourse:
    external: true
    name: mykronos-concourse_concourse
