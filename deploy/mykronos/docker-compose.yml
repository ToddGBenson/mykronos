# Mykronos, deployed (spec 15 §2, D-038).
#
# The deploy target decided in D-038: this host, in Docker, behind the
# Cloudflare tunnel that already fronts mykronos.toddbenson.net. Not a new
# idea -- TheHub runs twelve containers here the same way -- and it retires a
# class of failure that cost real time: six manual backend restarts in a
# session, an orphaned dev server degrading for two days, port collisions, and
# a hand-typed bind that a reboot forgets.
#
#   docker compose --env-file ../../backend/.env up -d
#
# The tunnel's ingress already splits this hostname by path: /api, /webhooks,
# /healthz and the docs to 8100, everything else to 3100. Both ports are
# published on 127.0.0.1 only; cloudflared reaches them there.

name: mykronos

services:
  backend:
    image: ${MYKRONOS_IMAGE_BACKEND:-mykronos-backend:latest}
    container_name: mykronos-backend
    restart: unless-stopped
    ports:
      # All interfaces, not loopback. Concourse task containers reach this by
      # host IP -- they resolve through public DNS and have never heard of
      # `host.docker.internal` -- so a loopback publish is invisible to the
      # pipeline that feeds the lake. The perimeter gate protects it either
      # way, and it is already reachable from the internet through the tunnel,
      # so LAN exposure is strictly smaller than what is already true.
      - "8100:8100"
    environment:
      # Secrets come from --env-file, never from this file. The gate token,
      # the admin token and the webhook secret are all in backend/.env, which
      # is gitignored (spec 12 §2).
      MYKRONOS_GATE_TOKEN: ${MYKRONOS_GATE_TOKEN:?set it in backend/.env}
      MYKRONOS_ADMIN_TOKEN: ${MYKRONOS_ADMIN_TOKEN:?set it in backend/.env}
      MYKRONOS_VIEWER_TOKEN: ${MYKRONOS_VIEWER_TOKEN:-}
      MYKRONOS_GITHUB_WEBHOOK_SECRET: ${MYKRONOS_GITHUB_WEBHOOK_SECRET:-}
      MYKRONOS_GITHUB_APP_ID: ${MYKRONOS_GITHUB_APP_ID:-}
      # Mounted read-only below. The container never holds a copy.
      MYKRONOS_GITHUB_APP_PRIVATE_KEY_PATH: /secrets/github-app.pem
      MYKRONOS_INGESTION_API_URL: ${MYKRONOS_INGESTION_API_URL:-https://mykronos.toddbenson.net}

      # Reading Concourse back (spec 15 §4a). Two URLs because they genuinely
      # differ: this container reaches Concourse by service name across the
      # shared network below, and a person clicking a link reaches it on
      # loopback. A link to http://concourse:8080 resolves nowhere in a
      # browser, which is the sort of thing that looks fine until somebody
      # clicks it.
      MYKRONOS_CONCOURSE_URL: ${MYKRONOS_CONCOURSE_URL:-http://concourse:8080}
      MYKRONOS_CONCOURSE_EXTERNAL_URL: ${MYKRONOS_CONCOURSE_EXTERNAL_URL:-http://localhost:8080}
      MYKRONOS_CONCOURSE_TEAM: ${MYKRONOS_CONCOURSE_TEAM:-main}

      # Auto-routing (spec 19 §4). Same lesson as the Slack block below, met
      # again: `MYKRONOS_ROUTING_ENABLED=true` was set in backend/.env, the
      # stack was redeployed, and the setting read `False` in the container
      # because nothing passed it. Compose interpolates only the names listed
      # here — an env file is not an environment.
      #
      # Defaulted to the code default rather than to `true`: turning this on
      # is a per-deployment decision (it opens issues in somebody's tracker),
      # and a compose file that flips it for everyone who pulls would be
      # making that decision on their behalf.
      MYKRONOS_ROUTING_ENABLED: ${MYKRONOS_ROUTING_ENABLED:-false}

      # Alerting (spec 16 §12). Empty by default and nothing is posted -- but
      # it has to be *passed* to be settable at all, and without these two
      # lines `mykronos.notify` could never fire in the deployed stack no
      # matter what backend/.env said. A notifier that is wired everywhere
      # except the one process that runs is worse than no notifier: it looks
      # configured.
      MYKRONOS_SLACK_WEBHOOK_URL: ${MYKRONOS_SLACK_WEBHOOK_URL:-}
      MYKRONOS_SLACK_NOTIFY_MIN_SEVERITY: ${MYKRONOS_SLACK_NOTIFY_MIN_SEVERITY:-high}
    volumes:
      # Every finding, decision, token and archived scan output. Without this
      # a deploy destroys the lot, including the data a day of reprocessing
      # was spent repairing.
      - mykronos-data:/data
      # The App private key, read-only and outside the image. Spec 12 §2 puts
      # it in the "never in a repo, never in a layer" tier, and an image is a
      # layer somebody can pull.
      - ${MYKRONOS_GITHUB_APP_KEY_HOST_PATH:-/dev/null}:/secrets/github-app.pem:ro
    healthcheck:
      # python, not curl: curl is no longer in the image (its CVEs were 4 of
      # the highs the platform's own scan found), and compose's healthcheck
      # overrides the image's - so leaving this line would call a binary that
      # is gone and report a working service as unhealthy.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/healthz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default
      # Concourse's own network, joined rather than published: its API is on
      # loopback only, and `host.docker.internal` maps to the host's gateway
      # address rather than to 127.0.0.1, so from a container there is no
      # route to it otherwise. Read-only traffic in one direction - nothing
      # in Concourse can reach back through this.
      - concourse

  frontend:
    image: ${MYKRONOS_IMAGE_FRONTEND:-mykronos-frontend:latest}
    container_name: mykronos-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      # Service name, not a host IP: these two share a compose network and
      # Docker's resolver works between them. The garden-container DNS problem
      # that forced IPs in the pipeline does not apply here.
      MYKRONOS_API_URL: http://backend:8100
      MYKRONOS_ADMIN_TOKEN: ${MYKRONOS_ADMIN_TOKEN:?set it in backend/.env}
      MYKRONOS_GATE_TOKEN: ${MYKRONOS_GATE_TOKEN:?set it in backend/.env}
    healthcheck:
      # `/nodejs/bin/node`, not `node`. The frontend image is distroless
      # now: there is no shell, nothing is on PATH, and the binary sits at an
      # absolute path. Compose's healthcheck overrides the image's, so this
      # line kept calling a name that no longer resolves and reported a
      # container serving 200s as unhealthy for a day.
      #
      # Same trap as curl, one base image later. The rule that survives both:
      # a healthcheck must name something the image is known to contain, and
      # the image is the only place that knows.
      #
      # `/api/healthz`, not `/`. Until 2026-08-25 this fetched the portfolio
      # page — `force-dynamic`, `cache: "no-store"`, one backend call per
      # render — so the check ran Next.js, the backend and a DuckDB aggregate
      # before it would answer. Under CI load that took 3-10s against the 5s
      # timeout below, and the container reported `unhealthy` while serving
      # 200s to every real request. It also meant a backend blip marked the
      # *frontend* unhealthy, which is the backend healthcheck's job to
      # report from the container that can do something about it.
      #
      # `/api/healthz` touches nothing. If it answers, this process is up and
      # routing works, which is the whole claim a container should make about
      # itself.
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://localhost:3100/api/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      # 10s, not 5s. The endpoint is trivial now, so this is headroom for a
      # contended box rather than time for real work: both Concourse workers
      # can be at 600% CPU on this host, and a scheduling delay is not a
      # failing service.
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mykronos-data:

networks:
  default:
  # Created by deploy/concourse/docker-compose.yml. External, because that
  # stack owns it: bringing this one up must not create a half-configured
  # network that the real Concourse then cannot join.
  concourse:
    external: true
    name: mykronos-concourse_concourse
