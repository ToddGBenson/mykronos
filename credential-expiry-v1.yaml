# Credentials MyKronos cannot observe, declared (TheHub #61104).
#
# MyKronos reads agent credentials, read tokens and ingestion tokens from its
# own database, so those never appear here. Everything below lives somewhere
# MyKronos cannot see (a CI server, an OAuth provider, a GitHub App, a secrets
# store), so its expiry is written down by a person and reviewed in a pull
# request like any other declared config.
#
# METADATA ONLY. No secret value, token fragment, hostname or address goes in
# this file; the repository is public. `tests/test_credential_expiry.py`
# refuses a file that carries a field outside the list below.
#
# Each entry:
#   name          unique, stable label
#   kind          what sort of credential it is (free text, e.g. ci-token)
#   owner         who renews it
#   expires_at    ISO 8601 date or datetime (UTC), the day it stops working
#   rotate_by     alternative to expires_at: the day policy says to rotate it
#   renewal_step  the exact step a person takes to renew it
#
# An entry with neither date is listed by the API as *undated*, never skipped:
# a credential nobody has dated is exactly the one that lapses by surprise.
# Fill the dates in from the system of record when you renew each one.
version: 1
credentials:
  - name: concourse-fly-token
    kind: ci-token
    owner: operator
    expires_at: null
    renewal_step: "Log in again with fly, then store the new token in the secrets store the pipelines read."
  - name: google-oauth-tasks-calendar
    kind: oauth
    owner: operator
    expires_at: null
    renewal_step: "Re-authorise the Google integration and confirm Tasks and Calendar answer."
  - name: github-app-private-key
    kind: github-app-key
    owner: operator
    expires_at: null
    renewal_step: "Generate a new private key on the GitHub App, replace the key file, then delete the old key on GitHub."
  - name: vault-service-token
    kind: vault-token
    owner: operator
    expires_at: null
    renewal_step: "Renew or re-issue the token in Vault and update the consumers that hold it."
